t taxonomy, vulnerability assessment, and risk quantification to provide meaningful support to security analysts and decision-makers.",uc:1,depth:1,children:[{id:"uc1-fondamenti",title:"Fondamenti di sicurezza informatica",explanation:"The foundational principles that underpin all cybersecurity practice. Understanding these concepts is essential because every technical control, policy decision, and incident response traces back to core security principles like confidentiality, defense in depth, and least privilege.",uc:1,depth:2,children:[{id:"uc1-fondamenti-triade-cia",title:"Triade CIA",explanation:"The CIA Triad — Confidentiality, Integrity, and Availability — is the three-pillar framework that defines the goals of information security. Every security control exists to protect one or more of these properties. A technician uses the triad as a mental model to categorize risks and evaluate whether a given vulnerability threatens confidentiality, integrity, availability, or a combination.",uc:1,depth:3,children:[{id:"uc1-fondamenti-triade-cia-confidenzialita",title:"Confidenzialità",explanation:"Confidentiality ensures that information is accessible only to those authorized to have access. For a cybersecurity technician, this means understanding encryption, access controls, and secure protocols as the primary mechanisms that prevent unauthorized data disclosure. Every breach investigation fundamentally asks: who should have had access, and how was that boundary crossed?",uc:1,depth:4,children:[]},{id:"uc1-fondamenti-triade-cia-integrita",title:"Integrità",explanation:"Integrity guarantees that data has not been altered, corrupted, or tampered with in an unauthorized manner. Hash functions, digital signatures, and version control are the tools that enforce integrity. A technician must recognize that integrity violations can be as damaging as confidentiality breaches — manipulated data can lead to wrong decisions, financial loss, or safety hazards.",uc:1,depth:4,children:[]},{id:"uc1-fondamenti-triade-cia-disponibilita",title:"Disponibilità",explanation:"Availability ensures that systems and data are accessible when needed by authorized users. Denial-of-service attacks, hardware failures, and ransomware directly threaten availability. A technician must design resilient architectures with redundancy, failover mechanisms, and disaster recovery plans to maintain operational continuity under adverse conditions.",uc:1,depth:4,children:[]}]},{id:"uc1-fondamenti-principi-derivati",title:"Principi derivati",explanation:"Derived principles extend the CIA Triad into actionable security doctrines. These principles guide the design of security architectures, the allocation of privileges, and the organizational structures that prevent abuse. They represent hard-won lessons from decades of security practice.",uc:1,depth:3,children:[{id:"uc1-fondamenti-principi-minimo-privilegio",title:"Minimo privilegio",explanation:"The principle of least privilege states that every user, process, and system component should operate with the minimum permissions necessary to perform its function. This limits the blast radius of a compromise — if an account is hijacked, the attacker gains only limited access. A technician applies this by configuring tight permission sets, disabling unnecessary services, and enforcing role-based access.",uc:1,depth:4,children:[]},{id:"uc1-fondamenti-principi-difesa-profondita",title:"Difesa in profondità",explanation:"Defense in depth is the strategy of layering multiple independent security controls so that if one fails, others still provide protection. No single control is perfect, but overlapping controls — firewalls, intrusion detection, encryption, access controls, physical security — create a resilient architecture. A technician must understand how layers complement each other and avoid single points of failure.",uc:1,depth:4,children:[]},{id:"uc1-fondamenti-principi-separazione-compiti",title:"Separazione dei compiti",explanation:"Separation of duties ensures that no single individual has complete control over a critical process. By dividing responsibilities among multiple people or systems, organizations prevent fraud, errors, and insider threats. A technician implements this through access control matrices, approval workflows, and audit trails that document who did what.",uc:1,depth:4,children:[]},{id:"uc1-fondamenti-principi-non-ripudio",title:"Non ripudio",explanation:"Non-repudiation provides undeniable proof that a specific action was performed by a specific entity. Digital signatures, audit logs, and transaction records create accountability. For a technician, non-repudiation is critical in incident investigations and legal proceedings — it establishes who accessed what, when, and from where.",uc:1,depth:4,children:[]},{id:"uc1-fondamenti-principi-accountability",title:"Accountability",explanation:"Accountability ensures that actions can be traced to the responsible party. It relies on strong authentication, comprehensive logging, and regular audits. Without accountability, organizations cannot detect misuse, investigate incidents, or enforce policies. A technician must ensure that every system produces reliable, tamper-evident logs.",uc:1,depth:4,children:[]}]},{id:"uc1-fondamenti-modelli-controllo",title:"Modelli di controllo",explanation:"Security controls are categorized by their timing and purpose relative to security events. Understanding these categories helps a technician design comprehensive security programs that address threats before, during, and after incidents.",uc:1,depth:3,children:[{id:"uc1-fondamenti-modelli-preventivo",title:"Preventivo",explanation:"Preventive controls aim to stop security incidents before they occur. Firewalls, encryption, access controls, and security awareness training are all preventive measures. These are the most cost-effective controls because preventing a breach is far less expensive than recovering from one. A technician prioritizes preventive controls in the security architecture.",uc:1,depth:4,children:[]},{id:"uc1-fondamenti-modelli-rilevativo",title:"Rilevativo",explanation:"Detective controls identify security incidents that have already occurred or are in progress. Intrusion detection systems, log monitoring, and security audits fall into this category. These controls are essential because no preventive measure is perfect — detective capabilities provide the early warning needed to minimize damage.",uc:1,depth:4,children:[]},{id:"uc1-fondamenti-modelli-correttivo",title:"Correttivo",explanation:"Corrective controls mitigate the damage after a security incident has been detected. Incident response procedures, backup restoration, and patch deployment are corrective measures. A technician must have these controls documented, tested, and ready to execute because the speed of response directly impacts the severity of a breach.",uc:1,depth:4,children:[]},{id:"uc1-fondamenti-modelli-deterrente",title:"Deterrente",explanation:"Deterrent controls discourage potential attackers by increasing the perceived risk or effort of an attack. Warning banners, visible security cameras, and threat of legal prosecution serve as deterrents. While not directly preventing attacks, they reduce the pool of threats by making targets less attractive compared to easier alternatives.",uc:1,depth:4,children:[]}]}]},{id:"uc1-linux",title:"Linux Security Foundations",explanation:"Linux is the dominant operating system in servers, cloud infrastructure, security appliances, and IoT devices. A cybersecurity technician must understand Linux architecture deeply — not just how to use it, but how its kernel, process model, permission system, and networking stack can be leveraged for security or exploited by attackers.",uc:1,depth:2,children:[{id:"uc1-linux-architettura-kernel",title:"Architettura kernel",explanation:"The Linux kernel is the core of the operating system, managing hardware resources and providing the foundation for all security mechanisms. Understanding kernel architecture is essential because many vulnerabilities and security features operate at this level — from privilege rings to system call filtering.",uc:1,depth:3,children:[{id:"uc1-linux-architettura-kernel-space",title:"Kernel space",explanation:"Kernel space is the privileged execution environment where the operating system’s core functions run with full hardware access and unrestricted memory privileges. It is the most protected zone of the system. Understanding kernel space is critical because successful kernel-level compromise means total system control — this is why kernel vulnerabilities are the most severe class of security flaws.",uc:1,depth:4,children:[]},{id:"uc1-linux-architettura-user-space",title:"User space",explanation:"User space is where applications and user processes execute under restricted privileges, isolated from direct hardware access. The boundary between user space and kernel space is enforced by the CPU’s privilege rings. A technician must understand this separation because most security exploits attempt to break out of user space into kernel space to escalate privileges.",uc:1,depth:4,children:[]},{id:"uc1-linux-architettura-system-calls",title:"System calls",explanation:"System calls are the controlled gateways through which user-space programs request kernel services. They represent the attack surface at the user-kernel boundary. Security mechanisms like seccomp and system call filtering restrict which calls a process can make, reducing exposure. A technician uses these mechanisms to contain potentially compromised applications.",uc:1,depth:4,children:[]},{id:"uc1-linux-architettura-privilege-rings",title:"Privilege rings",explanation:"Privilege rings are CPU-enforced levels of access permission, with Ring 0 being the most privileged (kernel mode) and Ring 3 being the least (user mode). Modern CPUs may have additional rings for hypervisors. This hardware-enforced hierarchy is the foundation of operating system security — it prevents user applications from accessing protected resources or interfering with each other.",uc:1,depth:4,children:[]}]},{id:"uc1-linux-gestione-processi",title:"Gestione processi",explanation:"Process management is central to Linux security because every running program is a process, and understanding how processes are created, scheduled, and controlled is essential for detecting anomalies, restricting capabilities, and investigating incidents.",uc:1,depth:3,children:[{id:"uc1-linux-gestione-stati-processo",title:"Stati del processo",explanation:"Processes in Linux transition through states: running, waiting, stopped, and zombie. Understanding process states helps a technician identify abnormal behavior — zombie processes may indicate software bugs, while unexpectedly stopped processes could signal an attack or system instability. Process monitoring tools use these states to assess system health.",uc:1,depth:4,children:[]},{id:"uc1-linux-gestione-scheduling",title:"Scheduling",explanation:"The Linux scheduler determines which process runs on the CPU and for how long. While primarily a performance concern, scheduling also has security implications — denial-of-service attacks can exploit scheduler behavior, and real-time scheduling priorities can be abused to starve other processes. A technician must recognize scheduling anomalies during incident response.",uc:1,depth:4,children:[]},{id:"uc1-linux-gestione-segnali-ipc",title:"Segnali e IPC",explanation:"Signals and Inter-Process Communication (IPC) mechanisms allow processes to coordinate and exchange data. These mechanisms can be exploited for privilege escalation, code injection, and covert channels. A technician must understand IPC because attackers often abuse shared memory, message queues, or signal handlers to move laterally or exfiltrate data.",uc:1,depth:4,children:[]}]},{id:"uc1-linux-gestione-memoria",title:"Gestione memoria",explanation:"Memory management directly impacts security because many attacks exploit memory-related vulnerabilities. Understanding virtual memory, address space layout, and buffer behavior is essential for vulnerability analysis and exploit mitigation.",uc:1,depth:3,children:[{id:"uc1-linux-memoria-virtuale",title:"Memoria virtuale",explanation:"Virtual memory provides each process with an isolated address space, preventing one process from accessing another’s memory. This isolation is a fundamental security boundary. When virtual memory protections fail — through vulnerabilities like use-after-free or arbitrary read/write — the entire system’s security model collapses. A technician must understand these mechanisms to assess memory-related vulnerabilities.",uc:1,depth:4,children:[]},{id:"uc1-linux-memoria-paginazione",title:"Paginazione",explanation:"Pagination divides memory into fixed-size pages managed by the kernel, mapping virtual addresses to physical frames. Page table permissions (read, write, execute) enforce memory protection at the hardware level. Attackers who can manipulate page tables gain arbitrary memory access, while security mechanisms like NX bit (no-execute) use pagination to prevent code execution in data regions.",uc:1,depth:4,children:[]},{id:"uc1-linux-memoria-buffer-stack",title:"Buffer e stack",explanation:"Buffers and the call stack are regions of memory frequently targeted by exploits. Stack-based buffer overflows overwrite return addresses to hijack program execution. Modern protections like stack canaries, ASLR (Address Space Layout Randomization), and non-executable stacks exist specifically to mitigate these attacks. A technician must understand both the attack techniques and the defenses.",uc:1,depth:4,children:[]}]},{id:"uc1-linux-filesystem-permessi",title:"Filesystem e permessi",explanation:"The Linux filesystem permission model is the primary mechanism for controlling access to data. Understanding inodes, permission bits, special permissions, and access control lists is fundamental to securing files, detecting misconfigurations, and investigating unauthorized access.",uc:1,depth:3,children:[{id:"uc1-linux-fs-inode",title:"Struttura inode",explanation:"An inode is a data structure that stores metadata about a file — permissions, ownership, size, timestamps, and pointers to data blocks. Every file has exactly one inode. Understanding inodes is important for forensics because inode metadata reveals when a file was accessed, modified, or created, even if the filename is changed or deleted.",uc:1,depth:4,children:[]},{id:"uc1-linux-fs-links",title:"Hard link e symbolic link",explanation:"Hard links are additional directory entries pointing to the same inode, while symbolic links are separate files containing a path reference. From a security perspective, hard links can preserve access to files even after the original directory entry is removed, and symbolic links can be exploited for path traversal attacks. A technician must audit link usage during security assessments.",uc:1,depth:4,children:[]},{id:"uc1-linux-fs-permessi-posix",title:"Permessi POSIX UGO",explanation:"POSIX permissions define read, write, and execute access for three categories: User (owner), Group, and Others. These nine permission bits are the baseline access control in Linux. Misconfigured permissions — such as world-writable files or setuid binaries — are among the most common vulnerabilities found during security audits.",uc:1,depth:4,children:[]},{id:"uc1-linux-fs-notazione-ottale",title:"Notazione ottale",explanation:"Octal notation is the compact numeric representation of POSIX permissions, where each permission type has a value: read (4), write (2), execute (1). The sum of values for each UGO category produces a three-digit code like 755 or 640. A technician must read and interpret octal permissions fluently during audits and hardening activities.",uc:1,depth:4,children:[{id:"uc1-linux-fs-ottale-lettura",title:"Lettura (4)",explanation:"The read permission, valued at 4 in octal notation, grants the ability to view file contents or list directory entries. Removing read permission is a basic confidentiality control. A technician uses this to enforce the principle of least privilege — ensuring users can only read files necessary for their role.",uc:1,depth:5,children:[]},{id:"uc1-linux-fs-ottale-scrittura",title:"Scrittura (2)",explanation:"The write permission, valued at 2, grants the ability to modify, delete, or create files. Write permission is the most dangerous because it enables data destruction and malware installation. A technician must carefully restrict write access, especially for system binaries, configuration files, and log directories.",uc:1,depth:5,children:[]},{id:"uc1-linux-fs-ottale-esecuzione",title:"Esecuzione (1)",explanation:"The execute permission, valued at 1, grants the ability to run a file as a program or traverse a directory. Execute permission on directories allows users to access files within them even without read permission on the directory itself. This distinction is critical for security hardening and is often misunderstood.",uc:1,depth:5,children:[]}]},{id:"uc1-linux-fs-permessi-speciali",title:"Permessi speciali",explanation:"Special permission bits — SUID, SGID, and Sticky Bit — modify the standard permission model for specific security purposes. They are powerful but dangerous when misconfigured, and are a primary target during privilege escalation assessments.",uc:1,depth:4,children:[{id:"uc1-linux-fs-suid",title:"SUID",explanation:"Set User ID (SUID) causes an executable to run with the permissions of its owner rather than the invoking user. It enables ordinary users to perform privileged operations through controlled interfaces. However, SUID binaries are a major attack surface — vulnerabilities in SUID programs allow immediate privilege escalation from user to root. Technicians must audit all SUID binaries.",uc:1,depth:5,children:[]},{id:"uc1-linux-fs-sgid",title:"SGID",explanation:"Set Group ID (SGID) causes an executable to run with its group’s permissions, or causes new files in a directory to inherit the directory’s group. It enables collaborative directories and controlled access sharing. Like SUID, SGID binaries must be carefully audited because they can be exploited for unauthorized group privilege escalation.",uc:1,depth:5,children:[]},{id:"uc1-linux-fs-sticky-bit",title:"Sticky bit",explanation:"The sticky bit on a directory restricts file deletion so that only the file owner, directory owner, or root can delete files within it. It is most commonly set on shared directories like /tmp. Without the sticky bit, any user could delete or rename another user’s files in a shared directory.",uc:1,depth:5,children:[]}]},{id:"uc1-linux-fs-acl",title:"ACL estese",explanation:"Access Control Lists (ACLs) extend the standard UGO permission model by allowing granular, per-user and per-group permissions on files and directories. ACLs enable fine-grained access control that POSIX permissions alone cannot express. A technician must be able to read and audit ACL configurations using getfacl and setfacl.",uc:1,depth:4,children:[]},{id:"uc1-linux-fs-extended-attributes",title:"Extended attributes",explanation:"Extended attributes are name-value pairs attached to files that store additional metadata beyond the inode. They can hold security labels (for SELinux/AppArmor), capabilities, or arbitrary application data. Security frameworks use extended attributes to enforce mandatory access control policies that supplement traditional discretionary permissions.",uc:1,depth:4,children:[]}]},{id:"uc1-linux-utenti-gruppi",title:"Utenti e gruppi",explanation:"User and group management is the foundation of access control in Linux. Every process runs as a user, and every file is owned by a user and group. Understanding the user database, authentication stores, and privilege delegation mechanisms is essential for securing multi-user systems.",uc:1,depth:3,children:[{id:"uc1-linux-utenti-user-database",title:"User database",explanation:"The user database, stored in /etc/passwd, defines user accounts with their numeric UIDs, home directories, and default shells. While passwords were historically stored here, modern systems keep password hashes in /etc/shadow. A technician must understand the user database structure because account enumeration is a common reconnaissance technique and misconfigurations can expose sensitive information.",uc:1,depth:4,children:[]},{id:"uc1-linux-utenti-password-stores",title:"Password stores",explanation:"Password hashes in /etc/shadow are protected with cryptographic hashing algorithms. The security of these hashes depends on the algorithm strength (SHA-512, bcrypt) and the use of salts. A technician must verify that weak or legacy hashing algorithms are not in use, as compromised password hashes can lead to credential-based lateral movement across systems.",uc:1,depth:4,children:[]},{id:"uc1-linux-utenti-group-definitions",title:"Group definitions",explanation:"Groups in /etc/group organize users into permission sets. A user’s effective group list determines their access rights across the filesystem. Group management is critical for the principle of least privilege — users should belong only to groups necessary for their role, and shared group memberships must be regularly audited.",uc:1,depth:4,children:[]},{id:"uc1-linux-utenti-wheel-sudoers",title:"Wheel e sudoers",explanation:"The wheel group and /etc/sudoers configuration control privilege escalation from ordinary users to root. Sudo provides fine-grained, auditable privilege delegation. Misconfigured sudo rules — such as allowing passwordless sudo or overly broad command permissions — are a common finding in security assessments and a primary target for attackers.",uc:1,depth:4,children:[]}]},{id:"uc1-linux-shell-scripting",title:"Shell e scripting",explanation:"Shell scripting is the automation layer of Linux administration and security operations. Understanding variables, conditionals, loops, I/O redirection, and regular expressions enables a technician to write security tools, automate log analysis, and build incident response playbooks.",uc:1,depth:3,children:[{id:"uc1-linux-shell-variabili",title:"Variabili",explanation:"Variables in shell scripting store data that scripts use for configuration, input processing, and state tracking. Environment variables like PATH and HOME affect program behavior system-wide. From a security perspective, variable injection and improper sanitization of variable contents are common sources of command injection vulnerabilities in scripts.",uc:1,depth:4,children:[]},{id:"uc1-linux-shell-condizionali",title:"Strutture condizionali",explanation:"Conditional structures (if/then/else, case) enable scripts to make decisions based on input or system state. Security scripts use conditionals to validate inputs, check file permissions, and branch based on environment. A technician writes conditional logic to create adaptive security tools that respond differently to different threat indicators.",uc:1,depth:4,children:[]},{id:"uc1-linux-shell-cicli",title:"Cicli iterativi",explanation:"Loop constructs (for, while, until) enable repetitive operations over collections of files, network addresses, or log entries. Security automation — such as bulk log parsing, port scanning, or batch permission audits — relies heavily on loops. A technician must write efficient, properly bounded loops to avoid resource exhaustion.",uc:1,depth:4,children:[]},{id:"uc1-linux-shell-canali-io",title:"Canali I/O",explanation:"Standard I/O channels — stdin, stdout, stderr — are the fundamental data streams that connect programs in the Unix philosophy. Every process has these three channels, and understanding their behavior is essential for building security pipelines and capturing forensic evidence.",uc:1,depth:4,children:[{id:"uc1-linux-shell-stdin",title:"stdin",explanation:"Standard input is the default source of data for a process, typically the keyboard or a redirected file. In security contexts, stdin is how tools receive data feeds, password prompts, and configuration input. Attackers can exploit programs that read untrusted input from stdin without proper validation.",uc:1,depth:5,children:[]},{id:"uc1-linux-shell-stdout",title:"stdout",explanation:"Standard output is the default destination for program output, typically the terminal. Security scripts redirect stdout to files for log collection, to pipes for chaining analysis tools, or suppress it when only errors matter. Output capture is fundamental to security monitoring and evidence preservation.",uc:1,depth:5,children:[]},{id:"uc1-linux-shell-stderr",title:"stderr",explanation:"Standard error is the dedicated output stream for diagnostic and error messages, separate from stdout. This separation is crucial for security scripting because it allows error detection even when stdout is redirected or piped. Monitoring stderr streams is a common technique for identifying anomalous program behavior.",uc:1,depth:5,children:[]}]},{id:"uc1-linux-shell-reindirizzamento",title:"Reindirizzamento",explanation:"I/O redirection allows a technician to control where programs read input from and write output to. This is a fundamental skill for security operations, from capturing command output to feeding data into analysis tools.",uc:1,depth:4,children:[{id:"uc1-linux-shell-reind-output",title:"Output",explanation:"Output redirection (>) sends stdout to a file instead of the terminal, overwriting existing content. Technicians use output redirection to save command results, capture logs, and generate reports. Understanding when output is overwritten versus appended is critical for evidence preservation.",uc:1,depth:5,children:[]},{id:"uc1-linux-shell-reind-append",title:"Append",explanation:"Append redirection (>>) adds stdout to the end of an existing file without overwriting. This is essential for cumulative log collection and audit trail maintenance. A technician uses append mode to build historical datasets without destroying previously captured evidence.",uc:1,depth:5,children:[]},{id:"uc1-linux-shell-reind-input",title:"Input",explanation:"Input redirection (<) reads data from a file instead of the keyboard. Security scripts use input redirection to process saved logs, wordlists for password auditing, or configuration files. This technique enables batch processing of large datasets without manual data entry.",uc:1,depth:5,children:[]},{id:"uc1-linux-shell-reind-pipe",title:"Pipe",explanation:'The pipe operator (|) connects the stdout of one command to the stdin of another, creating processing pipelines. This is the most powerful pattern in shell scripting — complex security analyses are built by chaining simple tools. For example: cat access.log | grep "404" | sort | uniq -c | sort -rn extracts the most common 404 errors.',uc:1,depth:5,children:[]}]},{id:"uc1-linux-shell-operatori-logici",title:"Operatori logici",explanation:"Logical operators (&&, ||, !) combine commands based on their exit status, enabling conditional execution chains. Security scripts use these operators to create robust workflows: proceed only if a check passes, or run a fallback action if a primary command fails. Proper use of logical operators makes scripts more reliable and fault-tolerant.",uc:1,depth:4,children:[]},{id:"uc1-linux-shell-regex",title:"Espressioni regolari",explanation:"Regular expressions are pattern-matching languages for searching, filtering, and extracting text. They are indispensable for log analysis, malware signature detection, and data validation. A technician uses regex with grep, sed, awk, and Python to parse security logs, detect indicators of compromise, and sanitize user input.",uc:1,depth:4,children:[]}]},{id:"uc1-linux-networking",title:"Networking Linux",explanation:"Linux networking encompasses the protocol stack, interfaces, routing, firewall frameworks, and socket APIs that enable communication. A cybersecurity technician must understand these components to configure secure networks, troubleshoot connectivity issues, and detect malicious traffic patterns.",uc:1,depth:3,children:[{id:"uc1-linux-net-stack-tcpip",title:"Stack TCP/IP",explanation:"The TCP/IP protocol stack is the foundation of network communication on Linux, implemented in the kernel. Understanding how packets flow through the network layers — from application to link layer and back — is essential for diagnosing network issues, configuring firewalls, and analyzing packet captures. Each layer has distinct security considerations.",uc:1,depth:4,children:[]},{id:"uc1-linux-net-interfacce",title:"Interfacce di rete",explanation:"Network interfaces are the hardware or virtual endpoints through which Linux systems communicate. Each interface has an IP address, MAC address, and configuration parameters. A technician must understand interface configuration for network segmentation, monitoring setup, and forensic identification of compromised systems through their network identity.",uc:1,depth:4,children:[]},{id:"uc1-linux-net-routing-table",title:"Routing table",explanation:"The routing table determines the path network packets take to reach their destination. Misconfigured routes can create asymmetric paths, bypass security controls, or create routing loops. Attackers who can modify routing tables redirect traffic through compromised intermediaries for man-in-the-middle attacks. A technician must audit routing configurations regularly.",uc:1,depth:4,children:[]},{id:"uc1-linux-net-netfilter",title:"Netfilter framework",explanation:"Netfilter is the Linux kernel framework for packet filtering, NAT, and connection tracking. It is the underlying engine for iptables, nftables, and UFW. Understanding netfilter means understanding how Linux inspects and controls every packet passing through the system. A technician configures netfilter-based tools to enforce network security policies.",uc:1,depth:4,children:[]},{id:"uc1-linux-net-socket-porte",title:"Socket e porte",explanation:"Sockets are the programming interface for network communication, and ports are the numeric identifiers that distinguish services on a host. Understanding the socket API and port allocation is essential for service discovery, firewall rule design, and detecting unauthorized listening processes that may indicate backdoors or compromised services.",uc:1,depth:4,children:[]}]},{id:"uc1-linux-servizi-demoni",title:"Servizi e demoni",explanation:"Services (daemons) are background processes that provide system functionality — from SSH access to web serving to logging. Each running service expands the attack surface. A technician must understand service management to minimize exposure, monitor health, and ensure reliable logging of security-relevant events.",uc:1,depth:3,children:[{id:"uc1-linux-servizi-systemd",title:"Systemd",explanation:"Systemd is the init system and service manager in modern Linux distributions. It controls service startup, dependency management, resource limits, and security sandboxing through unit files. A technician uses systemd to configure service isolation, restrict capabilities, and ensure critical security services start reliably on boot.",uc:1,depth:4,children:[]},{id:"uc1-linux-servizi-init",title:"Init system",explanation:"The init system is the first process started by the kernel (PID 1) and is responsible for booting the rest of the system. Understanding init systems — whether systemd, SysVinit, or OpenRC — is important for security because the init system controls which services run, in what order, and with what privileges. Compromising the init system means persistent, total control.",uc:1,depth:4,children:[]},{id:"uc1-linux-servizi-unit-types",title:"Unit types",explanation:"Systemd organizes managed objects into unit types: services (.service), timers (.timer), sockets (.socket), and targets (.target). Each unit type has security-relevant configuration options. Socket activation, for example, allows services to start on-demand rather than running continuously, reducing the attack surface. Technicians use unit types to optimize security and resource usage.",uc:1,depth:4,children:[]},{id:"uc1-linux-servizi-logging",title:"System logging",explanation:"System logging captures security-relevant events: authentication attempts, service startups, kernel messages, and application errors. Linux uses journald (systemd) and rsyslog for log management. A technician must ensure logs are comprehensive, tamper-protected, and forwarded to centralized analysis systems because logs are the primary source of forensic evidence.",uc:1,depth:4,children:[]}]},{id:"uc1-linux-hardening",title:"Linux hardening",explanation:"Linux hardening is the process of securing a system by reducing its attack surface, applying security frameworks, and configuring auditing. Hardening transforms a default installation into a defensible asset that resists common attack patterns and generates evidence for incident investigation.",uc:1,depth:3,children:[{id:"uc1-linux-hardening-minimizzazione",title:"Minimizzazione servizi",explanation:"Service minimization removes or disables all software and services that are not strictly required for the system’s function. Every installed package and running service is a potential vulnerability. The hardening process begins with a minimal installation and adds only necessary components. This dramatically reduces the attack surface and simplifies maintenance.",uc:1,depth:4,children:[]},{id:"uc1-linux-hardening-seccomp",title:"Seccomp",explanation:"Secure Computing Mode (seccomp) is a kernel feature that restricts the system calls a process can make. It creates a strict sandbox around untrusted code. Seccomp profiles define which syscalls are permitted; any other syscall causes the process to be terminated. This is a powerful defense-in-depth mechanism against unknown vulnerabilities in applications.",uc:1,depth:4,children:[]},{id:"uc1-linux-hardening-mac",title:"MAC frameworks",explanation:"Mandatory Access Control (MAC) frameworks like SELinux and AppArmor enforce security policies that the kernel applies regardless of user discretion. Unlike discretionary permissions that users can change, MAC policies are system-wide and mandatory. These frameworks provide granular control over what processes can access, significantly limiting the damage from compromised applications.",uc:1,depth:4,children:[]},{id:"uc1-linux-hardening-audit",title:"Audit framework",explanation:"The Linux Audit Framework (auditd) provides detailed, tamper-resistant logging of security-relevant events at the kernel level. It captures system calls, file access, authentication events, and configuration changes. A technician configures audit rules to monitor critical files and detect unauthorized activity that might evade application-level logging.",uc:1,depth:4,children:[]}]}]},{id:"uc1-networking",title:"Fondamenti di networking",explanation:"Computer networks are the infrastructure that connects systems, users, and services. Understanding network architecture, addressing, segmentation, routing, and services is fundamental to cybersecurity because most attacks traverse network boundaries. A technician must be fluent in network concepts to design secure topologies, analyze traffic, and respond to network-borne threats.",uc:1,depth:2,children:[{id:"uc1-net-modelli-strati",title:"Modelli a strati",explanation:"Layered networking models organize communication protocols into hierarchical levels, each with specific responsibilities. Understanding these layers enables a technician to isolate problems, apply security controls at the appropriate level, and interpret protocol behavior during incident analysis.",uc:1,depth:3,children:[{id:"uc1-net-modelli-incapsulamento",title:"Incapsulamento",explanation:"Encapsulation is the process of wrapping data from a higher-layer protocol within the payload of a lower-layer protocol. Each layer adds its own header with control information. Understanding encapsulation is essential for packet analysis — a technician reading a packet capture must peel back each layer’s headers to understand the full communication flow and detect anomalies at any layer.",uc:1,depth:4,children:[]},{id:"uc1-net-modelli-pdu",title:"PDU per strato",explanation:"Protocol Data Units are the names given to data at each layer of the networking model: bits at physical, frames at data link, packets at network, segments at transport, and data at application. Knowing the correct terminology helps a technician communicate precisely during incident response and understand which layer a security control operates on.",uc:1,depth:4,children:[]}]},{id:"uc1-net-indirizzamento",title:"Indirizzamento",explanation:"Network addressing provides unique identifiers for devices at different layers of the networking stack. Addressing schemes enable routing, delivery, and service location. A technician must understand addressing to configure networks, trace traffic, and identify spoofing or scanning activity.",uc:1,depth:3,children:[{id:"uc1-net-indirizzamento-mac",title:"Fisico (MAC)",explanation:"MAC addresses are hardware-level identifiers burned into network interface cards. They operate at the data link layer within a local network segment. MAC addresses are used for local delivery and can be spoofed. A technician uses MAC addresses for device identification, ARP table analysis, and detecting unauthorized devices on the local network.",uc:1,depth:4,children:[]},{id:"uc1-net-indirizzamento-ip",title:"Logico (IP)",explanation:"IP addresses are logical identifiers assigned at the network layer, enabling routing across interconnected networks. IPv4 and IPv6 provide the addressing scheme for global internet communication. Understanding IP addressing, including subnetting and CIDR notation, is essential for network design, firewall configuration, and analyzing network traffic patterns.",uc:1,depth:4,children:[]},{id:"uc1-net-indirizzamento-dns",title:"Risoluzione nomi",explanation:"Name resolution translates human-readable hostnames into IP addresses through the Domain Name System (DNS). DNS is a critical infrastructure service and a common attack target — cache poisoning, hijacking, and tunneling all exploit DNS. A technician must understand DNS to secure name resolution, detect DNS-based attacks, and investigate malicious domain activity.",uc:1,depth:4,children:[]}]},{id:"uc1-net-segmentazione",title:"Segmentazione",explanation:"Network segmentation divides a network into isolated subnetworks to contain breaches and control traffic flow. Proper segmentation is one of the most effective security controls because it limits lateral movement after an initial compromise.",uc:1,depth:3,children:[{id:"uc1-net-seg-collisione",title:"Dominio di collisione",explanation:"A collision domain is a network segment where frames can collide if two devices transmit simultaneously. Modern switched networks have largely eliminated collision domains, but understanding this concept helps a technician design efficient networks and recognize legacy shared-media topologies that may still exist in industrial or older environments.",uc:1,depth:4,children:[]},{id:"uc1-net-seg-broadcast",title:"Dominio di broadcast",explanation:"A broadcast domain is a logical network segment where broadcast frames are propagated to all devices. Large broadcast domains waste bandwidth and allow reconnaissance — an attacker can discover all devices through broadcast traffic. A technician segments broadcast domains using routers and VLANs to improve performance and security.",uc:1,depth:4,children:[]},{id:"uc1-net-seg-vlan",title:"VLAN",explanation:"Virtual LANs divide a physical network into multiple isolated broadcast domains at the switch level. Devices in different VLANs cannot communicate directly without a router. VLANs are a primary tool for network segmentation, enabling isolation of sensitive systems, guest networks, and management interfaces. Misconfigured VLANs (like VLAN hopping) create security vulnerabilities.",uc:1,depth:4,children:[]},{id:"uc1-net-seg-subnetting",title:"Subnetting",explanation:"Subnetting divides an IP network into smaller subnetworks by borrowing bits from the host portion of an address. This creates separate broadcast domains and enables hierarchical routing. A technician uses subnetting to design network layouts that support segmentation, optimize address allocation, and apply access controls between network zones.",uc:1,depth:4,children:[]}]},{id:"uc1-net-routing",title:"Routing",explanation:"Routing is the process of forwarding packets between networks based on destination IP addresses. Understanding routing is essential for network security because routing decisions determine traffic paths, and compromised routing can redirect traffic through attacker-controlled systems.",uc:1,depth:3,children:[{id:"uc1-net-routing-tabella",title:"Tabella di routing",explanation:"The routing table stores the paths to known network destinations, including directly connected networks, static routes, and dynamically learned routes. A technician inspects routing tables to diagnose connectivity issues, detect unauthorized routes that may indicate traffic redirection attacks, and verify that traffic follows expected secure paths.",uc:1,depth:4,children:[]},{id:"uc1-net-routing-gateway",title:"Gateway",explanation:"A gateway is a network node that serves as an entry and exit point for traffic between different networks, typically between a local network and the internet. The default gateway is the most critical routing configuration on any host — misconfiguration leads to connectivity loss, while a compromised gateway enables man-in-the-middle attacks against all traffic.",uc:1,depth:4,children:[]},{id:"uc1-net-routing-hop",title:"Hop",explanation:"A hop is each intermediate device (typically a router) that a packet passes through on its way to the destination. The number of hops affects latency and reliability. Traceroute uses hop-by-hop discovery to map network paths. A technician uses hop counts and traceroute output to diagnose routing anomalies and identify unexpected detours in traffic paths.",uc:1,depth:4,children:[]}]},{id:"uc1-net-servizi-rete",title:"Servizi di rete",explanation:"Network services are the application-layer protocols that enable users and systems to interact over the network. These services are both essential infrastructure and prime attack targets.",uc:1,depth:3,children:[{id:"uc1-net-servizi-dns",title:"DNS",explanation:"The Domain Name System translates domain names to IP addresses using a hierarchical, distributed database. DNS is critical infrastructure and a frequent attack vector: cache poisoning redirects users to malicious sites, DNS tunneling exfiltrates data, and amplification attacks abuse open resolvers. A technician must secure DNS through DNSSEC, filter queries, and monitor for anomalous patterns.",uc:1,depth:4,children:[]},{id:"uc1-net-servizi-dhcp",title:"DHCP",explanation:"The Dynamic Host Configuration Protocol automatically assigns IP addresses and network configuration to devices. Rogue DHCP servers can hijack network traffic by providing false gateway or DNS server addresses. A technician must protect DHCP infrastructure through DHCP snooping on switches and monitoring for unauthorized servers on the network.",uc:1,depth:4,children:[]},{id:"uc1-net-servizi-nat",title:"NAT",explanation:"Network Address Translation maps private IP addresses to public IP addresses, enabling multiple internal devices to share a single public address. NAT provides a basic form of network isolation by hiding internal topology from the internet. A technician configures NAT for outbound access while carefully managing port forwarding rules that expose internal services to external attackers.",uc:1,depth:4,children:[]}]}]},{id:"uc1-architettura",title:"Architettura dei sistemi informativi",explanation:"Information system architecture encompasses the hardware, software, network, and organizational components that process, store, and transmit data. Understanding how these components interact is essential for identifying vulnerabilities, designing secure systems, and mapping the attack surface of an organization.",uc:1,depth:2,children:[{id:"uc1-arch-componenti-hardware",title:"Componenti hardware",explanation:"Hardware components form the physical foundation of information systems. Physical security, hardware vulnerabilities, and supply chain integrity are critical concerns because software security cannot compensate for compromised hardware.",uc:1,depth:3,children:[{id:"uc1-arch-hw-client",title:"Client",explanation:"Client devices — desktops, laptops, workstations — are endpoints where users interact with systems. They are frequent targets because they have direct user access, run diverse software, and often leave the physical security of the office. A technician must secure clients through endpoint protection, disk encryption, patch management, and access controls.",uc:1,depth:4,children:[]},{id:"uc1-arch-hw-server",title:"Server",explanation:"Servers are centralized systems that provide services to clients — file storage, databases, applications, authentication. They are high-value targets because compromising a server often grants access to many users’ data. A technician hardens servers through minimal installation, strict access controls, network segmentation, and comprehensive monitoring.",uc:1,depth:4,children:[]},{id:"uc1-arch-hw-mobile",title:"Mobile",explanation:"Mobile devices — smartphones and tablets — present unique security challenges: they frequently connect to untrusted networks, are easily lost or stolen, run managed app ecosystems, and blend personal and corporate data. A technician must understand mobile device management (MDM), mobile threat defense, and the distinct attack surface of mobile platforms.",uc:1,depth:4,children:[]}]},{id:"uc1-arch-componenti-software",title:"Componenti software",explanation:"Software components process and store data, enforce business logic, and expose interfaces that attackers target. Every layer of the software stack — from the operating system to applications to databases — has distinct vulnerabilities and hardening requirements.",uc:1,depth:3,children:[{id:"uc1-arch-sw-os",title:"Sistema operativo",explanation:"The operating system manages hardware resources, provides the platform for applications, and enforces security boundaries between processes and users. OS vulnerabilities — in the kernel, system libraries, or configuration — can compromise the entire system. A technician must keep OS patches current, harden configurations, and monitor for signs of OS-level compromise.",uc:1,depth:4,children:[]},{id:"uc1-arch-sw-applicativi",title:"Applicativi",explanation:"Application software implements business functionality and directly processes sensitive data. Application vulnerabilities — injection flaws, authentication weaknesses, logic errors — are the most common attack vector. A technician supports application security through vulnerability scanning, secure configuration, input validation testing, and integration with web application firewalls.",uc:1,depth:4,children:[]},{id:"uc1-arch-sw-database",title:"Database",explanation:"Databases store the organization’s most valuable asset — its data. Database security involves access control, encryption, auditing, and protection against injection attacks. A technician must understand database hardening, query parameterization, and activity monitoring because database breaches expose the largest quantities of sensitive information.",uc:1,depth:4,children:[]}]},{id:"uc1-arch-infrastruttura-rete",title:"Infrastruttura di rete",explanation:"Network infrastructure connects all system components and provides the pathways for data flow. Network design directly impacts security posture — poorly designed networks allow unrestricted lateral movement, while well-designed networks contain breaches within isolated segments.",uc:1,depth:3,children:[{id:"uc1-arch-net-lan",title:"LAN",explanation:"A Local Area Network connects devices within a limited geographic area, such as an office building. LANs are where most internal threats operate because they provide high-speed, low-latency access to internal resources. A technician segments LANs, implements port security, and monitors for unauthorized devices and anomalous traffic patterns.",uc:1,depth:4,children:[]},{id:"uc1-arch-net-wan",title:"WAN",explanation:"A Wide Area Network connects geographically dispersed locations over longer distances, typically using leased lines or VPNs. WAN links are potential interception points and availability bottlenecks. A technician secures WAN traffic through encryption, implements redundant links for availability, and monitors WAN performance for signs of denial-of-service.",uc:1,depth:4,children:[]},{id:"uc1-arch-net-internet",title:"Internet",explanation:"The internet is the global public network that connects organizations to customers, partners, and cloud services. It is an untrusted, hostile environment where automated attacks constantly probe for vulnerabilities. A technician implements perimeter defenses, encrypted communications, and strict egress filtering to protect internal systems from internet-borne threats.",uc:1,depth:4,children:[]}]},{id:"uc1-arch-virtualizzazione",title:"Virtualizzazione e container",explanation:"Virtualization and containerization technologies enable multiple isolated workloads to share physical hardware. These technologies change the security model by introducing new layers of abstraction and new attack surfaces — hypervisor escapes, container breakouts, and image vulnerabilities.",uc:1,depth:3,children:[{id:"uc1-arch-virt-hypervisor",title:"Hypervisor Type 1/2",explanation:"A hypervisor is the software layer that creates and manages virtual machines. Type 1 (bare-metal) hypervisors run directly on hardware and are more secure; Type 2 (hosted) run on top of an operating system. Hypervisor vulnerabilities allow VM escape — breaking out of a virtual machine to access the host or other VMs. A technician must keep hypervisors patched and hardened.",uc:1,depth:4,children:[]},{id:"uc1-arch-virt-vm-isolation",title:"VM isolation",explanation:"Virtual machine isolation ensures that VMs cannot access each other’s memory, disk, or network traffic. This isolation is enforced by the hypervisor and hardware virtualization extensions. However, side-channel attacks like Spectre and Meltdown demonstrated that VM isolation is not absolute. A technician must understand both the isolation guarantees and their limitations.",uc:1,depth:4,children:[]},{id:"uc1-arch-virt-container",title:"Container (namespace, cgroup)",explanation:"Containers use Linux kernel features — namespaces for isolation and cgroups for resource limiting — to create lightweight, isolated execution environments. Unlike VMs, containers share the host kernel, making container breakout a serious concern if the kernel is compromised. A technician secures containers through image scanning, runtime protection, capability dropping, and seccomp profiles.",uc:1,depth:4,children:[]},{id:"uc1-arch-virt-sandbox",title:"Sandbox",explanation:"A sandbox is an isolated execution environment that restricts what code can do — typically limiting file system access, network connections, and system calls. Sandboxes are used to safely analyze malware, execute untrusted code, and contain application failures. A technician uses sandboxing as a defense-in-depth layer for email attachments, web content, and unknown executables.",uc:1,depth:4,children:[]}]},{id:"uc1-arch-ot-ics",title:"OT e ICS",explanation:"Operational Technology (OT) and Industrial Control Systems (ICS) manage physical processes in critical infrastructure, manufacturing, and utilities. These systems have unique security challenges: long lifecycles, proprietary protocols, safety requirements, and the convergence of IT and OT networks.",uc:1,depth:3,children:[{id:"uc1-arch-ot-diff",title:"Differenze IT/OT",explanation:"IT systems prioritize confidentiality and rapid patching, while OT systems prioritize safety, availability, and stability — often making patches difficult to apply without process downtime. This cultural and technical gap creates security vulnerabilities when IT security practices are applied to OT environments without adaptation. A technician must understand both domains to bridge this gap.",uc:1,depth:4,children:[]},{id:"uc1-arch-ot-controllo",title:"Sistemi di controllo industriale",explanation:"Industrial control systems include SCADA (Supervisory Control and Data Acquisition), DCS (Distributed Control Systems), and PLCs (Programmable Logic Controllers). These systems directly control physical infrastructure like power grids, water treatment plants, and manufacturing lines. Compromising ICS can cause physical damage, environmental disasters, or loss of life — making ICS security a matter of public safety.",uc:1,depth:4,children:[]}]},{id:"uc1-arch-cloud",title:"Ambienti cloud",explanation:"Cloud computing shifts IT infrastructure from on-premises data centers to service provider platforms. This transformation changes the security model by introducing shared responsibility, multi-tenancy, and new abstraction layers. A technician must understand cloud-specific threats and controls.",uc:1,depth:3,children:[{id:"uc1-arch-cloud-responsabilita",title:"Modello di responsabilità condivisa",explanation:"The shared responsibility model defines security obligations between the cloud provider and the customer. The provider secures the underlying infrastructure; the customer secures what they put in the cloud. Understanding this division is critical because security failures often occur at the boundary — where the customer incorrectly assumes the provider handles a particular control.",uc:1,depth:4,children:[]},{id:"uc1-arch-cloud-pubblico",title:"Pubblico",explanation:"Public cloud services are shared among multiple customers (tenants) over the public internet. The benefits are scalability and cost efficiency; the risks are multi-tenancy isolation failures, data residency concerns, and dependency on the provider’s security posture. A technician must evaluate public cloud security controls and understand the trade-offs.",uc:1,depth:4,children:[]},{id:"uc1-arch-cloud-privato",title:"Privato",explanation:"Private cloud infrastructure is dedicated to a single organization, offering greater control over security, compliance, and data residency. Private clouds are often used for sensitive workloads or regulated industries. A technician manages private cloud security with the same rigor as traditional data centers while leveraging cloud automation benefits.",uc:1,depth:4,children:[]},{id:"uc1-arch-cloud-ibrido",title:"Ibrido",explanation:"Hybrid cloud combines public and private cloud environments, allowing workloads to move between them. Hybrid deployments are complex because security policies must be consistent across environments, and the connection between clouds becomes a critical security boundary. A technician must design unified security controls that span both environments.",uc:1,depth:4,children:[]}]}]},{id:"uc1-minacce",title:"Minacce, Vulnerabilità e Threat Intelligence",explanation:"This section covers the threat landscape: who attacks, why they attack, how they attack, and how defenders can anticipate and counter threats. Understanding the adversary — their motivations, capabilities, and methods — is essential for prioritizing defenses and allocating security resources effectively.",uc:1,depth:2,children:[{id:"uc1-minacce-tassonomia",title:"Tassonomia delle minacce",explanation:"Threat taxonomy classifies attackers by their origin and motivation. Different threat actors have different capabilities, targets, and persistence levels. Understanding threat taxonomy helps a technician contextualize alerts, prioritize incidents, and apply appropriate defensive measures.",uc:1,depth:3,children:[{id:"uc1-minacce-interne",title:"Interne",explanation:"Insider threats originate from within the organization — employees, contractors, or partners with legitimate access. These threats are particularly dangerous because insiders already bypass perimeter defenses and understand internal systems. Detection is challenging because malicious actions may mimic normal work activity.",uc:1,depth:4,children:[{id:"uc1-minacce-interne-errore",title:"Errore umano",explanation:"Human error is the leading cause of security incidents — misconfigured systems, phishing victims, accidental data leaks, and weak passwords. Unlike malicious insiders, negligent insiders do not intend harm but cause damage through carelessness or lack of awareness. A technician addresses human error through automation, training, and defense-in-depth architectures that tolerate mistakes.",uc:1,depth:5,children:[]},{id:"uc1-minacce-interne-insider",title:"Insider malevolo",explanation:"A malicious insider intentionally abuses their legitimate access to steal data, sabotage systems, or assist external attackers. Motivations include financial gain, revenge, ideology, or coercion. A technician implements access controls, monitoring, and least privilege to limit the damage a malicious insider can cause and to create audit trails for investigation.",uc:1,depth:5,children:[]}]},{id:"uc1-minacce-esterne",title:"Esterne",explanation:"External threat actors operate from outside the organization and must first breach perimeter defenses. They range from opportunistic criminals to sophisticated state-sponsored groups. Understanding external threat categories helps a technician anticipate attack patterns and implement proportionate defenses.",uc:1,depth:4,children:[{id:"uc1-minacce-esterne-criminalita",title:"Criminalità finanziaria",explanation:"Financially motivated cybercriminals seek direct monetary gain through ransomware, banking trojans, credential theft, or fraud. They operate as individuals, organized crime groups, or ransomware-as-a-service affiliates. These actors are numerous, well-resourced, and constantly evolving their techniques. A technician defends against them through layered security, backup strategies, and transaction monitoring.",uc:1,depth:5,children:[]},{id:"uc1-minacce-esterne-hacktivismo",title:"Hacktivismo",explanation:"Hacktivists are ideologically motivated attackers who target organizations they oppose for political, social, or religious reasons. Their goals are disruption, embarrassment, or propaganda rather than financial gain. DDoS attacks, website defacements, and data leaks are common hacktivist techniques. A technician prepares for these through public-facing system hardening and incident response planning.",uc:1,depth:5,children:[]},{id:"uc1-minacce-esterne-statali",title:"Attori statali",explanation:"Nation-state actors are government-sponsored groups with advanced capabilities, significant resources, and strategic objectives like espionage, sabotage, or influence operations. They develop zero-day exploits, employ sophisticated persistence mechanisms, and target critical infrastructure. Defending against state actors requires the highest level of security maturity and often involves government coordination.",uc:1,depth:5,children:[]}]}]},{id:"uc1-minacce-tassonomia-vuln",title:"Tassonomia delle vulnerabilità",explanation:"Vulnerability taxonomy classifies weaknesses by their origin in the system lifecycle. Understanding where vulnerabilities come from — configuration errors, design flaws, or implementation bugs — helps a technician focus remediation efforts on the root cause rather than just the symptoms.",uc:1,depth:3,children:[{id:"uc1-vuln-configurazione",title:"Configurazione",explanation:"Configuration vulnerabilities arise from incorrect, insecure, or default settings in systems, applications, or network devices. Default passwords, unnecessary open ports, excessive permissions, and unpatched systems are all configuration weaknesses. These are the most common and often the easiest vulnerabilities to exploit and fix. A technician addresses them through hardening baselines and automated configuration auditing.",uc:1,depth:4,children:[]},{id:"uc1-vuln-progettazione",title:"Progettazione",explanation:"Design vulnerabilities are fundamental flaws in the architecture or logic of a system that cannot be fixed by configuration changes. Examples include insufficient authentication, lack of input validation, or improper error handling. These vulnerabilities require redesign or replacement of the affected component. A technician identifies design flaws through architecture review and threat modeling.",uc:1,depth:4,children:[]},{id:"uc1-vuln-implementazione",title:"Implementazione",explanation:"Implementation vulnerabilities are coding errors that introduce security weaknesses — buffer overflows, injection flaws, race conditions, and improper memory management. These bugs arise from developer mistakes and are exploitable even when the overall design is sound. A technician finds implementation vulnerabilities through code review, automated static analysis, and dynamic testing.",uc:1,depth:4,children:[]}]},{id:"uc1-minacce-esposizione",title:"Esposizione e impatto",explanation:"Exposure and impact assessment quantifies the potential damage from a realized threat. Exposure measures how accessible an asset is to attackers; impact measures the consequence of compromise. Together they inform risk prioritization — a highly exposed critical asset demands immediate attention regardless of the specific threat probability.",uc:1,depth:3,children:[]},{id:"uc1-minacce-vettori",title:"Vettori di attacco",explanation:"Attack vectors are the pathways or methods attackers use to gain access to systems. Categorizing vectors helps a technician implement layered defenses that address each pathway and understand how an attacker might chain multiple vectors for a multi-stage attack.",uc:1,depth:3,children:[{id:"uc1-vettori-rete",title:"Rete",explanation:"Network-based attack vectors exploit vulnerabilities in network protocols, services, and infrastructure. Examples include port scanning, man-in-the-middle attacks, DNS poisoning, and network sniffing. These attacks can originate from anywhere on the network path, including the internet. A technician defends through network segmentation, encryption, and traffic monitoring.",uc:1,depth:4,children:[]},{id:"uc1-vettori-locale",title:"Locale",explanation:"Local attack vectors require the attacker to already have some level of access to the target system — either physical access or a compromised user account. Privilege escalation, local buffer overflows, and exploiting misconfigured permissions are common local techniques. A technician mitigates these through least privilege, patch management, and endpoint hardening.",uc:1,depth:4,children:[]},{id:"uc1-vettori-fisico",title:"Fisico",explanation:"Physical attack vectors involve direct interaction with hardware — stealing devices, installing keyloggers, accessing unlocked workstations, or extracting data from discarded equipment. Physical security is the foundation of all other security controls because an attacker with unrestricted physical access can eventually bypass any logical control. A technician implements access controls, surveillance, and device encryption.",uc:1,depth:4,children:[]}]},{id:"uc1-minacce-kill-chain",title:"Cyber Kill Chain",explanation:"The Cyber Kill Chain is a model that describes the stages of a targeted attack, from initial reconnaissance to achieving the attacker’s objective. Understanding these stages enables a technician to identify defensive opportunities at each phase and recognize indicators of compromise that reveal an attack in progress.",uc:1,depth:3,children:[{id:"uc1-kill-recon",title:"Ricognizione",explanation:"Reconnaissance is the information-gathering phase where attackers research their target to identify potential vulnerabilities, employees, infrastructure, and entry points. This phase leaves footprints — port scans, social media profiling, DNS queries — that a technician can monitor for early warning. Detecting reconnaissance activity often provides the first indication of an impending targeted attack.",uc:1,depth:4,children:[]},{id:"uc1-kill-armamento",title:"Armamento",explanation:"Weaponization is the phase where attackers create or customize a malicious payload designed to exploit identified vulnerabilities. This often involves combining an exploit with a backdoor or remote access tool into a deliverable package. Understanding weaponization helps a technician recognize malicious file types, analyze attachments, and deploy antivirus and email filtering defenses.",uc:1,depth:4,children:[]},{id:"uc1-kill-consegna",title:"Consegna",explanation:"Delivery is the transmission of the weaponized payload to the target via email attachments, malicious websites, USB drives, or direct network exploitation. This is a critical defensive chokepoint because the attacker must successfully deliver their payload. A technician implements email security, web filtering, and endpoint protection to block delivery.",uc:1,depth:4,children:[]},{id:"uc1-kill-sfruttamento",title:"Sfruttamento",explanation:"Exploitation triggers the vulnerability in the target system, allowing the attacker’s code to execute. This is the moment the attack transitions from preparation to actual compromise. A technician reduces exploitation opportunities through patch management, vulnerability scanning, exploit mitigation technologies (ASLR, DEP), and network segmentation.",uc:1,depth:4,children:[]},{id:"uc1-kill-installazione",title:"Installazione",explanation:"Installation establishes persistence by installing backdoors, creating accounts, or modifying system configurations to maintain access after reboot. Persistent access separates a serious attacker from an opportunistic one. A technician detects installation through integrity monitoring, unauthorized account auditing, and anomaly detection on system configuration changes.",uc:1,depth:4,children:[]},{id:"uc1-kill-c2",title:"Comando e controllo",explanation:"Command and Control (C2) establishes a communication channel between the attacker and the compromised system, enabling remote operation. C2 traffic often uses common protocols (DNS, HTTPS) to blend with legitimate traffic. A technician detects C2 through network traffic analysis, DNS anomaly detection, and behavioral analysis that identifies beaconing patterns.",uc:1,depth:4,children:[]},{id:"uc1-kill-azioni",title:"Azioni sugli obiettivi",explanation:"Actions on objectives is the final phase where the attacker achieves their goal — data exfiltration, destruction, encryption for ransom, or lateral movement to additional targets. This phase produces the most visible indicators because the attacker’s actions are inherently anomalous. A technician focuses detection here on data transfer monitoring and privileged access alerts.",uc:1,depth:4,children:[]}]},{id:"uc1-minacce-geopolitica",title:"Geopolitica digitale",explanation:"Digital geopolitics examines how nation-states use cyber capabilities to achieve strategic objectives, including espionage, sabotage, and influence operations. Understanding this landscape helps a technician contextualize threats to critical infrastructure and appreciate the national security implications of their defensive work.",uc:1,depth:3,children:[{id:"uc1-geo-guerra-ibrida",title:"Guerra ibrida",explanation:"Hybrid warfare combines conventional military action with cyber operations, disinformation campaigns, economic pressure, and political subversion. Cyber components are attractive because they offer plausible deniability and can achieve strategic effects without kinetic force. A technician in critical infrastructure must understand that cyber attacks may be part of broader geopolitical conflicts.",uc:1,depth:4,children:[{id:"uc1-geo-ibrida-cinetica",title:"Componente cinetica vs cyber",explanation:"Kinetic warfare involves physical force and destruction, while cyber warfare targets information systems and digital infrastructure. The convergence of these domains means cyber attacks can have physical consequences — disrupting power grids, disabling safety systems, or halting industrial processes. A technician must design cyber defenses that account for potential physical impacts.",uc:1,depth:5,children:[]},{id:"uc1-geo-ibrida-influenza",title:"Operazioni di influenza",explanation:"Influence operations use social media, compromised news outlets, and targeted messaging to shape public opinion, undermine trust in institutions, and polarize societies. These operations blur the line between cyber warfare and information warfare. A technician supports defense against influence operations through email authentication, domain monitoring, and user awareness training.",uc:1,depth:5,children:[]},{id:"uc1-geo-ibrida-critiche",title:"Attacchi a infrastrutture critiche",explanation:"Critical infrastructure — energy, water, transport, healthcare, finance — is a prime target for state-sponsored attacks because disruption causes widespread societal impact. The NIS2 directive and similar regulations mandate specific security requirements for critical infrastructure operators. A technician working in these sectors must implement enhanced security controls and reporting procedures.",uc:1,depth:5,children:[]}]},{id:"uc1-geo-attribuzione",title:"Attribuzione degli attacchi",explanation:"Attribution is the process of identifying the responsible party behind a cyber attack. It is notoriously difficult because attackers use false flags, compromised infrastructure, and anonymization techniques. Attribution relies on technical indicators (TTPs, malware analysis), geopolitical context, and intelligence sources. A technician contributes to attribution by preserving forensic evidence and documenting attack patterns.",uc:1,depth:4,children:[]}]},{id:"uc1-minacce-umano",title:"Fattore umano",explanation:"The human element is consistently the weakest link in security. Technical controls cannot compensate for manipulated, careless, or malicious humans. Understanding human-targeted attack techniques and risky behaviors is essential for designing effective defenses that account for human limitations.",uc:1,depth:3,children:[{id:"uc1-umano-social",title:"Social engineering",explanation:"Social engineering manipulates people into breaking security procedures by exploiting human psychology — trust, authority, fear, curiosity. It bypasses technical controls by targeting the human operator. A technician must recognize social engineering techniques because they are the entry point for the majority of successful attacks.",uc:1,depth:4,children:[{id:"uc1-umano-phishing",title:"Phishing",explanation:"Phishing is the mass-distribution of fraudulent messages that appear to come from trusted sources, aiming to steal credentials or install malware. It is the most common attack vector because it is cheap, scalable, and exploits human trust in familiar brands. A technician deploys email filtering, domain authentication (SPF, DKIM, DMARC), and user training to combat phishing.",uc:1,depth:5,children:[]},{id:"uc1-umano-spear",title:"Spear phishing",explanation:"Spear phishing is a targeted phishing attack directed at a specific individual or organization, using personalized information to increase credibility. Because spear phishing messages reference real people, projects, or events, they are far more convincing than generic phishing. A technician implements enhanced monitoring for targeted individuals and executive protection measures.",uc:1,depth:5,children:[]},{id:"uc1-umano-vishing",title:"Vishing",explanation:"Vishing (voice phishing) uses telephone calls to manipulate victims into revealing sensitive information or performing actions like transferring funds. Attackers spoof caller IDs and impersonate authority figures — IT support, executives, bank representatives. A technician establishes verification procedures for sensitive requests made via phone.",uc:1,depth:5,children:[]},{id:"uc1-umano-pretexting",title:"Pretexting",explanation:"Pretexting involves creating a fabricated scenario (pretext) to obtain information from a target. The attacker establishes credibility by researching the target’s environment and playing a role — a vendor, auditor, or new employee. A technician trains staff to verify identities through independent channels before disclosing any information.",uc:1,depth:5,children:[]}]},{id:"uc1-umano-comportamento",title:"Comportamento a rischio",explanation:"Risky behaviors are actions by employees that increase the organization’s attack surface or bypass security controls. These behaviors often stem from convenience-seeking rather than malicious intent. A technician addresses risky behaviors through policy enforcement, technical controls that make secure behavior the default, and awareness programs.",uc:1,depth:4,children:[{id:"uc1-umano-shadow-it",title:"Shadow IT",explanation:"Shadow IT refers to technology systems, devices, software, or services used by employees without organizational approval or IT department knowledge. These unmonitored systems bypass security controls, create data leakage risks, and expand the attack surface. A technician discovers shadow IT through network scanning, cloud access monitoring, and asset management processes.",uc:1,depth:5,children:[]},{id:"uc1-umano-igiene",title:"Igiene digitale",explanation:"Digital hygiene encompasses the personal security practices of individual users: password management, software updates, secure browsing, and physical device protection. Poor digital hygiene — reusing passwords, ignoring updates, leaving devices unlocked — creates entry points for attackers. A technician promotes good hygiene through automated enforcement and continuous awareness programs.",uc:1,depth:5,children:[]}]}]},{id:"uc1-minacce-threat-intel",title:"Threat Intelligence",explanation:"Threat intelligence is the collection, analysis, and dissemination of information about current and emerging threats. It transforms raw data into actionable insights that help organizations anticipate attacks, prioritize defenses, and respond faster. A technician uses threat intelligence to contextualize alerts and understand the broader threat landscape.",uc:1,depth:3,children:[{id:"uc1-ti-osint",title:"OSINT",explanation:"Open Source Intelligence (OSINT) is the collection and analysis of publicly available information to produce intelligence. In cybersecurity, OSINT includes monitoring hacker forums, analyzing social media, reviewing code repositories, and scraping dark web markets. A technician uses OSINT to discover leaked credentials, identify exposed infrastructure, and track emerging threats.",uc:1,depth:4,children:[]},{id:"uc1-ti-ttps",title:"TTPs",explanation:"Tactics, Techniques, and Procedures (TTPs) describe how threat actors operate at a behavioral level. Tactics are the strategic goals; techniques are the methods used; procedures are the specific implementations. Documenting TTPs enables a technician to recognize attack patterns, map observed activity to known threat actors, and design defenses that counter specific behaviors rather than just signatures.",uc:1,depth:4,children:[]},{id:"uc1-ti-frameworks",title:"Adversary Frameworks",explanation:"Adversary frameworks like MITRE ATT&CK systematically catalog threat actor TTPs into a structured matrix. These frameworks provide a common language for describing attacks and mapping defensive coverage. A technician uses ATT&CK to identify gaps in detection capabilities, prioritize security investments, and communicate threat information consistently across teams.",uc:1,depth:4,children:[]},{id:"uc1-ti-ioc",title:"Indicatori di compromissione",explanation:"Indicators of Compromise (IoCs) are forensic artifacts that suggest a system has been breached — IP addresses, domain names, file hashes, registry keys, or URLs associated with malicious activity. IoCs are the tactical output of threat intelligence, enabling immediate detection and blocking. A technician implements IoC feeds into firewalls, SIEMs, and endpoint protection for automated response.",uc:1,depth:4,children:[]},{id:"uc1-ti-lifecycle",title:"Intelligence lifecycle",explanation:"The intelligence lifecycle is the structured process of planning, collection, processing, analysis, dissemination, and feedback. This cycle ensures that threat intelligence is relevant, timely, and actionable. A technician participates in this lifecycle by contributing incident data, consuming intelligence products, and providing feedback on their utility.",uc:1,depth:4,children:[]}]}]},{id:"uc1-analisi-rischio",title:"Analisi del rischio",explanation:"Risk analysis is the systematic process of identifying assets, assessing threats and vulnerabilities, and quantifying the likelihood and impact of potential security events. It provides the foundation for all security decision-making, ensuring that resources are allocated to the most significant risks.",uc:1,depth:2,children:[{id:"uc1-rischio-concetti",title:"Concetti fondamentali",explanation:"Risk is the product of threat, vulnerability, and impact. Understanding these fundamental components and their relationships enables a technician to participate meaningfully in risk assessment processes and communicate risk effectively to technical and business stakeholders.",uc:1,depth:3,children:[{id:"uc1-rischio-asset",title:"Asset",explanation:"An asset is anything of value to the organization — data, systems, hardware, software, personnel, reputation, or intellectual property. Risk analysis begins with asset identification and valuation because the worth of an asset determines the appropriate level of protection. A technician contributes by identifying technical assets and their interdependencies.",uc:1,depth:4,children:[]},{id:"uc1-rischio-minaccia",title:"Minaccia",explanation:"A threat is any potential event or actor that could cause harm to an asset. Threats can be natural, accidental, or intentional. Understanding the threat landscape — which threats are relevant, how likely they are, and what capabilities they possess — is essential for realistic risk assessment. A technician monitors threat intelligence to keep risk assessments current.",uc:1,depth:4,children:[]},{id:"uc1-rischio-vulnerabilita",title:"Vulnerabilità",explanation:"A vulnerability is a weakness in a system, process, or control that a threat could exploit. Vulnerabilities can be technical (software bugs, misconfigurations), procedural (insufficient backup testing), or human (lack of training). A technician’s primary role in risk analysis is identifying and assessing technical vulnerabilities through scanning, testing, and review.",uc:1,depth:4,children:[]},{id:"uc1-rischio-probabilita",title:"Probabilità",explanation:"Probability (or likelihood) is the estimated chance that a threat will exploit a vulnerability and cause an impact. Probability assessment considers threat frequency, exposure, and control effectiveness. A technician provides input on the likelihood of technical vulnerabilities being exploited based on exploit availability, attack complexity, and current threat activity.",uc:1,depth:4,children:[]},{id:"uc1-rischio-impatto",title:"Impatto",explanation:"Impact is the magnitude of damage that would result from a successful security event. Impact categories include financial loss, operational disruption, reputational damage, regulatory penalties, and safety consequences. A technician helps quantify technical impact by assessing data loss scope, system downtime estimates, and recovery complexity.",uc:1,depth:4,children:[]}]},{id:"uc1-rischio-modelli",title:"Modelli di valutazione",explanation:"Risk
