ecurity testing into the automated build and deployment process.",uc:2,depth:3,children:[{id:"uc2-pipeline-sast",title:"Static analysis",explanation:"Static Application Security Testing (SAST) analyzes source code for vulnerabilities without executing the program. SAST tools detect issues like injection flaws, hardcoded credentials, and insecure API usage early in development. A technician integrates SAST into the CI pipeline, tunes false positive rates, and establishes gates that prevent deployment when critical vulnerabilities are found.",uc:2,depth:4,children:[]},{id:"uc2-pipeline-dast",title:"Dynamic analysis",explanation:"Dynamic Application Security Testing (DAST) tests running applications for vulnerabilities by sending malicious requests and analyzing responses. DAST finds runtime issues that SAST cannot detect: configuration errors, authentication bypasses, and business logic flaws. A technician integrates DAST into staging environments, configures scan policies, and triages findings for remediation.",uc:2,depth:4,children:[]},{id:"uc2-pipeline-secrets",title:"Secret detection",explanation:"Secret detection scans code repositories for accidentally committed credentials: API keys, passwords, tokens, and private keys. Secrets in version control are a common and serious vulnerability because they persist in history even after deletion. A technician implements pre-commit hooks and CI pipeline scanning to detect secrets before they enter the repository.",uc:2,depth:4,children:[]},{id:"uc2-pipeline-iac",title:"IaC scanning",explanation:"Infrastructure as Code (IaC) scanning analyzes configuration files (Terraform, CloudFormation, Kubernetes manifests) for security misconfigurations before deployment. IaC scanning catches vulnerabilities like exposed services, weak access controls, and missing encryption at the configuration level. A technician integrates IaC scanning into the deployment pipeline and enforces policy-as-code standards.",uc:2,depth:4,children:[]},{id:"uc2-pipeline-deps",title:"Dependency checking",explanation:"Dependency checking identifies known vulnerabilities in third-party libraries and frameworks used by applications. Most modern applications rely heavily on open-source components, and vulnerable dependencies are a common attack vector. A technician implements Software Composition Analysis (SCA) tools in CI pipelines, monitors vulnerability databases, and manages dependency updates.",uc:2,depth:4,children:[]}]}]},{id:"uc2-cloud",title:"Sicurezza cloud",explanation:"Cloud security addresses the unique risks and controls of cloud computing environments. The cloud shared responsibility model means that while the provider secures the infrastructure, the customer is responsible for securing their data, applications, and access in the cloud.",uc:2,depth:2,children:[{id:"uc2-cloud-responsabilita",title:"Modello responsabilità condivisa",explanation:"The shared responsibility model divides security obligations between the cloud provider and the customer based on the service model (IaaS, PaaS, SaaS). Understanding this division is essential because security failures often occur where responsibility is misunderstood.",uc:2,depth:3,children:[{id:"uc2-cloud-provider",title:"Provider",explanation:"The cloud provider is responsible for securing the underlying infrastructure: physical facilities, hardware, network infrastructure, hypervisors, and host operating systems. The provider’s security is validated through compliance certifications (SOC 2, ISO 27001). A technician evaluates provider security certifications, reviews security documentation, and understands the provider’s incident notification procedures.",uc:2,depth:4,children:[]},{id:"uc2-cloud-cliente",title:"Cliente",explanation:"The customer is responsible for securing what they put in the cloud: data classification, access management, application security, encryption, and network configuration within their cloud environment. In IaaS, the customer manages nearly everything above the hypervisor. A technician implements customer-side controls with the same rigor as on-premises security, often using cloud-native security services.",uc:2,depth:4,children:[]}]},{id:"uc2-cloud-minacce",title:"Minacce cloud",explanation:"Cloud-specific threats arise from the unique characteristics of cloud computing: multi-tenancy, API-driven management, rapid provisioning, and reduced visibility.",uc:2,depth:3,children:[{id:"uc2-cloud-misconfig",title:"Misconfiguration",explanation:"Cloud misconfiguration is the leading cause of cloud security incidents. Publicly exposed storage buckets, overly permissive IAM policies, open security groups, and disabled encryption are common mistakes. Cloud configurations are complex and easily misunderstood. A technician implements automated configuration scanning, enforces policy-as-code, and reviews all cloud resource configurations for security.",uc:2,depth:4,children:[]},{id:"uc2-cloud-accesso",title:"Accesso non autorizzato",explanation:"Unauthorized cloud access occurs when credentials are compromised, IAM policies are too permissive, or authentication is weak. Cloud admin credentials are high-value targets because they grant control over vast resources. A technician enforces MFA for all cloud accounts, implements least-privilege IAM policies, monitors for anomalous access, and uses cloud-native identity protection services.",uc:2,depth:4,children:[]},{id:"uc2-cloud-leakage",title:"Data leakage",explanation:"Cloud data leakage occurs when sensitive data is exposed through misconfigured access controls, accidentally public resources, or insider actions. Data loss prevention (DLP) tools, encryption, and access auditing are primary defenses. A technician implements DLP policies, encrypts sensitive data before cloud upload, and monitors for unauthorized data access or transfer.",uc:2,depth:4,children:[]}]},{id:"uc2-cloud-controlli",title:"Controlli cloud",explanation:"Cloud controls are the security measures implemented in cloud environments to protect data, applications, and infrastructure.",uc:2,depth:3,children:[{id:"uc2-cloud-iam",title:"IAM cloud",explanation:"Cloud Identity and Access Management (IAM) controls who can access cloud resources and what they can do. IAM policies define permissions at granular levels for users, groups, roles, and services. A technician implements least-privilege IAM policies, uses role-based access control, enforces MFA, and regularly audits IAM configurations for excessive permissions.",uc:2,depth:4,children:[]},{id:"uc2-cloud-cifratura",title:"Cifratura dati a riposo",explanation:"Encryption at rest in the cloud protects stored data from unauthorized access by the cloud provider, other tenants, or attackers who gain storage access. Cloud providers offer native encryption services for storage, databases, and virtual machines. A technician enables encryption at rest on all cloud storage, manages encryption keys (preferably with customer-managed keys), and verifies that encryption is applied consistently.",uc:2,depth:4,children:[]},{id:"uc2-cloud-monitoraggio",title:"Monitoraggio cloud",explanation:"Cloud monitoring collects and analyzes logs, metrics, and events from cloud resources for security and operational visibility. Cloud-native monitoring services (CloudTrail, Azure Monitor, GCP Cloud Logging) provide comprehensive coverage. A technician configures monitoring for all cloud resources, sets up alerts for security-relevant events, and integrates cloud logs with the central SIEM.",uc:2,depth:4,children:[]}]}]},{id:"uc2-emergenti",title:"Tecnologie disruptive e rischi emergenti",explanation:"Emerging technologies introduce new capabilities and new security risks that existing frameworks may not adequately address. A technician must understand these technologies to prepare defenses against novel attack vectors and to leverage new defensive capabilities.",uc:2,depth:2,children:[{id:"uc2-ai",title:"Intelligenza artificiale",explanation:"Artificial Intelligence is transforming cybersecurity by enabling new detection capabilities and creating new attack methods. Understanding both the defensive and offensive applications of AI is essential for modern security practice.",uc:2,depth:3,children:[{id:"uc2-ai-anomalie",title:"AI per rilevamento anomalie",explanation:"AI-powered anomaly detection uses machine learning to establish baselines of normal behavior and identify deviations that may indicate threats. AI excels at processing large volumes of data and detecting subtle patterns that rule-based systems miss. A technician implements AI-based detection tools, provides feedback to improve model accuracy, and understands that AI models require continuous training and validation.",uc:2,depth:4,children:[]},{id:"uc2-ai-ids",title:"AI per intrusion detection",explanation:"AI-enhanced intrusion detection analyzes network traffic, endpoint behavior, and user activity to detect multi-stage attacks that span multiple systems and time periods. AI can correlate weak signals into strong attack indicators. A technician integrates AI-based intrusion detection with existing SOC workflows, validates alerts, and tunes models to reduce false positives.",uc:2,depth:4,children:[]},{id:"uc2-ai-attacks",title:"AI-driven attacks",explanation:"AI-driven attacks use machine learning to improve attack effectiveness: generating more convincing phishing emails, automating vulnerability discovery, creating polymorphic malware, and bypassing detection systems. The arms race between AI-powered attack and defense is accelerating.",uc:2,depth:4,children:[{id:"uc2-ai-deepfake",title:"Deepfake",explanation:"Deepfakes use deep learning to create realistic but fabricated audio, video, and images. In cybersecurity, deepfakes enable social engineering at scale: fake CEO voice calls authorizing wire transfers, forged video conferences, and synthetic identity creation. A technician implements verification procedures for sensitive transactions and trains users to verify identity through independent channels.",uc:2,depth:5,children:[]},{id:"uc2-ai-adversarial",title:"Adversarial ML",explanation:"Adversarial machine learning exploits weaknesses in AI models to cause misclassification or evade detection. Attackers craft inputs that are correctly classified by humans but fool AI systems: adversarial examples in image recognition, poisoned training data, and model extraction. A technician understands that AI-based security tools have limitations and implements defense-in-depth rather than relying solely on AI detection.",uc:2,depth:5,children:[]}]},{id:"uc2-ai-bias",title:"Bias e allucinazioni",explanation:"AI bias occurs when machine learning models produce systematically prejudiced results due to biased training data or flawed design. AI hallucinations generate confident but incorrect outputs. In security contexts, bias can cause discriminatory profiling; hallucinations can produce false threat intelligence. A technician critically evaluates AI-generated outputs, validates findings through independent sources, and reports suspected bias or errors in AI security tools.",uc:2,depth:4,children:[]}]},{id:"uc2-iot",title:"Internet of Things",explanation:"The Internet of Things connects billions of devices — cameras, sensors, appliances, industrial equipment — to the internet. IoT devices often lack security by design, creating vast attack surfaces.",uc:2,depth:3,children:[{id:"uc2-iot-superfici",title:"Superfici attacco IoT",explanation:"IoT attack surfaces are the vulnerabilities inherent in connected devices and their supporting infrastructure.",uc:2,depth:4,children:[{id:"uc2-iot-firmware",title:"Firmware non aggiornabile",explanation:"Many IoT devices ship with firmware that cannot be updated, leaving known vulnerabilities unpatched for the device’s entire lifetime. Manufacturers may abandon devices after release, and consumers lack the awareness or ability to update. A technician inventories IoT devices, verifies update capabilities before procurement, and segments IoT devices on isolated networks.",uc:2,depth:5,children:[]},{id:"uc2-iot-auth",title:"Assenza autenticazione",explanation:"Many IoT devices lack authentication or ship with hardcoded, unchangeable default credentials. Attackers can access these devices using publicly known passwords from manufacturer documentation. A technician changes default credentials where possible, disables unnecessary services, and implements network-level access controls for devices without their own authentication.",uc:2,depth:5,children:[]}]},{id:"uc2-iot-botnet",title:"Botnet IoT",explanation:"IoT botnets are networks of compromised connected devices used for DDoS attacks, cryptomining, and spam distribution. The Mirai botnet demonstrated the devastating potential by compromising hundreds of thousands of cameras and routers to launch record-breaking DDoS attacks. A technician prevents IoT botnet recruitment by changing default credentials, disabling unnecessary services, and monitoring IoT network traffic.",uc:2,depth:4,children:[]}]},{id:"uc2-biometria",title:"Biometria",explanation:"Biometric authentication uses physical or behavioral characteristics — fingerprints, facial features, voice patterns — to verify identity. Biometrics offer convenience and strong authentication but raise privacy concerns and introduce new security risks.",uc:2,depth:3,children:[{id:"uc2-bio-facciale",title:"Riconoscimento facciale",explanation:"Facial recognition uses cameras and algorithms to identify individuals based on facial geometry. It is used for authentication (unlocking devices) and identification (surveillance). Concerns include accuracy bias across demographics, spoofing with photos or masks, and privacy implications of mass surveillance. A technician evaluates facial recognition systems for anti-spoofing capabilities and data protection compliance.",uc:2,depth:4,children:[]},{id:"uc2-bio-impronta",title:"Impronta digitale",explanation:"Fingerprint recognition uses the unique patterns of ridges and valleys on a person’s fingertip for authentication. It is the most widely deployed biometric due to low cost and user acceptance. However, fingerprints can be lifted from surfaces and replicated, and once compromised cannot be changed like a password. A technician ensures fingerprint systems use liveness detection and stores biometric templates securely.",uc:2,depth:4,children:[]},{id:"uc2-bio-liveness",title:"Liveness detection",explanation:"Liveness detection determines whether the biometric sample comes from a live person rather than a spoof (photo, mask, recorded voice, fake fingerprint). It is essential for preventing presentation attacks against biometric systems. Techniques include analyzing skin texture, eye movement, blood flow, and challenge-response interactions. A technician selects biometric systems with certified liveness detection and tests them against known spoofing methods.",uc:2,depth:4,children:[]}]}]}]}]};function mf(l,u){const[d,c]=A.useState(()=>{try{const h=window.localStorage.getItem(l);return h?JSON.parse(h):u}catch{return u}});return A.useEffect(()=>{try{window.localStorage.setItem(l,JSON.stringify(d))}catch{}},[l,d]),[d,c]}function Fy(l){const u=[];function d(c){c.children.length===0?u.push(c):c.children.forEach(d)}return d(l),u}function jf(l){const u=[];function d(c){u.push(c),c.children.forEach(d)}return d(l),u}function Wy(l){const u=new Map;u.set(l.id,null);function d(c,h){u.set(c.id,h),c.children.forEach(m=>d(m,c.id))}return l.children.forEach(c=>d(c,l.id)),u}function il(l,u){const d=[];let c=u.get(l);for(;c;)d.unshift(c),c=u.get(c);return d}function Py(l){const u=[];function d(c){u.push(c.id),c.children.forEach(d)}return l.children.forEach(d),u}function $y(l,u){if(!l.trim())return[];const d=l.toLowerCase();return u.filter(c=>c.title.toLowerCase().includes(d))}const ev=({className:l=""})=>N.jsx("svg",{"code-path":"src/components/icons.tsx:2:3",width:"12",height:"12",vi
