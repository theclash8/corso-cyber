 assessment models provide structured methodologies for evaluating and comparing risks. The choice of model depends on available data, organizational maturity, and regulatory requirements. A technician should understand all three approaches to participate effectively in risk assessment exercises.",uc:1,depth:3,children:[{id:"uc1-rischio-qualitativo",title:"Qualitativo",explanation:"Qualitative risk assessment uses categorical scales (high, medium, low) based on expert judgment rather than numerical calculations. It is faster and requires less data, making it suitable for initial assessments or organizations with limited resources. A technician contributes expert judgment on the severity of technical vulnerabilities and the effectiveness of existing controls.",uc:1,depth:4,children:[]},{id:"uc1-rischio-quantitativo",title:"Quantitativo",explanation:"Quantitative risk assessment uses numerical values and statistical methods to calculate risk in monetary terms (Annualized Loss Expectancy). It requires substantial data and is more defensible for budget justification but also more complex. A technician provides the technical data inputs: vulnerability scan results, incident frequency statistics, and system criticality ratings.",uc:1,depth:4,children:[]},{id:"uc1-rischio-semiquant",title:"Semi-quantitativo",explanation:"Semi-quantitative assessment combines qualitative judgment with numerical scoring, assigning numeric values to categorical scales. It balances the speed of qualitative methods with the comparability of quantitative results. This is the most common approach in practice because it produces actionable rankings without requiring precise financial data for every risk.",uc:1,depth:4,children:[]}]},{id:"uc1-rischio-appetite",title:"Risk appetite e tolerance",explanation:"Risk appetite is the overall level of risk an organization is willing to accept in pursuit of its objectives. Risk tolerance defines the acceptable variation around specific risk categories. These concepts guide security investment decisions and escalation procedures. A technician must understand organizational risk appetite to avoid over-engineering controls for accepted risks or under-protecting critical assets.",uc:1,depth:3,children:[]},{id:"uc1-rischio-trattamento",title:"Trattamento del rischio",explanation:"Risk treatment describes the actions taken to address identified risks. There are four standard treatment options, and a technician implements the technical controls that support the chosen treatment strategy for each risk.",uc:1,depth:3,children:[{id:"uc1-rischio-riduzione",title:"Riduzione",explanation:"Risk reduction (mitigation) implements controls to decrease the likelihood or impact of a risk. This is the most common treatment and encompasses most security activities: patching, hardening, monitoring, training, and backup. A technician’s daily work is primarily focused on implementing and maintaining risk-reducing technical controls.",uc:1,depth:4,children:[]},{id:"uc1-rischio-accettazione",title:"Accettazione",explanation:"Risk acceptance is the conscious decision to take no action on a risk because the cost of mitigation exceeds the potential impact, or the risk falls within appetite. Accepted risks must be documented and periodically reviewed. A technician ensures that accepted risks are monitored for changes that might alter the acceptance decision.",uc:1,depth:4,children:[]},{id:"uc1-rischio-trasferimento",title:"Trasferimento",explanation:"Risk transfer shifts the financial impact of a risk to a third party, typically through cyber insurance or outsourcing. Transfer does not eliminate the risk — the organization still suffers operational impact from a breach. A technician supports risk transfer by providing accurate technical information for insurance underwriting and ensuring vendor security requirements are met.",uc:1,depth:4,children:[]},{id:"uc1-rischio-evitamento",title:"Evitamento",explanation:"Risk avoidance eliminates the risk by discontinuing the activity or asset that creates it. For example, retiring a legacy system or not entering a high-risk market. Avoidance is appropriate when the risk exceeds appetite and cannot be sufficiently reduced. A technician identifies technical alternatives that enable risk avoidance without unacceptable business impact.",uc:1,depth:4,children:[]}]},{id:"uc1-rischio-reporting",title:"Risk reporting",explanation:"Risk reporting communicates risk assessment results to stakeholders in formats appropriate to their roles. Executive reports summarize top risks and treatment status; operational reports detail specific vulnerabilities and remediation progress. A technician contributes technical accuracy to risk reports and uses them to prioritize their workload based on organizational risk priorities.",uc:1,depth:3,children:[]},{id:"uc1-rischio-piano",title:"Piano di trattamento",explanation:"A risk treatment plan documents the specific actions, responsibilities, timelines, and resources allocated to address each risk. It transforms risk assessment into an actionable security program. A technician executes the technical components of treatment plans, tracks progress, and reports on control implementation status to risk owners.",uc:1,depth:3,children:[]}]},{id:"uc1-metodologie-vuln",title:"Metodologie di analisi delle vulnerabilità",explanation:"Vulnerability analysis methodologies provide structured approaches for discovering, classifying, and prioritizing security weaknesses. A technician must understand these methodologies because they define how security assessments are conducted, what tools are used, and how results are interpreted and communicated.",uc:1,depth:2,children:[{id:"uc1-vuln-assessment",title:"Vulnerability assessment",explanation:"Vulnerability assessment is the systematic identification and evaluation of security weaknesses in systems, networks, and applications. It uses automated scanning tools and manual verification to produce a comprehensive inventory of vulnerabilities prioritized by severity. A technician performs vulnerability assessments as a core responsibility.",uc:1,depth:3,children:[{id:"uc1-va-superfici",title:"Superfici di attacco",explanation:"Attack surfaces are all the points where an attacker could potentially interact with a system — open ports, running services, web interfaces, APIs, and user inputs. Vulnerability assessment begins with attack surface enumeration because you cannot secure what you do not know exists. A technician uses port scanners, service detectors, and web crawlers to map attack surfaces.",uc:1,depth:4,children:[]},{id:"uc1-va-enumerazione",title:"Enumerazione",explanation:"Enumeration is the detailed discovery of system information after initial scanning: user accounts, shared resources, installed software, patch levels, and network topology. Enumeration provides the intelligence needed for targeted vulnerability testing. A technician performs enumeration carefully to avoid causing system instability or triggering security alerts unnecessarily.",uc:1,depth:4,children:[]},{id:"uc1-va-classificazione",title:"Classificazione per gravità",explanation:"Vulnerability classification assigns severity ratings based on the Common Vulnerability Scoring System (CVSS) or similar frameworks. Classification considers exploitability, impact scope, and required privileges. A technician must accurately classify findings because severity determines remediation priority and resource allocation. Misclassification leads to wasted effort or neglected critical vulnerabilities.",uc:1,depth:4,children:[]},{id:"uc1-va-prioritizzazione",title:"Prioritizzazione remediation",explanation:"Remediation prioritization ranks vulnerabilities by risk rather than just severity, considering threat intelligence, asset criticality, and exploit availability. A critical vulnerability on an internet-facing server takes priority over the same vulnerability on an isolated internal system. A technician applies prioritization frameworks to ensure that remediation effort produces maximum risk reduction.",uc:1,depth:4,children:[]}]},{id:"uc1-penetration-test",title:"Penetration test",explanation:"Penetration testing simulates real-world attacks to validate the effectiveness of security controls and identify exploitable vulnerabilities. Unlike vulnerability scanning, penetration testing demonstrates actual compromise and chains multiple vulnerabilities for deeper access. A technician supports penetration tests and uses their findings to improve defenses.",uc:1,depth:3,children:[{id:"uc1-pt-recon",title:"Reconnaissance",explanation:"Reconnaissance in penetration testing mirrors the attacker’s information-gathering phase. It is divided into passive and active techniques based on whether the tester directly interacts with the target.",uc:1,depth:4,children:[{id:"uc1-pt-recon-passiva",title:"Passiva",explanation:"Passive reconnaissance gathers information without directly interacting with the target system. Sources include WHOIS records, DNS queries, social media, job postings, public code repositories, and cached web pages. Passive reconnaissance is stealthy because it does not generate logs on target systems. A technician uses passive techniques for preliminary assessments and competitive intelligence.",uc:1,depth:5,children:[]},{id:"uc1-pt-recon-attiva",title:"Attiva",explanation:"Active reconnaissance involves direct interaction with the target — port scanning, service probing, banner grabbing, and vulnerability scanning. These activities generate detectable network traffic and log entries. A technician must obtain proper authorization before active reconnaissance because these activities may be mistaken for attacks and could violate laws or terms of service.",uc:1,depth:5,children:[]}]},{id:"uc1-pt-offensive-env",title:"Offensive Environment",explanation:"The offensive environment is the controlled testing infrastructure used for penetration testing and security research. Proper lab setup ensures that testing activities do not affect production systems or violate laws.",uc:1,depth:4,children:[{id:"uc1-pt-live-distro",title:"Live distributions",explanation:"Live security distributions like Kali Linux and Parrot OS are bootable operating systems pre-loaded with penetration testing tools. They provide a portable, consistent testing environment. A technician must be familiar with these distributions because they contain the toolset used by both attackers and authorized testers.",uc:1,depth:5,children:[]},{id:"uc1-pt-virtualized",title:"Virtualized labs",explanation:"Virtualized labs use hypervisors to create isolated networks of vulnerable machines for safe testing. They enable repeatable exercises without risk to production infrastructure. A technician builds and maintains virtualized labs for training, tool testing, and proof-of-concept validation before applying changes to production.",uc:1,depth:5,children:[]},{id:"uc1-pt-isolation",title:"Target isolation",explanation:"Target isolation ensures that penetration testing activities cannot accidentally affect systems outside the authorized scope. This involves network segmentation, firewall rules, and explicit scope documentation. A technician implements isolation controls and verifies them before authorizing any testing activity.",uc:1,depth:5,children:[]}]},{id:"uc1-pt-weaponization",title:"Weaponization",explanation:"Weaponization in penetration testing involves creating or customizing exploits and payloads to take advantage of discovered vulnerabilities. Testers may modify public exploits, create custom scripts, or configure off-the-shelf tools. A technician reviews weaponization techniques to understand how discovered vulnerabilities are actually exploited and what indicators they produce.",uc:1,depth:4,children:[]},{id:"uc1-pt-delivery",title:"Delivery",explanation:"Delivery in penetration testing is the transmission of the exploit payload to the target system. Methods include network-based delivery, social engineering, physical media, or supply chain manipulation. A technician uses delivery phase findings to improve email security, network filtering, and endpoint protection.",uc:1,depth:4,children:[]},{id:"uc1-pt-exploitation",title:"Exploitation",explanation:"Exploitation triggers the vulnerability and achieves code execution or unauthorized access. Successful exploitation demonstrates that a vulnerability is not just theoretically present but practically exploitable. A technician uses exploitation results to prioritize patching and implement compensating controls for vulnerabilities that cannot be immediately fixed.",uc:1,depth:4,children:[]},{id:"uc1-pt-installation",title:"Installation",explanation:"Installation establishes persistence on the compromised system — creating backdoor accounts, installing remote access tools, or modifying startup scripts. Demonstrating persistence shows the full impact of a vulnerability. A technician detects installation artifacts through integrity monitoring, account auditing, and configuration baseline comparisons.",uc:1,depth:4,children:[]},{id:"uc1-pt-c2",title:"Command and Control",explanation:"Command and Control in penetration testing demonstrates the ability to remotely operate the compromised system. Testers establish C2 channels using various protocols and techniques. A technician uses C2 detection findings to improve network monitoring, DNS security, and behavioral analysis capabilities.",uc:1,depth:4,children:[]},{id:"uc1-pt-actions",title:"Actions on Objectives",explanation:"Actions on objectives demonstrate what an attacker could achieve after full compromise — data exfiltration, privilege escalation, lateral movement, or accessing specific target information. This phase quantifies the business impact of vulnerabilities. A technician uses these findings to communicate risk to management and justify security investments.",uc:1,depth:4,children:[]}]},{id:"uc1-auditing",title:"Auditing di sicurezza",explanation:"Security auditing is the systematic review of systems, policies, and procedures against established standards or baselines. Unlike penetration testing, auditing focuses on compliance and configuration correctness rather than exploitability. A technician conducts or supports security audits to verify that controls are implemented as designed.",uc:1,depth:3,children:[{id:"uc1-audit-conformita",title:"Verifica conformità",explanation:"Compliance verification checks whether systems and processes meet the requirements of security standards, regulations, and internal policies. A technician performs technical compliance checks: verifying patch levels, reviewing access controls, checking encryption configurations, and validating logging. Compliance gaps indicate either control failures or insufficient control design.",uc:1,depth:4,children:[]},{id:"uc1-audit-evidenze",title:"Raccolta evidenze",explanation:"Evidence collection during audits documents the current state of systems and controls through screenshots, configuration exports, log samples, and tool outputs. This evidence supports audit findings and provides a baseline for future comparisons. A technician must collect evidence methodically, ensuring it is complete, accurate, and tamper-evident.",uc:1,depth:4,children:[]},{id:"uc1-audit-reporting",title:"Reportistica",explanation:"Audit reporting presents findings in a structured format: finding description, risk rating, evidence reference, and remediation recommendation. Good reports are actionable and prioritized. A technician contributes technical details to audit reports and uses them as work plans for remediation activities.",uc:1,depth:4,children:[]}]}]},{id:"uc1-malware",title:"Identificazione e analisi del malware",explanation:"Malware is malicious software designed to damage, disrupt, or gain unauthorized access to systems. Understanding malware types, evasion techniques, and identification methods enables a technician to detect infections, contain outbreaks, and support forensic analysis.",uc:1,depth:2,children:[{id:"uc1-malware-tipologie",title:"Tipologie",explanation:"Malware comes in many forms, each with distinct behaviors, propagation methods, and objectives. Recognizing malware types helps a technician select appropriate detection tools, containment strategies, and recovery procedures.",uc:1,depth:3,children:[{id:"uc1-malware-virus",title:"Virus",explanation:"A virus is malware that attaches itself to legitimate programs or files and spreads when the infected program executes. Viruses require user action to propagate — opening an email attachment or running an infected program. A technician prevents viruses through antivirus software, attachment filtering, and user awareness training.",uc:1,depth:4,children:[]},{id:"uc1-malware-worm",title:"Worm",explanation:"A worm is self-replicating malware that spreads across networks without user intervention, exploiting vulnerabilities in network services. Worms can infect thousands of systems within hours. Historical examples like WannaCry and NotPetya caused billions in damages. A technician prevents worms through patch management, network segmentation, and ingress/egress filtering.",uc:1,depth:4,children:[]},{id:"uc1-malware-trojan",title:"Trojan",explanation:"A trojan disguises itself as legitimate software to trick users into installing it. Unlike viruses, trojans do not self-replicate; they rely on social engineering for distribution. Remote access trojans (RATs) give attackers full control over infected systems. A technician detects trojans through behavioral analysis, application whitelisting, and user education.",uc:1,depth:4,children:[]},{id:"uc1-malware-ransomware",title:"Ransomware",explanation:"Ransomware encrypts victims’ files and demands payment for the decryption key. It is the most financially damaging malware category, targeting organizations of all sizes. Modern ransomware operates as a service (RaaS) with affiliates and developers sharing profits. A technician’s primary defense is backup strategy, followed by endpoint protection and network segmentation.",uc:1,depth:4,children:[]},{id:"uc1-malware-spyware",title:"Spyware",explanation:"Spyware covertly monitors user activity, capturing keystrokes, screenshots, browsing history, and credentials. It operates stealthily to maintain long-term access. Keyloggers and information stealers are common spyware variants. A technician detects spyware through behavioral monitoring, network traffic analysis for data exfiltration, and endpoint scanning.",uc:1,depth:4,children:[]},{id:"uc1-malware-rootkit",title:"Rootkit",explanation:"A rootkit is malware that hides its presence by modifying the operating system kernel or system utilities. Rootkits can intercept system calls, hide files and processes, and maintain persistent privileged access. They are among the most difficult malware to detect and remove. A technician uses integrity checking, memory forensics, and dedicated rootkit detection tools.",uc:1,depth:4,children:[]},{id:"uc1-malware-botnet",title:"Botnet",explanation:"A botnet is a network of compromised computers (bots) controlled by a command server (bot herder). Botnets are used for DDoS attacks, spam distribution, credential stuffing, and cryptocurrency mining. A technician detects botnet infections by monitoring for C2 beaconing patterns, unusual outbound connections, and participation in coordinated attacks.",uc:1,depth:4,children:[]}]},{id:"uc1-malware-evasione",title:"Tecniche di evasione",explanation:"Evasion techniques help malware avoid detection by antivirus software, sandboxes, and security analysts. Understanding these techniques enables a technician to configure more effective detection and appreciate the limitations of signature-based security tools.",uc:1,depth:3,children:[{id:"uc1-malware-polimorfismo",title:"Polimorfismo",explanation:"Polymorphic malware changes its code appearance on each infection while maintaining the same underlying functionality. It encrypts its payload with a different key each time and mutates its decryption routine. Polymorphic malware defeats signature-based detection because each instance has a unique file hash and byte pattern. A technician counters polymorphism with behavioral detection and heuristics.",uc:1,depth:4,children:[]},{id:"uc1-malware-offuscamento",title:"Offuscamento",explanation:"Obfuscation deliberately makes code difficult to analyze by renaming variables, adding irrelevant instructions, encrypting strings, and using unconventional control flow. While obfuscation has legitimate uses (protecting intellectual property), malware authors use it to slow down reverse engineering and evade static analysis. A technician uses deobfuscation tools and dynamic analysis to reveal the true behavior of obfuscated code.",uc:1,depth:4,children:[]}]},{id:"uc1-malware-firme",title:"Firme e identificazione",explanation:"Malware identification uses cryptographic hashes and signature databases to recognize known malicious files. This is the foundation of traditional antivirus technology and remains an essential first line of defense despite its limitations against unknown malware.",uc:1,depth:3,children:[{id:"uc1-malware-md5",title:"Hash MD5",explanation:"MD5 is a cryptographic hash function that produces a 128-bit fingerprint of a file. Identical files produce identical MD5 hashes. While MD5 is cryptographically broken for collision resistance, it remains useful for file identification and change detection. A technician uses MD5 hashes to compare files against known malware databases.",uc:1,depth:4,children:[]},{id:"uc1-malware-sha",title:"Hash SHA",explanation:"SHA (Secure Hash Algorithm) family — SHA-256, SHA-512 — produces hash values of varying lengths and is cryptographically secure against collisions. SHA-256 is the standard for file integrity verification and malware identification. A technician generates SHA hashes for critical system files to detect unauthorized modifications and for incident evidence preservation.",uc:1,depth:4,children:[]},{id:"uc1-malware-confronto",title:"Confronto hash",explanation:"Hash comparison matches the hash of an unknown file against a database of known malicious hashes. This is the fastest and most reliable method for identifying known malware but cannot detect new or modified variants. A technician uses hash comparison as a first-pass screening tool before investing in deeper analysis.",uc:1,depth:4,children:[]},{id:"uc1-malware-database",title:"Database hash noti",explanation:"Known hash databases like VirusTotal, NSRL, and commercial threat intelligence feeds catalog millions of file hashes with their dispositions (malicious, benign, unknown). These databases enable rapid identification without local storage of all hashes. A technician queries these databases during incident response to quickly classify suspicious files.",uc:1,depth:4,children:[]}]}]},{id:"uc1-email",title:"Email Security",explanation:"Email is the primary communication channel for most organizations and the dominant vector for cyber attacks. Understanding email architecture, protocols, threats, and defenses is essential because email-borne attacks — phishing, malware, business email compromise — account for the majority of successful breaches.",uc:1,depth:2,children:[{id:"uc1-email-architettura",title:"Architettura email",explanation:"Email architecture consists of three main components that handle message creation, transmission, and delivery. Understanding this architecture helps a technician troubleshoot email issues, implement security controls at each stage, and investigate email-borne incidents.",uc:1,depth:3,children:[{id:"uc1-email-mua",title:"MUA",explanation:"The Mail User Agent (MUA) is the email client software that users interact with — Outlook, Thunderbird, or webmail interfaces. The MUA composes, displays, and manages messages. From a security perspective, MUAs are a critical control point because they render potentially malicious content (HTML, attachments) directly to users. A technician configures MUA security settings and selects clients with robust sandboxing.",uc:1,depth:4,children:[]},{id:"uc1-email-mta",title:"MTA",explanation:"The Mail Transfer Agent (MTA) is the server software that routes email between domains — Sendmail, Postfix, Exchange. MTAs are responsible for accepting, forwarding, and delivering messages across the internet. A technician secures MTAs through TLS enforcement, relay restrictions, anti-spam filtering, and logging configuration to support incident investigation.",uc:1,depth:4,children:[]},{id:"uc1-email-mda",title:"MDA",explanation:"The Mail Delivery Agent (MDA) is the component that places delivered messages into the recipient’s mailbox. It performs final filtering, sorting, and storage. The MDA is the last security checkpoint before the user sees the message. A technician configures MDAs to apply content filtering, attachment scanning, and quarantine policies.",uc:1,depth:4,children:[]}]},{id:"uc1-email-protocolli",title:"Protocolli email",explanation:"Email protocols define how messages are sent, retrieved, and managed across the network. These protocols were designed without built-in security and require additional layers for protection.",uc:1,depth:3,children:[{id:"uc1-email-smtp",title:"SMTP",explanation:"Simple Mail Transfer Protocol is the standard for sending and relaying email between servers. SMTP was designed without authentication or encryption, making it vulnerable to spoofing, interception, and relay abuse. A technician secures SMTP through TLS encryption (STARTTLS), SMTP authentication, and careful relay configuration to prevent open relay exploitation.",uc:1,depth:4,children:[]},{id:"uc1-email-pop3",title:"POP3",explanation:"Post Office Protocol version 3 retrieves email from a server and typically downloads it to a single client, often deleting the server copy. POP3 is less suitable for modern multi-device environments but still used. A technician ensures POP3 connections use TLS encryption and advises migration to IMAP for better security and flexibility.",uc:1,depth:4,children:[]},{id:"uc1-email-imap",title:"IMAP",explanation:"Internet Message Access Protocol synchronizes email across multiple clients while keeping messages on the server. IMAP supports folders, search, and server-side filtering. A technician secures IMAP through TLS encryption, strong authentication, and access controls. IMAP credentials are valuable targets because they provide access to the entire mailbox.",uc:1,depth:4,children:[]}]},{id:"uc1-email-minacce",title:"Minacce email-borne",explanation:"Email-borne threats use the email channel to deliver malware, steal credentials, or manipulate recipients. These threats are effective because they exploit human trust and bypass perimeter defenses that focus on network traffic rather than content.",uc:1,depth:3,children:[{id:"uc1-email-phishing",title:"Phishing",explanation:"Phishing emails trick recipients into revealing credentials, installing malware, or transferring funds by impersonating trusted entities. Phishing is the most common email threat because it is cheap to execute and exploits human psychology. A technician combats phishing through technical controls (filtering, authentication) and human controls (training, reporting procedures).",uc:1,depth:4,children:[]},{id:"uc1-email-malware-attach",title:"Malware attachment",explanation:"Malicious attachments deliver executable malware disguised as documents, archives, or images. Attackers use file type spoofing (renaming .exe to .pdf.exe), macro-enabled Office documents, and compressed archives to evade filters. A technician implements attachment filtering, sandbox detonation, and user education about suspicious attachments.",uc:1,depth:4,children:[]},{id:"uc1-email-bec",title:"Business Email Compromise",explanation:"Business Email Compromise (BEC) is a sophisticated scam where attackers impersonate executives, vendors, or business partners to trick employees into transferring funds or sensitive data. BEC relies on social engineering rather than malware, making it difficult to detect with traditional security tools. A technician supports BEC prevention through email authentication and financial transaction verification procedures.",uc:1,depth:4,children:[]},{id:"uc1-email-spoofing",title:"Email spoofing",explanation:"Email spoofing forges the sender address to make messages appear from a trusted source. Because SMTP lacks built-in sender authentication, spoofing is trivial without additional protections. A technician implements SPF, DKIM, and DMARC to authenticate sender identity and enable receivers to reject spoofed messages.",uc:1,depth:4,children:[]}]},{id:"uc1-email-autenticazione",title:"Autenticazione email",explanation:"Email authentication protocols verify that a message genuinely originates from the claimed sender domain. These protocols are essential defenses against spoofing, phishing, and spam.",uc:1,depth:3,children:[{id:"uc1-email-spf",title:"SPF",explanation:"Sender Policy Framework allows domain owners to publish DNS records listing which mail servers are authorized to send email for their domain. Receiving servers check SPF records to reject messages from unauthorized sources. SPF is the first layer of email authentication and prevents basic spoofing, though it has limitations with forwarded email.",uc:1,depth:4,children:[]},{id:"uc1-email-dkim",title:"DKIM",explanation:"DomainKeys Identified Mail adds a cryptographic signature to outgoing emails, allowing receivers to verify that the message content was not altered in transit and that it originated from an authorized sender. DKIM provides both authentication and integrity protection. A technician configures DKIM key generation, rotation, and DNS publishing.",uc:1,depth:4,children:[]},{id:"uc1-email-dmarc",title:"DMARC",explanation:"Domain-based Message Authentication, Reporting, and Conformance builds on SPF and DKIM by telling receivers how to handle messages that fail authentication. DMARC also provides reports on authentication results, enabling domain owners to monitor spoofing attempts. A technician implements DMARC policies progressively: monitor, quarantine, then reject.",uc:1,depth:4,children:[]}]},{id:"uc1-email-difese",title:"Difese email",explanation:"Email defenses are layered technical and procedural controls that filter, analyze, and educate to prevent email-borne attacks from reaching users.",uc:1,depth:3,children:[{id:"uc1-email-gateway",title:"Email gateway",explanation:"An email gateway (secure email gateway) is a security appliance or cloud service that filters all inbound and outbound email traffic. It performs spam filtering, malware scanning, URL rewriting, attachment sandboxing, and data loss prevention. The gateway is the primary technical defense against email threats. A technician configures, monitors, and tunes gateway policies.",uc:1,depth:4,children:[]},{id:"uc1-email-content-filter",title:"Content filtering",explanation:"Content filtering analyzes email body text, subject lines, and attachments for suspicious patterns, keywords, and known malicious indicators. Advanced filters use machine learning to detect novel phishing techniques. A technician configures content filter rules, manages false positives, and ensures that filtering does not block legitimate business communications.",uc:1,depth:4,children:[]},{id:"uc1-email-sandboxing",title:"Attachment sandboxing",explanation:"Sandboxing detonates email attachments in an isolated virtual environment to observe their behavior before delivery. Malicious files reveal their true intent — network connections, file modifications, process injection — in the sandbox. A technician manages sandbox configuration, handles false positives, and investigates sandbox alerts to identify targeted attacks.",uc:1,depth:4,children:[]},{id:"uc1-email-awareness",title:"User awareness",explanation:"User awareness training educates employees to recognize and report suspicious emails. No technical filter is perfect; the user is the final line of defense. A technician supports awareness programs by providing real attack examples, managing phishing simulation exercises, and establishing simple reporting mechanisms for suspicious messages.",uc:1,depth:4,children:[]}]}]},{id:"uc1-forensics",title:"Digital Forensics",explanation:"Digital forensics is the scientific process of identifying, preserving, analyzing, and presenting digital evidence in a manner that is legally admissible. A technician supports forensic investigations by properly collecting evidence, maintaining chain of custody, and understanding the technical artifacts that reveal attacker activity.",uc:1,depth:2,children:[{id:"uc1-forensics-principi",title:"Principi forensi",explanation:"Forensic principles govern the handling of digital evidence to ensure its integrity, authenticity, and admissibility. Key principles include: do not alter original evidence, document every action, use validated tools, and maintain an unbroken chain of custody. A technician must follow these principles strictly because mishandled evidence is inadmissible and may compromise legal proceedings.",uc:1,depth:3,children:[]},{id:"uc1-forensics-chain",title:"Chain of custody",explanation:"Chain of custody is the documented record of who handled evidence, when, where, and why. Every transfer, analysis, and storage action is logged with timestamps and signatures. A compromised chain of custody can render evidence inadmissible in court. A technician meticulously documents every interaction with digital evidence from collection through presentation.",uc:1,depth:3,children:[]},{id:"uc1-forensics-disco",title:"Acquisizione disco",explanation:"Disk acquisition creates a bit-for-bit copy (forensic image) of storage media while preserving the original evidence in an unaltered state. Write blockers prevent accidental modification during imaging. Hash values verify image integrity. A technician performs disk acquisitions using forensic tools and documents the process to ensure the image is admissible evidence.",uc:1,depth:3,children:[]},{id:"uc1-forensics-ram",title:"Acquisizione RAM",explanation:"RAM acquisition captures the volatile memory of a running system before it is lost on power-off. RAM contains running processes, network connections, encryption keys, injected code, and artifacts that are not stored on disk. A technician performs RAM acquisition early in an investigation because it provides a snapshot of the system’s state at the time of compromise.",uc:1,depth:3,children:[]},{id:"uc1-forensics-log",title:"Analisi log",explanation:"Log analysis examines system and application logs to reconstruct events, identify attacker actions, and establish timelines. Logs are the primary source of evidence for understanding what happened during a security incident.",uc:1,depth:3,children:[{id:"uc1-forensics-web-access",title:"Web access log",explanation:"Web access logs record every HTTP request to a web server, including client IP, timestamp, requested URL, user agent, and response code. These logs reveal scanning activity, exploitation attempts, and data exfiltration via HTTP. A technician analyzes access logs to identify attack patterns, compromised accounts, and unauthorized data access.",uc:1,depth:4,children:[]},{id:"uc1-forensics-web-error",title:"Web error log",explanation:"Web error logs record server errors, application exceptions, and failed requests. Error logs can reveal exploitation attempts that caused application crashes, injection attacks that triggered database errors, and probing activity that targeted non-existent resources. A technician correlates error logs with access logs for a complete incident picture.",uc:1,depth:4,children:[]},{id:"uc1-forensics-os-log",title:"Sistema operativo",explanation:"Operating system logs record security-relevant events: authentication attempts, process creation, privilege escalation, file access, and system configuration changes. Windows Event Logs and Linux audit logs are primary sources. A technician reviews OS logs to identify unauthorized access, malware execution, and attacker persistence mechanisms.",uc:1,depth:4,children:[]},{id:"uc1-forensics-syslog",title:"Syslog",explanation:"Syslog is the standard protocol for log transmission in Unix-like systems, enabling centralized log collection from multiple devices. Syslog messages include timestamp, severity, facility, and message text. A technician configures syslog forwarding to a central SIEM, ensuring logs are protected from tampering and available for correlation analysis.",uc:1,depth:4,children:[]},{id:"uc1-forensics-journal",title:"Journal",explanation:"Systemd journal is a structured logging system that stores log entries with rich metadata in a binary format. The journal supports querying, filtering, and forward-sealing to prevent tampering. A technician uses journalctl to investigate Linux system events with more precision than traditional text-based logs permit.",uc:1,depth:4,children:[]}]},{id:"uc1-forensics-network",title:"Network forensics",explanation:"Network forensics captures and analyzes network traffic to reconstruct communications, identify data exfiltration, and detect covert channels. Packet captures (pcap files) contain the actual data transmitted across the network. A technician uses network forensics tools like Wireshark and tcpdump to analyze traffic when log data is insufficient or has been deleted by attackers.",uc:1,depth:3,children:[]},{id:"uc1-forensics-reporting",title:"Reporting forense",explanation:"Forensic reporting documents investigation findings in a clear, objective, and reproducible manner. Reports include methodology, evidence description, analysis results, conclusions, and supporting exhibits. A technician contributes technical details to forensic reports, ensuring that findings are backed by evidence and that analysis methods are sound and documented.",uc:1,depth:3,children:[]}]},{id:"uc1-governance",title:"Governance della sicurezza",explanation:"Security governance establishes the organizational framework for managing information security. It defines roles, responsibilities, policies, and processes that align security with business objectives. A technician operates within this governance framework and contributes to its effectiveness through compliance, reporting, and feedback.",uc:1,depth:2,children:[{id:"uc1-gov-framework",title:"Framework",explanation:"Security frameworks provide structured approaches to managing cybersecurity risk. They offer standardized processes, controls, and measurement methods that help organizations build comprehensive security programs.",uc:1,depth:3,children:[{id:"uc1-gov-nist",title:"Ciclo NIST (ID-PR-DE-RS-RC)",explanation:"The NIST Cybersecurity Framework organizes security activities into five functions: Identify, Protect, Detect, Respond, and Recover. This lifecycle approach ensures comprehensive coverage from risk assessment through incident recovery. A technician maps their activities to NIST functions to demonstrate how technical work supports the overall security program.",uc:1,depth:4,children:[]},{id:"uc1-gov-controlli",title:"Controlli di sicurezza",explanation:"Security controls are the specific safeguards and countermeasures implemented to manage risk. Frameworks like NIST SP 800-53 and ISO 27001 Annex A catalog hundreds of controls across categories like access control, audit, cryptography, and incident response. A technician implements, configures, and monitors the technical controls within these catalogs.",uc:1,depth:4,children:[]},{id:"uc1-gov-asset-mgmt",title:"Gestione asset",explanation:"Asset management is the process of identifying, classifying, and tracking all information assets — hardware, software, data, and services. You cannot protect what you do not know you have. A technician contributes to asset management through automated discovery tools, configuration management databases, and vulnerability scanning that identifies new or changed assets.",uc:1,depth:4,children:[]}]},{id:"uc1-gov-ism",title:"Information security management",explanation:"Information security management establishes the policies, standards, and guidelines that direct the security program. These documents form a hierarchy from high-level policy to detailed implementation guidance.",uc:1,depth:3,children:[{id:"uc1-gov-policy",title:"Policy",explanation:"A security policy is a high-level statement of management intent regarding information security. Policies are mandatory and define what must be done, not how to do it. Examples include acceptable use policy, password policy, and incident response policy. A technician enforces policy through technical controls and reports policy violations.",uc:1,depth:4,children:[]},{id:"uc1-gov-standard",title:"Standard",explanation:"Standards specify the mandatory requirements for implementing policies — specific technologies, configurations, or procedures that must be used. Standards provide consistency across the organization. A technician implements standards by configuring systems according to specified baselines and verifying compliance through audits.",uc:1,depth:4,children:[]},{id:"uc1-gov-linee-guida",title:"Linee guida",explanation:"Guidelines are recommended (non-mandatory) practices that provide advice on how to achieve policy objectives. They offer flexibility where standards would be too rigid. A technician uses guidelines as best-practice references when implementing controls in complex or unique environments where prescriptive standards do not apply.",uc:1,depth:4,children:[]}]},{id:"uc1-gov-allineamento",title:"Allineamento business-sicurezza",explanation:"Business-security alignment ensures that security investments support business objectives and that security risk is understood in business terms. Misalignment leads to either excessive security that hinders operations or insufficient security that exposes the organization to unacceptable risk. A technician contributes by translating technical risks into business impact language for management communication.",uc:1,depth:3,children:[]},{id:"uc1-gov-supply-chain",title:"Supply chain security",explanation:"Supply chain security addresses the risks introduced by third-party vendors, suppliers, and service providers. These external entities often have privileged access to systems and data, creating indirect attack paths that bypass perimeter defenses.",uc:1,depth:3,children:[{id:"uc1-gov-rischi-terze",title:"Rischi terze parti",explanation:"Third-party risks include data breaches at vendors, compromised software updates, insider threats from contractor staff, and intellectual property theft through outsourced services. The Target breach (via an HVAC vendor) demonstrated how low-privilege third-party access can lead to massive compromise. A technician assesses and monitors third-party access and security postures.",uc:1,depth:4,children:[]},{id:"uc1-gov-controlli-fornitori",title:"Controlli fornitori",explanation:"Vendor controls manage third-party risk through security questionnaires, contractual requirements, access limitations, and ongoing monitoring. Due diligence before engagement, periodic reassessment, and right-to-audit clauses are standard practices. A technician implements technical controls for vendor access: VPN restrictions, privileged access management, and activity monitoring.",uc:1,depth:4,children:[]}]}]},{id:"uc1-conformita",title:"Conformità normativa",explanation:"Regulatory compliance is the obligation to adhere to laws, regulations, and standards governing information security and data protection. Non-compliance can result in significant penalties, legal liability, and reputational damage. A technician implements the technical controls required by applicable regulations.",uc:1,depth:2,children:[{id:"uc1-conf-europeo",title:"Quadro europeo",explanation:"European regulations establish baseline security and data protection requirements across EU member states. The most impactful are the GDPR for data protection and the NIS directive for network and information system security.",uc:1,depth:3,children:[{id:"uc1-conf-gdpr",title:"Protezione dati personali",explanation:"The General Data Protection Regulation (GDPR) governs the processing of personal data of EU residents, regardless of where the processing occurs. It establishes rights for individuals and obligations for organizations.",uc:1,depth:4,children:[{id:"uc1-conf-minimizzazione",title:"Minimizzazione",explanation:"Data minimization requires that organizations collect and process only the personal data that is necessary for the specific purpose. Excessive data collection increases breach impact and violates the GDPR. A technician supports minimization by reviewing application data models, database schemas, and log configurations to eliminate unnecessary personal data storage.",uc:1,depth:5,children:[]},{id:"uc1-conf-diritti",title:"Diritti interessato",explanation:"The GDPR grants data subjects rights including access, rectification, erasure (right to be forgotten), restriction of processing, data portability, and objection. Organizations must implement technical mechanisms to fulfill these requests. A technician builds and maintains the systems that enable data subject rights fulfillment, including data discovery and deletion capabilities.",uc:1,depth:5,children:[]},{id:"uc1-conf-consenso",title:"Consenso",explanation:"Consent under the GDPR must be freely given, specific, informed, and unambiguous. Organizations must be able to demonstrate consent and allow withdrawal. A technician implements consent management systems, ensures that consent records are tamper-evident, and that data processing stops when consent is withdrawn.",uc:1,depth:5,children:[]},{id:"uc1-conf-notifica",title:"Notifica violazioni",explanation:"The GDPR mandates notification of personal data breaches to supervisory authorities within 72 hours and to affected individuals when the breach poses high risk. A technician plays a critical role in breach detection, assessment, and the technical investigation that determines whether notification is required.",uc:1,depth:5,children:[]}]},{id:"uc1-conf-nis",title:"Sicurezza reti e sistemi",explanation:"The NIS (Network and Information Systems) Directive and its successor NIS2 establish security requirements for operators of essential services and digital service providers. NIS2 expands scope, tightens reporting timelines (24 hours for initial notification), and increases penalties. A technician in covered sectors must implement NIS2-mandated security measures and incident reporting procedures.",uc:1,depth:4,children:[]}]},{id:"uc1-conf-nazionale",title:"Quadro nazionale",explanation:"National frameworks implement EU directives into domestic law and may add additional requirements specific to the country. In Italy, the National Cybersecurity Agency (ACN) coordinates national strategy, and sector-specific regulations apply to critical infrastructure, finance, and healthcare. A technician must be aware of the national requirements applicable to their organization’s industry and location.",uc:1,depth:3,children:[]},{id:"uc1-conf-impatto",title:"Impatto normativo",explanation:"Regulatory impact analysis determines how specific regulations affect the organization’s technical and operational security requirements.",uc:1,depth:3,children:[{id:"uc1-conf-requisiti-tech",title:"Requisiti tecnici",explanation:"Technical requirements from regulations specify the controls that must be implemented: encryption, access controls, logging, backup, and incident detection. A technician translates regulatory requirements into technical configurations, verifies implementation, and documents compliance evidence for auditors.",uc:1,depth:4,children:[]},{id:"uc1-conf-obblighi-org",title:"Obblighi organizzativi",explanation:"Organizational obligations from regulations include appointing responsible roles, conducting risk assessments, maintaining documentation, and reporting incidents. While primarily management responsibilities, a technician supports them by providing technical input for risk assessments, maintaining system documentation, and generating the data needed for regulatory reports.",uc:1,depth:4,children:[]}]}]},{id:"uc1-processi",title:"Processi aziendali e sicurezza",explanation:"Business processes and security intersect at every point where information is created, processed, stored, or transmitted. Understanding how business operates enables a technician to design security controls that protect without impeding workflow.",uc:1,depth:2,children:[{id:"uc1-proc-analisi",title:"Analisi processi business",explanation:"Business process analysis maps how work flows through the organization, identifying where sensitive data is handled, which systems are critical, and where security controls are needed. A technician participates in process analysis to understand the technical infrastructure supporting each process and to identify security gaps in workflows.",uc:1,depth:3,children:[]},{id:"uc1-proc-supporto",title:"Processi supporto ICT",explanation:"ICT support processes — change management, patch management, access provisioning, and incident handling — must incorporate security controls to prevent the support function itself from becoming an attack vector. A technician follows secure support procedures, documents all changes, and verifies that support activities do not introduce new vulnerabilities.",uc:1,depth:3,children:[]},{id:"uc1-proc-contromisure",title:"Contromisure organizzative",explanation:"Organizational countermeasures are procedural and structural controls that reduce security risk through human and process factors rather than technology alone.",uc:1,depth:3,children:[{id:"uc1-proc-segregazione",title:"Segregazione compiti",explanation:"Segregation of duties divides critical functions among multiple people so that no single individual can complete a sensitive process alone. For example, the person who requests a system change should not be the same person who approves and implements it. A technician implements technical controls that enforce separation — separate accounts, approval workflows, and logging that documents who performed each action.",uc:1,depth:4,children:[]},{id:"uc1-proc-escalation",title:"Escalation",explanation:"Escalation procedures define how security events are elevated to higher authority when they exceed the capability or authority of the initial responder. Clear escalation paths ensure that serious incidents receive appropriate attention and resources. A technician follows escalation procedures, knows their authority limits, and communicates effectively during escalations.",uc:1,depth:4,children:[]}]}]}]},{id:"uc2",title:"UC2 – Supporto all’implementazione di soluzioni di gestione del rischio",explanation:"UC2 focuses on practical defensive measures: implementing countermeasures, securing endpoints, networks, web applications, mobile devices, databases, and remote access. It covers security operations, incident management, business continuity, secure development, cloud security, and emerging threats. A technician implements these controls based on the risk analysis conducted in UC1.",uc:2,depth:1,children:[{id:"uc2-contromisure",title:"Contromisure preventive e reattive",explanation:"Countermeasures are the technical and procedural controls that reduce security risk. Preventive controls stop attacks from succeeding; reactive controls detect and respond to attacks that bypass prevention. A technician implements, configures, and maintains both categories of countermeasures.",uc:2,depth:2,children:[{id:"uc2-hardening",title:"Hardening",explanation:"Hardening is the process of securing a system by reducing its attack surface and eliminating unnecessary functions, accounts, and services. It is one of the most effective security practices because every disabled feature is a vulnerability that cannot be exploited.",uc:2,depth:3,children:[{id:"uc2-hardening-superficie",title:"Riduzione superficie attacco",explanation:"Attack surface reduction removes or disables everything not essential to the system’s function: unused services, default accounts, unnecessary software, open ports, and enabled features. The principle is simple: what does not exist cannot be attacked. A technician performs attack surface reduction as a foundational hardening step on every system.",uc:2,depth:4,children:[]},{id:"uc2-hardening-configurazione",title:"Gestione configurazioni",explanation:"Configuration management establishes and maintains secure baselines for all systems. It ensures that systems are deployed consistently, that changes are authorized and documented, and that configurations drift back toward secure states. A technician uses configuration management tools to enforce baselines, detect drift, and automate remediation.",uc:2,depth:4,children:[]},{id:"uc2-hardening-patch",title:"Patch management",explanation:"Patch management is the systematic process of acquiring, testing, and applying software updates to fix vulnerabilities. Unpatched systems are the most common targets for automated attacks. A technician maintains a patching schedule, tests patches for compatibility, deploys them promptly, and tracks exceptions where patches cannot be applied immediately.",uc:2,depth:4,children:[]}]},{id:"uc2-controllo-accessi",title:"Controllo degli accessi",explanation:"Access control ensures that only authorized users can access resources, and that their permissions are appropriate to their role. It encompasses authentication (verifying identity), authorization (granting permissions), and accounting (logging access).",uc:2,depth:3,children:[{id:"uc2-auth",title:"Autenticazione",explanation:"Authentication verifies that a user is who they claim to be. Strong authentication is the foundation of access control because all other permissions depend on correctly established identity.",uc:2,depth:4,children:[{id:"uc2-auth-sfa",title:"Single-factor",explanation:"Single-factor authentication uses one verification method, typically a password. It is the weakest form of authentication because passwords can be stolen, guessed, or phished. A technician understands that single-factor authentication provides minimal security and should be supplemented whenever possible, especially for sensitive systems.",uc:2,depth:5,children:[]},{id:"uc2-auth-mfa",title:"Multi-factor",explanation:"Multi-factor authentication (MFA) requires two or more independent verification factors: something you know (password), something you have (token, phone), or something you are (biometric). MFA dramatically reduces account compromise because an attacker must compromise multiple independent factors. A technician implements MFA across all sensitive systems and services.",uc:2,depth:5,children:[]},{id:"uc2-auth-aba",title:"Attribute-based",explanation:"Attribute-based authentication makes access decisions based on contextual attributes: time of day, location, device posture, network, and behavioral patterns. It enables risk-adaptive authentication that requests additional verification when anomalies are detected. A technician configures attribute-based policies to balance security with usability.",uc:2,depth:5,children:[]}]},{id:"uc2-autorizzazione",title:"Autorizzazione",explanation:"Authorization determines what an authenticated user is permitted to do. Different authorization models provide different levels of granularity and control.",uc:2,depth:4,children:[{id:"uc2-authz-dac",title:"DAC",explanation:"Discretionary Access Control allows resource owners to determine who can access their resources. Linux file permissions are a DAC implementation. DAC is flexible but vulnerable to insider threats because owners can accidentally or intentionally grant excessive access. A technician audits DAC configurations to ensure they align with least privilege.",uc:2,depth:5,children:[]},{id:"uc2-authz-mac",title:"MAC",explanation:"Mandatory Access Control enforces access policies defined by a central authority that users cannot override. SELinux and AppArmor implement MAC on Linux. MAC provides stronger security than DAC because even compromised user accounts cannot exceed their mandated permissions. A technician configures MAC policies for high-security environments.",uc:2,depth:5,children:[]},{id:"uc2-authz-rbac",title:"RBAC",explanation:"Role-Based Access Control assigns permissions to roles rather than individual users, and users are assigned to roles based on their job function. RBAC simplifies administration and supports separation of duties. A technician implements RBAC by defining role hierarchies, mapping organizational roles to system permissions, and automating role assignment and revocation.",uc:2,depth:5,children:[]}]},{id:"uc2-identita",title:"Identità digitale",explanation:"Digital identity is the online representation of a person or entity, comprising credentials, attributes, and entitlements. Managing digital identity throughout its lifecycle — creation, maintenance, and termination — is essential for security.",uc:2,depth:4,children:[{id:"uc2-id-ciclo",title:"Ciclo di vita",explanation:"The identity lifecycle covers provisioning (creating accounts and access rights), maintenance (updating roles and attributes as jobs change), and deprovisioning (removing access when employment ends). Failures in any phase create security gaps — orphaned accounts, excessive permissions, or unauthorized access by former employees. A technician automates lifecycle management to reduce human error.",uc:2,depth:5,children:[]},{id:"uc2-id-federazione",title:"Federazione",explanation:"Identity federation allows users to authenticate once and access multiple organizations’ systems without separate credentials for each. Federation uses trust agreements and standard protocols (SAML, OpenID Connect) to share identity assertions. A technician configures federation trust relationships, monitors token exchanges, and ensures that federation does not bypass security policies.",uc:2,depth:5,children:[]}]},{id:"uc2-id-protocols",title:"Identity Protocols",explanation:"Identity protocols are the technical standards that enable authentication and authorization across systems. Understanding these protocols is essential for implementing secure single sign-on, API access control, and federated identity.",uc:2,depth:4,children:[{id:"uc2-id-token",title:"Token-based authentication",explanation:"Token-based authentication uses digitally signed tokens (like JWT) to prove identity after an initial authentication. Tokens contain claims about the user and have an expiration time. A technician implements token-based auth for APIs and microservices, ensuring tokens are transmitted over HTTPS, have short lifetimes, and are validated on every request.",uc:2,depth:5,children:[]},{id:"uc2-id-sso",title:"Single Sign-On",explanation:"Single Sign-On allows users to authenticate once and access multiple applications without re-entering credentials. SSO improves both security (stronger central authentication) and usability (fewer passwords to manage). A technician deploys and configures SSO solutions, integrates applications, and monitors for SSO bypass attempts.",uc:2,depth:5,children:[]},{id:"uc2-id-fed-concepts",title:"Federation concepts",explanation:"Federation concepts include identity providers (IdP), service providers (SP), trust relationships, metadata exchange, and assertion protocols. Federation enables cross-organizational collaboration while maintaining security boundaries. A technician understands federation architectures to implement B2B partnerships, cloud integrations, and multi-tenant access scenarios.",uc:2,depth:5,children:[]}]}]},{id:"uc2-crittografia",title:"Crittografia",explanation:"Cryptography is the science of securing communication and data through mathematical transformations. It provides confidentiality (encryption), integrity (hashing), authenticity (digital signatures), and non-repudiation. A technician must understand cryptographic concepts to implement and evaluate security controls correctly.",uc:2,depth:3,children:[{id:"uc2-crypto-simmetrica",title:"Simmetrica",explanation:"Symmetric cryptography uses a single shared key for both encryption and decryption. It is fast and efficient for bulk data encryption but requires secure key distribution.",uc:2,depth:4,children:[{id:"uc2-crypto-blocchi",title:"Cifratura a blocchi",explanation:"Block ciphers encrypt data in fixed-size blocks (typically 128 bits) using algorithms like AES. Different modes of operation (CBC, GCM) provide different security properties. A technician must select appropriate algorithms and modes — for example, AES-256-GCM provides both confidentiality and authenticated encryption, while older modes like ECB are insecure.",uc:2,depth:5,children:[]},{id:"uc2-crypto-flusso",title:"Cifratura a flusso",explanation:"Stream ciphers encrypt data one bit or byte at a time, generating a keystream that is XORed with the plaintext. They are faster than block ciphers for real-time communication but vulnerable if the same key is reused. A technician uses stream ciphers (like ChaCha20) for specific use cases where low latency is critical, while avoiding known-weak algorithms like RC4.",uc:2,depth:5,children:[]}]},{id:"uc2-crypto-asimmetrica",title:"Asimmetrica",explanation:"Asymmetric cryptography uses a key pair: a public key for encryption and a private key for decryption. It solves the key distribution problem of symmetric cryptography and enables digital signatures.",uc:2,depth:4,children:[{id:"uc2-crypto-chiavi",title:"Chiave pubblica/privata",explanation:"The public-private key pair is the foundation of asymmetric cryptography. The public key can be freely distributed; the private key must be kept secret. Anyone can encrypt with the public key, but only the private key holder can decrypt. A technician manages key pairs carefully, ensuring private keys are stored securely with access controls and backup procedures.",uc:2,depth:5,children:[]},{id:"uc2-crypto-firma",title:"Firma digitale",explanation:"A digital signature uses the sender’s private key to sign a message hash, providing authentication, integrity, and non-repudiation. Anyone with the sender’s public key can verify the signature. A technician uses digital signatures for code signing, document authentication, and secure communications, verifying that signed content has not been tampered with.",uc:2,depth:5,children:[]}]},{id:"uc2-crypto-hash",title:"Funzioni di hash",explanation:"Cryptographic hash functions produce a fixed-length fingerprint of arbitrary input data. Good hash functions are one-way (irreversible) and collision-resistant. Hashing provides integrity verification: any change to the input produces a completely different hash. A technician uses SHA-256 for file integrity, password storage (with salt), and digital signature schemes.",uc:2,depth:4,children:[]},{id:"uc2-crypto-pki",title:"PKI",explanation:"Public Key Infrastructure is the system for creating, managing, distributing, and revoking digital certificates that bind public keys to identities. PKI enables trust in asymmetric cryptography at scale.",uc:2,depth:4,children:[{id:"uc2-crypto-certificati",title:"Certificati digitali",explanation:"A digital certificate is an electronic document that binds a public key to an identity (person, organization, or device), signed by a trusted Certificate Authority. Certificates contain validity periods, usage constraints, and revocation information. A technician deploys certificates for HTTPS, VPN authentication, code signing, and email encryption.",uc:2,depth:5,children:[]},{id:"uc2-crypto-ca",title:"Autorità di certificazione",explanation:"A Certificate Authority (CA) is a trusted entity that issues, signs, and manages digital certificates. Root CAs are the trust anchors of the PKI hierarchy. Compromising a CA undermines trust for all certificates it has issued. A technician manages internal CAs for enterprise certificates and validates external CAs used by services.",uc:2,depth:5,children:[]},{id:"uc2-crypto-catena",title:"Catena di fiducia",explanation:"The chain of trust connects a certificate to a root CA through intermediate certificates. Each certificate is signed by the issuer above it, forming a chain. Verification involves validating each signature up to a trusted root. A technician troubleshoots certificate validation failures by examining the complete chain and ensuring all intermediates are properly configured.",uc:2,depth:5,children:[]}]},{id:"uc2-crypto-tls",title:"TLS / SSL",explanation:"Transport Layer Security (TLS) and its predecessor SSL provide encrypted, authenticated communication over networks. TLS uses a combination of asymmetric cryptography for key exchange, symmetric cryptography for bulk encryption, and hashing for integrity. A technician configures TLS versions, cipher suites, and certificates to secure web servers, APIs, email, and VPN connections.",uc:2,depth:4,children:[]},{id:"uc2-crypto-key-mgmt",title:"Gestione chiavi",explanation:"Key management is the most challenging aspect of cryptography. Keys must be generated securely, distributed safely, rotated periodically, and revoked when compromised. Poor key management undermines even the strongest algorithms.",uc:2,depth:4,children:[{id:"uc2-crypto-generazione",title:"Generazione",explanation:"Key generation must use cryptographically secure random number generators to produce unpredictable keys. Weak randomness leads to predictable keys that attackers can guess or derive. A technician ensures that key generation uses hardware security modules (HSMs) or software-based secure random sources, with appropriate key lengths for the required security level.",uc:2,depth:5,children:[]},{id:"uc2-crypto-distribuzione",title:"Distribuzione",explanation:"Key distribution securely delivers keys to authorized parties without exposing them to interception. Asymmetric cryptography reduces the distribution problem by allowing public keys to be shared openly while keeping private keys secret. A technician implements secure key distribution through encrypted channels, key exchange protocols (Diffie-Hellman), and out-of-band verification.",uc:2,depth:5,children:[]},{id:"uc2-crypto-rotazione",title:"Rotazione",explanation:"Key rotation periodically replaces encryption keys with new ones to limit the impact of a compromise. If a key is compromised, only data encrypted since the last rotation is at risk. A technician implements automated key rotation policies, ensuring that rotation occurs without service disruption and that old keys are securely archived for decryption of legacy data.",uc:2,depth:5,children:[]},{id:"uc2-crypto-revoca",title:"Revoca",explanation:"Key revocation invalidates a key before its natural expiration, typically because it has been compromised or the associated entity is no longer trusted. Certificate Revocation Lists (CRLs) and the Online Certificate Status Protocol (OCSP) enable real-time revocation checking. A technician implements revocation checking and responds to revocation events by replacing compromised certificates.",uc:2,depth:5,children:[]}]}]},{id:"uc2-sicurezza-fisica",title:"Sicurezza fisica",explanation:"Physical security protects facilities, equipment, and personnel from physical threats: theft, vandalism, natural disasters, and espionage. Physical security is the foundation of all other security controls because an attacker with physical access can eventually bypass logical protections.",uc:2,depth:3,children:[{id:"uc2-fisica-accessi",title:"Controllo accessi fisici",explanation:"Physical access controls restrict entry to facilities, data centers, and sensitive areas. Controls include locks, badge readers, biometrics, mantraps, and security guards. A technician implements electronic access control systems, integrates them with identity management, and ensures that access logs are maintained for audit and investigation purposes.",uc:2,depth:4,children:[]},{id:"uc2-fisica-asset",title:"Protezione asset fisici",explanation:"Physical asset protection secures hardware from theft, damage, and unauthorized access. Controls include cable locks for laptops, tamper-evident seals on servers, environmental monitoring (temperature, humidity), and secure disposal procedures. A technician implements asset tracking, ensures equipment is physically secured, and manages the secure destruction of storage media at end-of-life.",uc:2,depth:4,children:[]}]}]},{id:"uc2-endpoint",title:"Endpoint Security",explanation:"Endpoint security protects individual devices — desktops, laptops, servers, and mobile devices — from threats. Endpoints are frequent targets because they have direct user interaction, run diverse software, and often operate outside the perimeter. A technician deploys and manages endpoint security tools.",uc:2,depth:2,children:[{id:"uc2-endpoint-edr",title:"EDR concepts",explanation:"Endpoint Detection and Response (EDR) is a security solution that continuously monitors endpoints for suspicious activity, collects behavioral data, and enables rapid incident response. EDR tools detect threats that signature-based antivirus misses by analyzing process behavior, network connections, and file system activity. A technician deploys EDR agents, tunes detection rules, and investigates EDR alerts.",uc:2,depth:3,children:[]},{id:"uc2-endpoint-xdr",title:"XDR concepts",explanation:"Extended Detection and Response (XDR) extends EDR by integrating data from multiple sources — endpoints, networks, cloud, and email — into a unified detection and response platform. XDR correlates alerts across domains to identify multi-stage attacks that single-point solutions miss. A technician configures XDR integrations and uses cross-domain correlation to identify complex threats.",uc:2,depth:3,children:[]},{id:"uc2-endpoint-ngav",title:"NGAV concepts",explanation:"Next-Generation Antivirus (NGAV) moves beyond signature-based detection to use behavioral analysis, machine learning, and exploit prevention. NGAV blocks unknown malware and fileless attacks that traditional antivirus cannot detect. A technician replaces or supplements legacy antivirus with NGAV solutions and configures their detection policies.",uc:2,depth:3,children:[]},{id:"uc2-endpoint-firewall",title:"Host-based firewall",explanation:"A host-based firewall controls network traffic to and from an individual device, providing protection even when the endpoint is outside the network perimeter. Host firewalls complement network firewalls by enforcing policy at the endpoint level.",uc:2,depth:3,children:[{id:"uc2-endpoint-iptables",title:"iptables",explanation:"iptables is the legacy Linux firewall administration tool that configures the netfilter framework in the kernel. It defines rules that filter packets based on criteria like source/destination IP, port, protocol, and connection state. Understanding host-based packet filtering is essential because it allows a technician to enforce the principle of least privilege at the network level on each endpoint.",uc:2,depth:4,children:[]},{id:"uc2-endpoint-nftables",title:"nftables",explanation:"nftables is the modern successor to iptables in the Linux kernel, providing a more unified and efficient framework for packet filtering, NAT, and logging. nftables uses a simpler syntax and better performance for complex rule sets. A technician should be familiar with nftables as the current standard for Linux host-based firewall configuration.",uc:2,depth:4,children:[]},{id:"uc2-endpoint-ufw",title:"UFW",explanation:"Uncomplicated Firewall (UFW) is a simplified interface for managing iptables/nftables on Ubuntu and Debian systems. It provides an accessible way to configure host-based firewall rules without mastering the full iptables syntax. A technician uses UFW for quick firewall configuration on Linux workstations and servers.",uc:2,depth:4,children:[]},{id:"uc2-endpoint-wdf",title:"Windows Defender Firewall",explanation:"Windows Defender Firewall is the built-in host-based firewall for Windows systems, providing inbound and outbound traffic filtering, rule-based access control, and integration with Windows security policies. A technician configures Windows Firewall through Group Policy, creates application-specific rules, and monitors firewall logs for blocked connection attempts.",uc:2,depth:4,children:[]}]},{id:"uc2-endpoint-device-control",title:"Device control",explanation:"Device control restricts the use of removable media (USB drives, optical discs, Bluetooth) on endpoints to prevent data exfiltration and malware introduction. Policies can block all removable devices, allow only approved devices, or require encryption. A technician implements device control through endpoint protection platforms or operating system policies.",uc:2,depth:3,children:[]},{id:"uc2-endpoint-whitelisting",title:"Application whitelisting",explanation:"Application whitelisting allows only approved programs to execute, blocking all unauthorized software including unknown malware. Unlike blacklisting (antivirus), whitelisting assumes everything is untrusted unless explicitly approved. It is one of the most effective endpoint controls but requires careful management. A technician maintains application inventories, creates whitelist policies, and handles exception requests.",uc:2,depth:3,children:[]}]},{id:"uc2-rete",title:"Sicurezza di rete",explanation:"Network security protects the communication infrastructure that connects systems and enables data flow. It encompasses architecture design, traffic filtering, monitoring, and defense against network-borne attacks. A technician implements network security controls at the perimeter, between segments, and within the internal network.",uc:2,depth:2,children:[{id:"uc2-rete-architettura",title:"Architettura sicura",explanation:"Secure network architecture designs the network topology with security as a primary consideration, using segmentation, isolation, and controlled access paths to limit the impact of breaches.",uc:2,depth:3,children:[{id:"uc2-rete-segmentazione",title:"Segmentazione",explanation:"Network segmentation divides the network into isolated zones to contain breaches and control traffic flow. Each segment has its own security policies based on the sensitivity of the systems it contains.",uc:2,depth:4,children:[{id:"uc2-rete-zone",title:"Zone di fiducia",explanation:"Trust zones are network segments with different security levels based on the sensitivity of their assets and the trustworthiness of their users. Traffic between zones is strictly controlled by firewalls. A common design has a high-trust internal zone, a lower-trust guest zone, and a no-trust internet zone. A technician implements and enforces inter-zone access policies.",uc:2,depth:5,children:[]},{id:"uc2-rete-dmz",title:"DMZ",explanation:"A Demilitarized Zone (DMZ) is a network segment that sits between the internal network and the internet, hosting public-facing services like web servers and mail gateways. The DMZ is designed to be breached without exposing the internal network. A technician configures DMZ segments with minimal access to internal resources and maximum logging of all connections.",uc:2,depth:5,children:[]}]},{id:"uc2-rete-perimetro",title:"Perimetro",explanation:"The network perimeter is the boundary between the internal network and external, untrusted networks (primarily the internet). Perimeter defenses include firewalls, intrusion prevention systems, and VPN gateways. While modern security models move beyond perimeter-centric defense, the perimeter remains a critical control point for filtering inbound and outbound traffic.",uc:2,depth:4,children:[]},{id:"uc2-rete-zerotrust",title:"Zero Trust",explanation:"Zero Trust is a security model that assumes no user or device is trusted by default, regardless of location. Every access request is verified based on identity, device health, and context before being granted.",uc:2,depth:4,children:[{id:"uc2-rete-zt-verifica",title:"Verifica continua identità",explanation:"Continuous identity verification in Zero Trust means that authentication is not a one-time event at login. The system continuously validates the user’s identity, device posture, and behavioral patterns throughout the session. Anomalous activity triggers re-authentication or access revocation. A technician implements continuous verification through adaptive authentication and behavioral analytics.",uc:2,depth:5,children:[]},{id:"uc2-rete-zt-privilegio",title:"Privilegio minimo dinamico",explanation:"Dynamic least privilege in Zero Trust means that access rights are granted just-in-time and just-enough for the specific task, then revoked when no longer needed. This contrasts with static permissions that persist indefinitely. A technician implements just-in-time access through privileged access management (PAM) solutions that broker temporary elevated permissions.",uc:2,depth:5,children:[]}]}]},{id:"uc2-rete-filtraggio",title:"Filtraggio traffico",explanation:"Traffic filtering examines network packets and enforces policies to allow, block, or modify traffic based on defined rules. Filtering is the primary mechanism for network access control and attack prevention.",uc:2,depth:3,children:[{id:"uc2-rete-stateless",title:"Stateless",explanation:"Stateless filtering evaluates each packet independently based on header information (source/destination IP, port, protocol) without considering the connection context. Stateless firewalls are fast but cannot detect attacks that span multiple packets or connections. A technician uses stateless filtering for simple access control lists and high-throughput scenarios.",uc:2,depth:4,children:[]},{id:"uc2-rete-stateful",title:"Stateful",explanation:"Stateful filtering tracks the state of network connections and makes decisions based on the connection context. It understands TCP handshakes, session establishment, and return traffic. Stateful inspection can detect anomalies like unsolicited responses and half-open connections. A technician configures stateful firewalls as the primary network boundary control.",uc:2,depth:4,children:[]}]},{id:"uc2-rete-monitoraggio",title:"Monitoraggio traffico",explanation:"Traffic monitoring captures and analyzes network communications to detect threats, troubleshoot issues, and gather forensic evidence. It provides visibility into what is actually happening on the network.",uc:2,depth:3,children:[{id:"uc2-rete-pacchetti",title:"Analisi pacchetti",explanation:"Packet analysis (deep packet inspection) examines the full content of network packets, including headers and payloads. Tools like Wireshark capture and decode packets for manual analysis. A technician uses packet analysis for incident investigation, protocol debugging, and detecting malicious content embedded in network traffic that signature-based tools miss.",uc:2,depth:4,children:[]},{id:"uc2-rete-flussi",title:"Analisi flussi",explanation:"Flow analysis examines metadata about network connections — source/destination IP, port, protocol, packet count, and duration — without inspecting packet contents. NetFlow and IPFIX are common flow formats. Flow analysis is efficient for large networks and detects patterns like data exfiltration, C2 beaconing, and scanning. A technician deploys flow collectors and creates detection rules based on flow anomalies.",uc:2,depth:4,children:[]},{id:"uc2-rete-ids",title:"Rilevamento intrusioni",explanation:"Intrusion Detection Systems (IDS) monitor network traffic for signs of malicious activity or policy violations. They alert security personnel when suspicious patterns are detected.",uc:2,depth:4,children:[{id:"uc2-rete-ids-firma",title:"Basato su firma",explanation:"Signature-based IDS compares network traffic against
