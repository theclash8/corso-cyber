 a database of known attack patterns (signatures). It is effective against known threats but cannot detect novel attacks or zero-days. A technician maintains signature databases, tunes rules to minimize false positives, and understands the limitations of signature-based detection.",uc:2,depth:5,children:[]},{id:"uc2-rete-ids-anomalia",title:"Basato su anomalia",explanation:"Anomaly-based IDS (and behavioral IDS) establishes a baseline of normal network activity and alerts on deviations. It can detect unknown attacks and insider threats but produces more false positives. A technician trains anomaly detection systems with representative baseline data and refines thresholds through continuous tuning.",uc:2,depth:5,children:[]}]}]},{id:"uc2-rete-attacchi",title:"Attacchi di rete",explanation:"Network attacks exploit vulnerabilities in network protocols, services, and configurations. Understanding attack techniques enables a technician to design effective defenses and recognize attack indicators.",uc:2,depth:3,children:[{id:"uc2-rete-intercettazione",title:"Intercettazione",explanation:"Interception attacks capture or redirect network traffic to steal data or inject malicious content.",uc:2,depth:4,children:[{id:"uc2-rete-mitm",title:"Man-in-the-Middle",explanation:"A Man-in-the-Middle (MitM) attack positions the attacker between two communicating parties, intercepting and potentially modifying their traffic. Techniques include ARP spoofing, DNS hijacking, and rogue Wi-Fi access points. A technician prevents MitM attacks through encryption (TLS, VPNs), certificate pinning, and network access controls.",uc:2,depth:5,children:[]}]},{id:"uc2-rete-spoofing",title:"Spoofing",explanation:"Spoofing attacks forge identity information to impersonate legitimate devices or users on the network.",uc:2,depth:4,children:[{id:"uc2-rete-arp-spoofing",title:"ARP spoofing",explanation:"ARP spoofing sends falsified ARP messages to associate the attacker’s MAC address with the IP address of another device (typically the default gateway). This enables traffic interception on local networks. A technician prevents ARP spoofing through dynamic ARP inspection (DAI), static ARP entries, and network segmentation.",uc:2,depth:5,children:[]},{id:"uc2-rete-ip-spoofing",title:"IP spoofing",explanation:"IP spoofing forges the source IP address in packets to impersonate another system, bypass access controls based on IP trust, or hide the attacker’s identity. It is commonly used in DDoS attacks and trust exploitation. A technician prevents IP spoofing through ingress/egress filtering (BCP38), disabling source routing, and not relying on IP addresses for authentication.",uc:2,depth:5,children:[]}]},{id:"uc2-rete-session-hijacking",title:"Session hijacking",explanation:"Session hijacking steals an established session token or cookie to impersonate an authenticated user without knowing their credentials. Attackers obtain session identifiers through XSS, network sniffing, or malware. A technician prevents session hijacking through HTTPS enforcement, secure cookie flags (HttpOnly, Secure, SameSite), short session timeouts, and IP binding.",uc:2,depth:4,children:[]},{id:"uc2-rete-dos",title:"Denial of Service",explanation:"Denial of Service attacks overwhelm a target system with traffic or requests, making it unavailable to legitimate users. These attacks target availability, one of the CIA Triad pillars.",uc:2,depth:4,children:[{id:"uc2-rete-dos-singolo",title:"DoS",explanation:"A Denial of Service (DoS) attack originates from a single source and floods the target with traffic or exploits a vulnerability that crashes the service. While less common today, DoS attacks from a single powerful source or a well-crafted exploit can still be effective. A technician mitigates DoS through rate limiting, resource quotas, and vulnerability patching.",uc:2,depth:5,children:[]},{id:"uc2-rete-ddos",title:"DDoS",explanation:"A Distributed Denial of Service (DDoS) attack coordinates thousands or millions of compromised devices (a botnet) to simultaneously flood the target. DDoS attacks can generate terabits of traffic, overwhelming most defensive capabilities. A technician mitigates DDoS through upstream filtering, CDN-based absorption, anycast network distribution, and DDoS mitigation services.",uc:2,depth:5,children:[]}]},{id:"uc2-rete-distribuiti",title:"Attacchi sistemi distribuiti",explanation:"Distributed systems attacks target the coordination mechanisms of distributed architectures: consensus protocols, distributed databases, and service meshes. These attacks exploit the complexity of distributed systems to cause inconsistency, partition tolerance violations, or cascade failures. A technician secures distributed systems through strong authentication between nodes, encrypted inter-service communication, and partition-aware design.",uc:2,depth:4,children:[]}]},{id:"uc2-rete-wireless",title:"Wireless security",explanation:"Wireless networks transmit data over radio waves, making them inherently more vulnerable to interception and unauthorized access than wired networks. Wireless security protects the confidentiality and integrity of over-the-air communications.",uc:2,depth:3,children:[{id:"uc2-rete-wireless-vuln",title:"Vulnerabilità reti wireless",explanation:"Wireless networks are vulnerable to eavesdropping (anyone within range can capture traffic), rogue access points (attackers deploy fake APs to steal credentials), and wardriving (scanning for unsecured networks). The shared medium of radio transmission means physical access to a cable is not required to intercept communications. A technician addresses these vulnerabilities through strong encryption, network segmentation, and wireless intrusion detection.",uc:2,depth:4,children:[]},{id:"uc2-rete-wireless-protezione",title:"Meccanismi protezione",explanation:"Wireless protection mechanisms encrypt and authenticate wireless communications to prevent unauthorized access and eavesdropping. Each generation has addressed weaknesses in the previous one.",uc:2,depth:4,children:[{id:"uc2-rete-wep",title:"WEP",explanation:"Wired Equivalent Privacy was the original Wi-Fi security protocol, using RC4 encryption with static keys. WEP is fundamentally broken — its weak initialization vectors and key scheduling allow recovery of the encryption key in minutes using freely available tools. WEP represents the concept of deprecated, cryptographically broken security protocols. A technician must ensure WEP is nowhere in the environment and upgrade any legacy equipment.",uc:2,depth:5,children:[]},{id:"uc2-rete-wpa",title:"WPA",explanation:"Wi-Fi Protected Access replaced WEP, using TKIP (Temporal Key Integrity Protocol) for encryption while maintaining compatibility with older hardware. WPA was an interim solution that improved security but still had weaknesses. It represents the evolution of wireless security responding to demonstrated failures. A technician ensures WPA networks are upgraded to WPA2 or WPA3.",uc:2,depth:5,children:[]},{id:"uc2-rete-wpa2",title:"WPA2",explanation:"WPA2 introduced AES-CCMP encryption, replacing the flawed TKIP protocol, and provides strong confidentiality and integrity for wireless communications. WPA2-Personal uses a pre-shared key; WPA2-Enterprise uses 802.1X authentication with a RADIUS server. A technician deploys WPA2-Enterprise for corporate networks and monitors for the KRACK vulnerability in implementations.",uc:2,depth:5,children:[]},{id:"uc2-rete-wpa3",title:"WPA3",explanation:"WPA3 is the current Wi-Fi security standard, introducing Simultaneous Authentication of Equals (SAE) for stronger password-based authentication, individualized data encryption on open networks (OWE), and protected management frames. WPA3 addresses weaknesses in WPA2 including offline dictionary attacks. A technician deploys WPA3 on new equipment and plans upgrades for legacy infrastructure.",uc:2,depth:5,children:[]}]}]}]},{id:"uc2-web",title:"Sicurezza web",explanation:"Web security protects web applications, APIs, and browsers from attacks that exploit the HTTP protocol, application logic, and client-side processing. Web applications are the most exposed attack surface for most organizations because they are accessible from anywhere on the internet.",uc:2,depth:2,children:[{id:"uc2-web-architettura",title:"Architettura web sicura",explanation:"Secure web architecture designs applications with security integrated from the ground up, separating concerns and enforcing security boundaries between components.",uc:2,depth:3,children:[{id:"uc2-web-separazione",title:"Separazione frontend/backend",explanation:"Separating frontend presentation logic from backend business logic and data access creates clear security boundaries. The frontend should never trust user input and the backend should validate every request independently. A technician reviews application architecture to ensure this separation is maintained and that backend APIs enforce authentication and authorization regardless of frontend behavior.",uc:2,depth:4,children:[]},{id:"uc2-web-api-security",title:"API security",explanation:"Application Programming Interfaces (APIs) expose application functionality to clients, mobile apps, and third-party integrations. APIs are a primary attack target because they provide direct access to backend systems. A technician implements API authentication, rate limiting, input validation, and logging to protect against API-specific attacks like object enumeration and mass assignment.",uc:2,depth:4,children:[]}]},{id:"uc2-web-vulnerabilita",title:"Vulnerabilità applicative",explanation:"Application vulnerabilities are coding flaws that attackers exploit to compromise web applications. The OWASP Top 10 catalogs the most critical and prevalent web application security risks.",uc:2,depth:3,children:[{id:"uc2-web-injection",title:"Injection",explanation:"Injection attacks send malicious data to an interpreter as part of a command or query, tricking the interpreter into executing unintended actions.",uc:2,depth:4,children:[{id:"uc2-web-sql",title:"SQL injection",explanation:"SQL injection inserts malicious SQL code into application queries, allowing attackers to read, modify, or delete database contents, and potentially execute commands on the database server. It remains one of the most common and damaging web vulnerabilities. A technician prevents SQL injection through parameterized queries, input validation, and web application firewalls.",uc:2,depth:5,children:[]},{id:"uc2-web-cmd",title:"Command injection",explanation:"Command injection passes malicious operating system commands through application input to be executed by the server. It occurs when applications pass user input directly to system shell commands. A technician prevents command injection by avoiding shell execution of user input, using parameterized system calls, and implementing strict input validation.",uc:2,depth:5,children:[]}]},{id:"uc2-web-xss",title:"XSS",explanation:"Cross-Site Scripting (XSS) injects malicious scripts into web pages viewed by other users. The attacker’s code executes in the victim’s browser with the privileges of the trusted website.",uc:2,depth:4,children:[{id:"uc2-web-xss-stored",title:"Stored",explanation:"Stored XSS (persistent XSS) occurs when malicious scripts are permanently saved on the server — in a database, comment field, or user profile — and served to all users who view the infected page. It is the most dangerous XSS type because it affects many victims without requiring social engineering. A technician prevents stored XSS through output encoding and input sanitization.",uc:2,depth:5,children:[]},{id:"uc2-web-xss-reflected",title:"Reflected",explanation:"Reflected XSS occurs when malicious scripts are embedded in a URL and executed when a victim clicks the link. The script is not stored on the server; it is reflected in the server’s response to the crafted request. Reflected XSS requires social engineering to deliver the malicious URL. A technician prevents reflected XSS through output encoding and Content Security Policy.",uc:2,depth:5,children:[]},{id:"uc2-web-xss-dom",title:"DOM-based",explanation:"DOM-based XSS occurs when client-side JavaScript writes user-controllable data to the Document Object Model (DOM) without sanitization, causing script execution entirely in the browser. The server may never see the malicious payload. A technician prevents DOM-based XSS through secure JavaScript coding practices and client-side input validation.",uc:2,depth:5,children:[]}]},{id:"uc2-web-csrf",title:"CSRF",explanation:"Cross-Site Request Forgery tricks authenticated users into executing unwanted actions on a web application by embedding malicious requests in pages they visit. The attacker exploits the browser’s automatic inclusion of session cookies. A technician prevents CSRF through anti-CSRF tokens, SameSite cookie attributes, and validation of the Origin/Referer headers.",uc:2,depth:4,children:[]},{id:"uc2-web-broken-auth",title:"Broken authentication",explanation:"Broken authentication vulnerabilities allow attackers to compromise passwords, keys, or session tokens, or to exploit implementation flaws to assume other users’ identities. Common issues include weak password policies, session fixation, and credential stuffing. A technician implements strong authentication, MFA, secure session management, and account lockout policies.",uc:2,depth:4,children:[]},{id:"uc2-web-data-exposure",title:"Esposizione dati sensibili",explanation:"Sensitive data exposure occurs when applications inadequately protect confidential data — financial information, health records, credentials — through weak encryption, misconfigured access controls, or accidental exposure in error messages and logs. A technician implements encryption at rest and in transit, access controls, data classification, and secure logging practices.",uc:2,depth:4,children:[]},{id:"uc2-web-config",title:"Configurazioni errate",explanation:"Security misconfiguration is the most commonly seen vulnerability, resulting from insecure default configurations, incomplete configurations, open cloud storage, misconfigured HTTP headers, and verbose error messages. A technician prevents misconfiguration through automated hardening, configuration management, regular security reviews, and minimal platform installation.",uc:2,depth:4,children:[]}]},{id:"uc2-web-api",title:"API Security",explanation:"API security encompasses the specific measures needed to protect web service interfaces from abuse, unauthorized access, and exploitation of API-specific vulnerabilities.",uc:2,depth:3,children:[{id:"uc2-web-api-gateway",title:"API gateway concepts",explanation:"An API gateway is a server that acts as an entry point for API requests, providing authentication, rate limiting, logging, and request routing. It centralizes API security controls and simplifies client access. A technician deploys API gateways to enforce consistent security policies across all APIs rather than implementing controls individually.",uc:2,depth:4,children:[]},{id:"uc2-web-api-rate",title:"Rate limiting",explanation:"Rate limiting restricts the number of API requests a client can make within a time period, preventing abuse, brute force attacks, and resource exhaustion. Rate limits can be applied per user, per IP, or per API key. A technician configures rate limiting at the gateway and application levels, with appropriate thresholds for different API endpoints.",uc:2,depth:4,children:[]},{id:"uc2-web-api-token",title:"Token authentication",explanation:"API token authentication uses bearer tokens (JWT, OAuth access tokens) to authenticate API requests. Tokens are included in the Authorization header and validated on every request. A technician implements secure token generation, short expiration times, refresh token rotation, and secure token storage on the client side.",uc:2,depth:4,children:[]},{id:"uc2-web-api-validation",title:"API input validation",explanation:"API input validation ensures that all data received by the API conforms to expected formats, types, ranges, and lengths. APIs are particularly vulnerable to input validation failures because they accept structured data (JSON, XML) that may contain nested malicious payloads. A technician implements schema validation, type checking, and strict whitelist-based input filtering.",uc:2,depth:4,children:[]},{id:"uc2-web-api-vuln-cat",title:"API vulnerability categories",explanation:"API-specific vulnerabilities include broken object level authorization (BOLA), where users access other users’ data by manipulating object IDs; excessive data exposure, where APIs return more data than the client displays; and mass assignment, where users can modify read-only fields. A technician addresses these through authorization checks on every request and careful API design.",uc:2,depth:4,children:[]}]},{id:"uc2-web-canale",title:"Sicurezza canale comunicazione",explanation:"Communication channel security ensures that data transmitted between clients and servers cannot be intercepted, modified, or forged by attackers.",uc:2,depth:3,children:[{id:"uc2-web-critt-transito",title:"Crittografia in transito",explanation:"Encryption in transit protects data as it travels across networks using protocols like TLS. TLS provides confidentiality (preventing eavesdropping), integrity (preventing tampering), and authentication (verifying the server identity through certificates). A technician enforces TLS on all connections, disables weak cipher suites and protocol versions, and implements certificate pinning where appropriate.",uc:2,depth:4,children:[]},{id:"uc2-web-integrita",title:"Integrità comunicazione",explanation:"Communication integrity ensures that transmitted data is not modified in transit. TLS provides integrity through message authentication codes (MACs) that detect any tampering. Without integrity protection, attackers could modify requests or responses to change transaction amounts, redirect actions, or inject malicious content. A technician verifies that all sensitive communications use protocols with built-in integrity protection.",uc:2,depth:4,children:[]}]},{id:"uc2-web-browser",title:"Sicurezza browser",explanation:"Browser security controls protect users from malicious websites, scripts, and content delivered through the browser. These are client-side defenses that supplement server-side security.",uc:2,depth:3,children:[{id:"uc2-web-sop",title:"Same-origin policy",explanation:"The Same-Origin Policy (SOP) is a fundamental browser security mechanism that restricts how documents or scripts loaded from one origin can interact with resources from another origin. It prevents malicious websites from reading data from other domains. A technician understands SOP because bypassing or misconfiguring it (through CORS misconfiguration or cross-origin attacks) leads to data theft.",uc:2,depth:4,children:[]},{id:"uc2-web-csp",title:"Content Security Policy",explanation:"Content Security Policy (CSP) is a browser security mechanism that prevents XSS and data injection attacks by specifying which sources of content (scripts, styles, images) are allowed to execute or load. CSP provides a whitelist-based defense against code injection. A technician implements CSP headers, starting in report-only mode to identify policy violations before enforcement.",uc:2,depth:4,children:[]}]}]},{id:"uc2-mobile",title:"Sicurezza mobile",explanation:"Mobile security addresses the unique threats and vulnerabilities of smartphones and tablets. Mobile devices blend personal and corporate data, connect to untrusted networks, run apps from public stores, and are easily lost or stolen. A technician implements controls to secure mobile endpoints and the corporate data they access.",uc:2,depth:2,children:[{id:"uc2-mobile-superfici",title:"Superfici attacco",explanation:"Mobile attack surfaces include the operating system, installed applications, network interfaces, sensors, and physical device. Each component can be exploited to compromise the device or the data it contains.",uc:2,depth:3,children:[{id:"uc2-mobile-os",title:"Sistema operativo mobile",explanation:"Mobile operating systems (iOS, Android) have distinct security architectures with sandboxed apps, permission systems, and hardware-backed cryptography. However, OS vulnerabilities still occur — particularly in the Android ecosystem where fragmentation delays patching. A technician enforces OS update policies, monitors for known vulnerabilities, and manages the trade-off between security and app compatibility.",uc:2,depth:4,children:[]},{id:"uc2-mobile-app",title:"Applicazioni",explanation:"Mobile applications are a major attack surface because they process sensitive data, request extensive permissions, and may contain security flaws. Attackers distribute malicious apps through official and third-party app stores. A technician implements mobile application management (MAM), app vetting procedures, and restricts installation to approved apps.",uc:2,depth:4,children:[]}]},{id:"uc2-mobile-vuln",title:"Vulnerabilità",explanation:"Mobile vulnerabilities are weaknesses specific to mobile platforms and applications that attackers exploit to steal data, gain unauthorized access, or control the device.",uc:2,depth:3,children:[{id:"uc2-mobile-storage",title:"Storage insicuro",explanation:"Insecure storage occurs when mobile apps store sensitive data — credentials, tokens, personal information — in locations accessible to other apps or attackers with physical device access. Common mistakes include storing data in external storage, unencrypted SQLite databases, or shared preferences. A technician enforces encryption, keychain/keystore usage, and secure data handling policies.",uc:2,depth:4,children:[]},{id:"uc2-mobile-trasmissione",title:"Trasmissione insicura",explanation:"Insecure transmission occurs when mobile apps send sensitive data over unencrypted or weakly encrypted channels. Mobile devices frequently connect to untrusted Wi-Fi networks where traffic can be intercepted. A technician enforces TLS for all communications, implements certificate pinning, and warns users about untrusted network connections.",uc:2,depth:4,children:[]},{id:"uc2-mobile-auth",title:"Autenticazione debole",explanation:"Weak authentication on mobile apps includes hardcoded credentials, predictable session tokens, biometric bypasses, and reliance on device-level security that can be compromised. A technician implements strong authentication for mobile apps, including MFA, secure token storage in the device keystore, and server-side session validation.",uc:2,depth:4,children:[]}]},{id:"uc2-mobile-permessi",title:"Modello permessi",explanation:"Mobile permission models control what resources and data an app can access. Modern mobile OSs require explicit user consent for sensitive permissions. Understanding and managing these permissions is essential for privacy and security.",uc:2,depth:3,children:[{id:"uc2-mobile-runtime",title:"Permessi runtime",explanation:"Runtime permissions are requested by apps when they need access to sensitive resources (camera, microphone, location, contacts) rather than at installation. Users can grant or deny each permission individually. A technician educates users on permission risks, reviews app permission requests, and uses mobile device management to restrict unnecessary permissions on corporate devices.",uc:2,depth:4,children:[]},{id:"uc2-mobile-sandboxing",title:"Sandboxing",explanation:"Mobile sandboxing isolates each app in its own restricted environment, preventing access to other apps’ data and system resources. iOS and Android implement sandboxing differently, but both aim to contain app compromise. A technician understands sandbox boundaries to identify apps that request excessive permissions or use sandbox escape vulnerabilities.",uc:2,depth:4,children:[]}]},{id:"uc2-mobile-mdm",title:"Mobile Device Management",explanation:"MDM is a software solution that enables organizations to manage, secure, and monitor mobile devices used by employees. MDM provides centralized control over device configuration, application deployment, and security policies.",uc:2,depth:3,children:[{id:"uc2-mdm-enrollment",title:"Enrollment",explanation:"Device enrollment registers a mobile device with the MDM platform, establishing the management relationship. Enrollment can be automated through Apple Business Manager or Android Zero-Touch, or user-initiated. A technician configures enrollment programs, ensures devices are enrolled before accessing corporate data, and verifies that enrollment is not bypassed.",uc:2,depth:4,children:[]},{id:"uc2-mdm-policy",title:"Policy enforcement",explanation:"Policy enforcement applies security configurations to managed devices: password requirements, encryption, app restrictions, network settings, and compliance rules. Policies are pushed from the MDM server and continuously monitored for compliance. A technician defines security policies, configures enforcement actions (warn, block, wipe), and monitors compliance dashboards.",uc:2,depth:4,children:[]},{id:"uc2-mdm-wipe",title:"Remote wipe",explanation:"Remote wipe commands the MDM platform to erase all data from a lost, stolen, or compromised device. Full wipe removes everything; selective wipe removes only corporate data and apps. A technician configures wipe capabilities, establishes procedures for reporting lost devices, and tests wipe functionality to ensure it works when needed.",uc:2,depth:4,children:[]},{id:"uc2-mdm-container",title:"Containerization",explanation:"Containerization creates a secure, isolated workspace on the device that stores corporate data and apps separately from personal content. Corporate containers are encrypted and managed independently. If the employee leaves, only the corporate container is wiped. A technician deploys containerization solutions that balance security with user privacy and experience.",uc:2,depth:4,children:[]}]},{id:"uc2-mobile-sideloading",title:"Sideloading e jailbreak",explanation:"Sideloading installs apps from outside official app stores; jailbreaking (iOS) and rooting (Android) remove manufacturer restrictions to gain full control over the device. These activities significantly increase security risk.",uc:2,depth:3,children:[{id:"uc2-mobile-sideload-risks",title:"Sideloading risks",explanation:"Sideloading bypasses the security vetting of official app stores, allowing installation of untrusted, potentially malicious applications. Sideloaded apps may request dangerous permissions, contain malware, or steal data. A technician blocks sideloading on corporate devices through MDM policies and educates users about the risks of installing apps from unknown sources.",uc:2,depth:4,children:[]},{id:"uc2-mobile-jailbreak-detect",title:"Jailbreak detection",explanation:"Jailbreak detection identifies whether a device has been compromised to remove iOS security protections. Jailbroken devices bypass app sandboxing, disable code signing checks, and grant root access to any process. A technician implements jailbreak detection in corporate apps, blocks access from jailbroken devices, and alerts security when jailbreak is detected.",uc:2,depth:4,children:[]},{id:"uc2-mobile-rooting",title:"Rooting",explanation:"Rooting is the Android equivalent of jailbreaking — gaining superuser access to the device by exploiting vulnerabilities or unlocking the bootloader. Rooted devices lose the security protections of the standard Android architecture, making them vulnerable to malware and data theft. A technician detects rooted devices and prevents corporate app access on compromised devices.",uc:2,depth:4,children:[]}]},{id:"uc2-mobile-network",title:"Mobile network attacks",explanation:"Mobile network attacks target the cellular communication infrastructure that mobile devices rely on for connectivity outside Wi-Fi. These attacks exploit legacy protocols and network design weaknesses.",uc:2,depth:3,children:[{id:"uc2-mobile-fake-base",title:"Fake base station",explanation:"A fake base station (IMSI catcher or rogue cell tower) impersonates a legitimate cellular tower to intercept mobile communications, track device locations, and potentially inject malicious content. These devices exploit the fact that phones connect to the strongest signal. A technician educates users about the risks and implements VPN requirements for mobile data access to encrypt traffic even on compromised networks.",uc:2,depth:4,children:[]},{id:"uc2-mobile-ss7",title:"SS7 vulnerabilities",explanation:"Signaling System 7 (SS7) is the protocol suite that enables cellular networks worldwide to interoperate for call routing, SMS delivery, and roaming. SS7 was designed without security and lacks authentication, allowing attackers who gain SS7 access to intercept calls and texts, track locations, and redirect communications. A technician implements end-to-end encryption (Signal, WhatsApp) as defense against SS7 interception.",uc:2,depth:4,children:[]},{id:"uc2-mobile-imsi",title:"IMSI catcher",explanation:"An IMSI catcher is a specific type of fake base station that captures the International Mobile Subscriber Identity (IMSI) from nearby phones. Law enforcement uses IMSI catchers legitimately, but criminals and foreign intelligence services deploy them for surveillance and tracking. A technician implements detection tools and requires encrypted communications that protect content even when IMSI is captured.",uc:2,depth:4,children:[]}]}]},{id:"uc2-database",title:"Database Security",explanation:"Database security protects the organization’s most critical asset — its data. Databases are high-value targets because they centralize large volumes of sensitive information. A technician implements defense-in-depth for database environments, covering hardening, access control, injection prevention, encryption, auditing, and backup.",uc:2,depth:2,children:[{id:"uc2-db-hardening",title:"Hardening",explanation:"Database hardening secures the database management system by reducing attack surface, applying patches, and eliminating insecure defaults.",uc:2,depth:3,children:[{id:"uc2-db-patch",title:"Patch e aggiornamenti",explanation:"Database patches fix security vulnerabilities in the database engine, libraries, and dependencies. Unpatched databases are prime targets because they often contain valuable data and may be exposed to the network. A technician maintains a patching schedule for database systems, tests patches in staging environments, and prioritizes patches for known exploited vulnerabilities.",uc:2,depth:4,children:[]},{id:"uc2-db-config",title:"Configurazione sicura",explanation:"Secure database configuration involves disabling unnecessary features, removing default accounts, restricting network access, enabling audit logging, and enforcing strong authentication. Database vendors often ship with insecure defaults for ease of use. A technician applies security configuration baselines, regularly audits configurations against benchmarks (CIS), and remediates drift.",uc:2,depth:4,children:[]},{id:"uc2-db-minimizzazione",title:"Minimizzazione funzionalità",explanation:"Feature minimization removes or disables database features, stored procedures, and extensions that are not required for the application. Each enabled feature is a potential attack surface — for example, xp_cmdshell in SQL Server or Java execution in Oracle. A technician identifies required features, disables everything else, and documents exceptions.",uc:2,depth:4,children:[]}]},{id:"uc2-db-access",title:"Access control",explanation:"Database access control restricts who can connect to the database, what objects they can access, and what operations they can perform. It is the primary defense against unauthorized data access.",uc:2,depth:3,children:[{id:"uc2-db-auth",title:"Autenticazione DB",explanation:"Database authentication verifies the identity of users and applications connecting to the database. Methods include native database accounts, OS authentication, LDAP/Active Directory integration, and Kerberos. A technician enforces strong authentication for database connections, integrates with central identity systems, and eliminates shared database accounts.",uc:2,depth:4,children:[]},{id:"uc2-db-authz",title:"Autorizzazione granulare",explanation:"Granular authorization assigns specific, minimal permissions to database users — read-only on specific tables, execute on specific procedures, no access to sensitive columns. This applies least privilege at the database level. A technician designs permission schemes that prevent users from accessing data beyond their role requirements and regularly audits permission assignments.",uc:2,depth:4,children:[]},{id:"uc2-db-row-level",title:"Row-level security",explanation:"Row-level security (RLS) restricts access to specific rows within a table based on user attributes or context. For example, a sales representative sees only their own customers’ records. RLS enforces access control at the data layer, independent of application logic. A technician implements RLS policies to ensure consistent data protection across all access paths.",uc:2,depth:4,children:[]}]},{id:"uc2-db-sql-injection",title:"SQL injection defense",explanation:"SQL injection is one of the most dangerous and common database attacks. Defending against it requires both application-level coding practices and database-level controls.",uc:2,depth:3,children:[{id:"uc2-db-param",title:"Parameterized queries",explanation:"Parameterized queries (prepared statements) separate SQL code from data by sending query structure and parameters separately to the database engine. The database treats parameters strictly as data, never as executable code. This is the most effective SQL injection defense. A technician ensures all database access in applications uses parameterized queries exclusively.",uc:2,depth:4,children:[]},{id:"uc2-db-stored-proc",title:"Stored procedures",explanation:"Stored procedures encapsulate database operations within the database server, reducing the attack surface by limiting direct table access. When properly implemented without dynamic SQL, stored procedures prevent injection. A technician reviews stored procedures for dynamic SQL usage, grants execute-only permissions, and uses them as part of a defense-in-depth strategy.",uc:2,depth:4,children:[]},{id:"uc2-db-input-validation",title:"Input validation",explanation:"Input validation ensures that all data received by the application conforms to expected formats before being processed. While not sufficient alone, input validation catches many injection attempts by rejecting malformed data. A technician implements whitelist-based validation on all inputs, rejecting anything that does not match expected patterns rather than attempting to blacklist dangerous characters.",uc:2,depth:4,children:[]},{id:"uc2-db-waf",title:"WAF database",explanation:"A Web Application Firewall (WAF) can detect and block SQL injection attempts at the application layer before they reach the database. WAFs use signature matching and behavioral analysis to identify malicious patterns. A technician deploys WAFs as an additional defense layer, understanding that WAFs are not a substitute for secure coding but provide valuable protection against known attack patterns.",uc:2,depth:4,children:[]}]},{id:"uc2-db-encryption",title:"Encryption",explanation:"Database encryption protects data from unauthorized access by rendering it unreadable without the encryption key. Encryption applies at different layers depending on the threat model.",uc:2,depth:3,children:[{id:"uc2-db-rest",title:"Encryption at rest",explanation:"Encryption at rest protects database files stored on disk from unauthorized access. It prevents data theft if physical storage is stolen or if an attacker gains access to backup files. Transparent Data Encryption (TDE) encrypts entire database files without application changes. A technician enables encryption at rest using database-native features or OS-level full-disk encryption.",uc:2,depth:4,children:[]},{id:"uc2-db-transit",title:"Encryption in transit",explanation:"Encryption in transit protects data as it travels between applications and the database. TLS should be enforced for all database connections to prevent eavesdropping and man-in-the-middle attacks. A technician configures the database to require TLS, validates certificates, and disables unencrypted connection options to prevent downgrade attacks.",uc:2,depth:4,children:[]},{id:"uc2-db-column",title:"Column-level encryption",explanation:"Column-level encryption encrypts specific sensitive columns (credit card numbers, personal data) independently of the rest of the database. It provides the finest granularity of protection and allows different keys for different data types. A technician implements column-level encryption for the most sensitive data, manages encryption keys separately from database access, and ensures that applications handle decryption securely.",uc:2,depth:4,children:[]}]},{id:"uc2-db-auditing",title:"Auditing e logging",explanation:"Database auditing records security-relevant events for compliance, forensic investigation, and anomaly detection. Audit logs are essential for detecting unauthorized access and reconstructing incidents.",uc:2,depth:3,children:[{id:"uc2-db-audit-trail",title:"Audit trail",explanation:"An audit trail is a chronological record of database activities: who accessed what data, when, from where, and what changes were made. Audit trails support compliance requirements, forensic investigations, and accountability. A technician configures comprehensive audit policies, protects audit logs from tampering, and forwards them to a centralized log management system.",uc:2,depth:4,children:[]},{id:"uc2-db-query-log",title:"Query logging",explanation:"Query logging records the actual SQL statements executed against the database. It is useful for performance analysis, troubleshooting, and detecting anomalous queries that may indicate injection attacks or unauthorized data access. A technician enables query logging selectively (due to performance and storage impact) and uses automated tools to analyze query patterns for anomalies.",uc:2,depth:4,children:[]},{id:"uc2-db-anomaly",title:"Anomaly detection",explanation:"Database anomaly detection identifies unusual patterns of access or behavior that may indicate compromise — queries from unexpected locations, access outside business hours, unusually large result sets, or schema modifications. A technician implements User and Entity Behavior Analytics (UEBA) for databases and configures alerts on anomalous patterns.",uc:2,depth:4,children:[]}]},{id:"uc2-db-backup",title:"Backup e recovery",explanation:"Database backup and recovery ensure that data can be restored after corruption, deletion, ransomware, or hardware failure. Backup strategy is a critical component of business continuity and disaster recovery.",uc:2,depth:3,children:[{id:"uc2-db-backup-strategy",title:"Backup strategico",explanation:"A strategic backup plan defines what to back up, how often, where to store backups, retention periods, and recovery procedures. The 3-2-1 rule (3 copies, 2 media types, 1 offsite) is a common guideline. A technician implements backup schedules, verifies backup integrity through test restores, and ensures that backup storage is encrypted and access-controlled.",uc:2,depth:4,children:[]},{id:"uc2-db-pitr",title:"Point-in-time recovery",explanation:"Point-in-time recovery (PITR) restores a database to a specific moment using a combination of a full backup and transaction log replay. PITR enables recovery to just before a corruption event or ransomware attack. A technician ensures that transaction logs are backed up continuously and that recovery procedures are documented and tested regularly.",uc:2,depth:4,children:[]},{id:"uc2-db-replication",title:"Replication",explanation:"Database replication creates and maintains copies of a database on separate servers for high availability, read scaling, and disaster recovery. Synchronous replication ensures zero data loss but adds latency; asynchronous replication offers better performance but may lose recent transactions. A technician configures replication, monitors replication lag, and plans failover procedures.",uc:2,depth:4,children:[]}]}]},{id:"uc2-remote",title:"Remote Access Security",explanation:"Remote access enables users to connect to organizational resources from outside the physical office. It is essential for modern work but creates significant security challenges: untrusted networks, unmanaged devices, and expanded attack surface. A technician secures all remote access channels.",uc:2,depth:2,children:[{id:"uc2-remote-protocolli",title:"Protocolli",explanation:"Remote access protocols define how connections are established, authenticated, and encrypted. Each protocol has distinct security characteristics and hardening requirements.",uc:2,depth:3,children:[{id:"uc2-remote-ssh",title:"SSH",explanation:"Secure Shell (SSH) provides encrypted command-line and file transfer access to remote systems. SSH is the primary remote administration protocol for Linux/Unix systems. While SSH itself is secure, misconfigurations — weak authentication, exposed ports, outdated versions — create vulnerabilities. A technician hardens SSH as a critical priority on all internet-facing systems.",uc:2,depth:4,children:[]},{id:"uc2-remote-rdp",title:"RDP",explanation:"Remote Desktop Protocol is Microsoft’s protocol for graphical remote access to Windows systems. RDP is a common attack vector because it provides full desktop access and is frequently exposed to the internet. A technician secures RDP through Network Level Authentication, gateway services, account lockout, and restricting exposure to VPN-only access.",uc:2,depth:4,children:[]},{id:"uc2-remote-vpn",title:"VPN",explanation:"Virtual Private Network creates an encrypted tunnel between a remote device and the corporate network, protecting all traffic from eavesdropping on untrusted networks. VPN protocols include IPsec, SSL/TLS VPN, and WireGuard. A technician deploys and manages VPN infrastructure, enforces device compliance checks before VPN connection, and monitors VPN logs for anomalies.",uc:2,depth:4,children:[]}]},{id:"uc2-remote-ssh-hardening",title:"SSH hardening",explanation:"SSH hardening applies specific security measures to Secure Shell services to prevent unauthorized access and brute force attacks.",uc:2,depth:3,children:[{id:"uc2-ssh-key",title:"Key-based authentication",explanation:"SSH key authentication uses cryptographic key pairs instead of passwords, providing stronger authentication that is immune to brute force and password-guessing attacks. The private key remains on the client; the public key is installed on the server. A technician enforces key-based authentication, disables password authentication, and protects private keys with strong passphrases and secure storage.",uc:2,depth:4,children:[]},{id:"uc2-ssh-root",title:"Disabilitare root login",explanation:"Disabling direct root login over SSH prevents attackers from targeting the most powerful account. Administrators must log in as an ordinary user and elevate privileges using su or sudo. This provides an audit trail and limits the impact of compromised credentials. A technician disables PermitRootLogin in sshd_config and enforces the use of unprivileged accounts for initial access.",uc:2,depth:4,children:[]},{id:"uc2-ssh-knock",title:"Port knocking",explanation:"Port knocking is a stealth technique where a client must connect to a specific sequence of closed ports before the SSH port is opened by the firewall. It hides the SSH service from port scanners and reduces automated attack traffic. A technician implements port knocking as an additional layer (not the sole defense) for high-security environments.",uc:2,depth:4,children:[]},{id:"uc2-ssh-fail2ban",title:"Fail2ban",explanation:"Fail2ban monitors log files for repeated failed authentication attempts and temporarily bans the source IP address by updating firewall rules. It is an effective defense against brute force and dictionary attacks. A technician configures Fail2ban for SSH and other services, tunes ban duration and attempt thresholds, and monitors for false positives.",uc:2,depth:4,children:[]}]},{id:"uc2-remote-rdp-hardening",title:"RDP hardening",explanation:"RDP hardening secures Remote Desktop services against the common attacks that target this protocol.",uc:2,depth:3,children:[{id:"uc2-rdp-nla",title:"Network Level Authentication",explanation:"Network Level Authentication (NLA) requires authentication before a full RDP session is established, reducing server resource consumption and preventing unauthenticated users from reaching the login screen. NLA should be enabled on all RDP servers. A technician verifies NLA is enabled and disables fallback to non-NLA connections.",uc:2,depth:4,children:[]},{id:"uc2-rdp-gateway",title:"Gateway RDP",explanation:"Remote Desktop Gateway (RD Gateway) provides a single point of access for RDP connections, eliminating the need to expose multiple internal systems directly to the internet. The gateway authenticates users, enforces policies, and proxies connections. A technician deploys RD Gateway with strong authentication and monitors gateway logs for unauthorized access attempts.",uc:2,depth:4,children:[]},{id:"uc2-rdp-timeout",title:"Session timeout",explanation:"Session timeout policies automatically disconnect idle RDP sessions after a defined period, reducing the window of opportunity for session hijacking and unauthorized use of abandoned sessions. A technician configures session timeouts, screen locks, and automatic logoff policies that balance security with user productivity.",uc:2,depth:4,children:[]}]},{id:"uc2-remote-vpn-sec",title:"VPN security",explanation:"VPN security ensures that the encrypted tunnel and authentication mechanisms provide adequate protection for remote access.",uc:2,depth:3,children:[{id:"uc2-vpn-tunnel",title:"Tunneling protocols",explanation:"VPN tunneling protocols — IPsec, OpenVPN, WireGuard, SSTP — encapsulate and encrypt traffic between endpoints. Each protocol offers different security, performance, and compatibility characteristics. A technician selects appropriate protocols based on the threat model, evaluates them against known vulnerabilities, and keeps VPN software updated.",uc:2,depth:4,children:[]},{id:"uc2-vpn-split",title:"Split vs full tunnel",explanation:"Full tunnel sends all traffic through the VPN, providing maximum security but consuming more bandwidth. Split tunnel sends only corporate traffic through the VPN while direct internet traffic bypasses it, improving performance but creating potential data leakage paths. A technician evaluates the trade-offs and enforces full tunnel for high-risk scenarios.",uc:2,depth:4,children:[]},{id:"uc2-vpn-always",title:"Always-on VPN",explanation:"Always-on VPN automatically connects the device to the VPN whenever an internet connection is available, ensuring that no traffic bypasses the corporate security controls. It prevents the common scenario where users forget to connect the VPN. A technician deploys always-on VPN on managed devices with automatic reconnection and device compliance verification.",uc:2,depth:4,children:[]}]},{id:"uc2-remote-bastion",title:"Bastion hosts",explanation:"A bastion host (jump server) is a hardened intermediary server that provides the sole access point to protected internal resources. All remote administrative access flows through the bastion, which is heavily monitored and secured.",uc:2,depth:3,children:[{id:"uc2-bastion-jump",title:"Jump server",explanation:"A jump server is a dedicated, hardened system that administrators connect to first, then connect from there to internal systems. The jump server acts as a controlled chokepoint for all administrative access. A technician hardens jump servers with minimal services, strong authentication, session recording, and access restricted to specific administrative roles.",uc:2,depth:4,children:[]},{id:"uc2-bastion-recording",title:"Session recording",explanation:"Session recording captures all activity during remote administrative sessions, creating an auditable record of every command executed and every screen viewed. Recordings are invaluable for forensic investigation, compliance auditing, and detecting insider threats. A technician implements session recording on all bastion and jump servers with tamper-protected storage.",uc:2,depth:4,children:[]},{id:"uc2-bastion-pam",title:"Privileged Access Management",explanation:"Privileged Access Management (PAM) solutions provide comprehensive control over administrative access: credential vaulting, session recording, just-in-time elevation, and approval workflows. PAM prevents administrators from knowing the actual passwords of privileged accounts. A technician deploys PAM solutions, integrates them with identity systems, and monitors privileged session activity.",uc:2,depth:4,children:[]}]}]},{id:"uc2-container",title:"Container & Orchestration Security",explanation:"Container and orchestration security protects containerized applications and their management platforms. Containers introduce unique security challenges: shared kernels, ephemeral workloads, complex supply chains, and the speed of deployment that can bypass security reviews. A technician implements security throughout the container lifecycle.",uc:2,depth:2,children:[{id:"uc2-container-isolation",title:"Container isolation",explanation:"Container isolation uses Linux kernel features (namespaces, cgroups, seccomp, capabilities) to restrict what a container can see and do. Unlike VMs, containers share the host kernel, so kernel vulnerabilities can lead to container escape. A technician configures isolation layers, drops unnecessary capabilities, applies seccomp profiles, and uses user namespaces to map container root to an unprivileged host user.",uc:2,depth:3,children:[]},{id:"uc2-container-image",title:"Image integrity",explanation:"Container image integrity ensures that the images used to create containers are authentic, unmodified, and free of vulnerabilities. Image signing (Notary, Cosign) cryptographically verifies image authenticity. A technician implements image scanning in the CI/CD pipeline, rejects images with critical vulnerabilities, and enforces signature verification before deployment.",uc:2,depth:3,children:[]},{id:"uc2-container-registry",title:"Registry security",explanation:"Container registries store and distribute container images. A compromised registry enables supply chain attacks where malicious images are distributed to production systems. A technician secures registries through access controls, vulnerability scanning, image signing, and network restrictions that limit who can push and pull images.",uc:2,depth:3,children:[]},{id:"uc2-container-runtime",title:"Runtime protection",explanation:"Container runtime protection monitors running containers for anomalous behavior: unexpected processes, network connections, file system modifications, or privilege escalation attempts. Runtime defense is the last line of defense when preventive controls fail. A technician deploys runtime security tools (Falco, etc.) that alert on policy violations and suspicious container activity.",uc:2,depth:3,children:[]},{id:"uc2-container-orchestration",title:"Orchestration hardening",explanation:"Orchestration platforms (Kubernetes, Docker Swarm) manage container deployment, scaling, and networking across clusters. They are high-value targets because compromising the orchestrator grants control over all managed workloads. A technician hardens orchestration through RBAC, network policies, pod security standards, API server authentication, and etcd encryption.",uc:2,depth:3,children:[]}]},{id:"uc2-soc",title:"Security Operations & SOC",explanation:"Security Operations is the organizational function responsible for monitoring, detecting, analyzing, and responding to cybersecurity events. The Security Operations Center (SOC) is the team and facility that executes these operations. A technician may work within or support the SOC with technical expertise.",uc:2,depth:2,children:[{id:"uc2-soc-structure",title:"SOC structure",explanation:"SOCs are typically organized in tiered levels that reflect increasing expertise and responsibility. Each tier handles different types of events and escalates complex incidents upward.",uc:2,depth:3,children:[{id:"uc2-soc-l1",title:"L1 Analyst",explanation:"Level 1 analysts are the first line of defense, monitoring alert queues, triaging incoming events, and following documented procedures for common incident types. They perform initial investigation, classify events by severity, and escalate complex or confirmed incidents to higher tiers. A technician at L1 level must know the monitoring tools, escalation criteria, and standard operating procedures thoroughly.",uc:2,depth:4,children:[]},{id:"uc2-soc-l2",title:"L2 Analyst",explanation:"Level 2 analysts perform deeper investigation of escalated incidents, conduct threat hunting, analyze malware, and develop new detection rules. They have stronger technical skills and broader security knowledge than L1. A technician at L2 level conducts root cause analysis, correlates events across multiple data sources, and mentors L1 analysts.",uc:2,depth:4,children:[]},{id:"uc2-soc-l3",title:"L3 Specialist",explanation:"Level 3 specialists handle the most complex incidents, advanced persistent threat (APT) investigations, and forensic analysis. They develop new methodologies, evaluate security tools, and participate in purple team exercises. A technician at L3 level leads incident response for major breaches, performs advanced forensics, and contributes to the organization’s strategic security capabilities.",uc:2,depth:4,children:[]}]},{id:"uc2-soc-workflows",title:"Workflows",explanation:"SOC workflows define the standardized procedures for handling security events, from initial alert to closure. Consistent workflows ensure that no steps are missed and that all analysts follow best practices.",uc:2,depth:3,children:[{id:"uc2-soc-ticketing",title:"Ticketing",explanation:"Ticketing systems track security events from detection through resolution, ensuring accountability and providing metrics for SOC performance. Every alert becomes a ticket with assigned ownership, priority, status, and timeline. A technician creates detailed tickets with evidence, investigation steps, and resolution documentation to support knowledge sharing and compliance.",uc:2,depth:4,children:[]},{id:"uc2-soc-playbooks",title:"Playbooks",explanation:"Playbooks are documented, step-by-step procedures for handling specific incident types — phishing investigation, malware containment, account compromise response. They ensure consistent, efficient handling of common events. A technician follows playbooks during incident response, suggests improvements based on experience, and helps create playbooks for new threat types.",uc:2,depth:4,children:[]},{id:"uc2-soc-escalation",title:"Escalation procedures",explanation:"Escalation procedures define when and how incidents are elevated to higher tiers, management, or external parties. Clear escalation paths prevent incidents from being under-resourced or delayed. A technician follows escalation criteria, communicates effectively during escalations, and documents the rationale for each escalation decision.",uc:2,depth:4,children:[]},{id:"uc2-soc-shift",title:"Shift operations",explanation:"SOC shift operations organize analyst coverage across 24/7 operations through scheduled shifts. Shift handoff procedures ensure that ongoing incidents are properly communicated between teams. A technician participates in shift rotations, maintains situational awareness through shift briefings, and documents all activities for the next shift’s continuity.",uc:2,depth:4,children:[]}]},{id:"uc2-soc-monitoring",title:"Security Monitoring",explanation:"Security monitoring is the continuous observation of systems, networks, and user activity to detect security events. It is the core function of the SOC and relies on technology platforms that aggregate, correlate, and analyze security data.",uc:2,depth:3,children:[{id:"uc2-soc-siem",title:"SIEM concepts",explanation:"A Security Information and Event Management (SIEM) system aggregates log data from across the organization, correlates events to identify threats, and provides dashboards and alerts for analyst investigation. The SIEM is the central nervous system of security operations. A technician configures log sources, writes detection rules, tunes correlation logic, and investigates SIEM alerts.",uc:2,depth:4,children:[]},{id:"uc2-soc-soar",title:"SOAR concepts",explanation:"Security Orchestration, Automation, and Response (SOAR) platforms automate repetitive security tasks, orchestrate responses across multiple tools, and provide case management for incidents. SOAR reduces analyst workload and accelerates response times. A technician develops SOAR playbooks, integrates security tools through APIs, and maintains automated response workflows.",uc:2,depth:4,children:[]},{id:"uc2-soc-log-aggregation",title:"Log aggregation",explanation:"Log aggregation collects log data from all relevant sources — firewalls, servers, applications, endpoints, cloud services — into a central repository. Centralized logging enables correlation across sources and provides a complete picture for investigation. A technician configures log forwarding agents, normalizes log formats, and ensures all security-relevant sources feed the aggregation platform.",uc:2,depth:4,children:[]},{id:"uc2-soc-triage",title:"Alert triage",explanation:"Alert triage is the process of reviewing incoming alerts to determine their validity, severity, and required response. Not all alerts indicate real incidents — many are false positives. Effective triage separates genuine threats from noise. A technician applies triage criteria, investigates alert context, and makes rapid decisions about escalation or closure.",uc:2,depth:4,children:[]},{id:"uc2-soc-fp",title:"False positive management",explanation:"False positives are alerts that incorrectly indicate a security event when no threat is present. Excessive false positives waste analyst time, cause alert fatigue, and may lead to real threats being ignored. A technician tunes detection rules, adjusts thresholds, provides feedback to detection engineering, and tracks false positive rates as a key SOC metric.",uc:2,depth:4,children:[]}]},{id:"uc2-soc-infra",title:"Infrastructure monitoring",explanation:"Infrastructure monitoring tracks the health, performance, and availability of IT systems. While primarily an operations function, infrastructure monitoring provides security value by detecting anomalies that may indicate compromise or attack.",uc:2,depth:3,children:[{id:"uc2-soc-metriche",title:"Metriche di sistema",explanation:"System metrics measure the operational state of infrastructure components. Security-relevant metrics reveal anomalies that may indicate attacks.",uc:2,depth:4,children:[{id:"uc2-soc-disp",title:"Disponibilità",explanation:"Availability metrics track system uptime and service accessibility. Unexpected downtime may indicate a denial-of-service attack, ransomware encryption, or system compromise. A technician monitors availability metrics, investigates unplanned outages for security causes, and implements redundancy to maintain availability under attack.",uc:2,depth:5,children:[]},{id:"uc2-soc-perf",title:"Performance",explanation:"Performance metrics (CPU, memory, disk I/O, network bandwidth) reveal resource consumption patterns. Sudden spikes may indicate cryptomining malware, data exfiltration, or DDoS impact. A technician establishes performance baselines, investigates deviations, and correlates performance anomalies with security events.",uc:2,depth:5,children:[]},{id:"uc2-soc-threshold",title:"Threshold allerta",explanation:"Alert thresholds define the values at which performance metrics trigger notifications. Thresholds must be set carefully: too low creates false positives; too high misses genuine problems. A technician adjusts thresholds based on baseline data, seasonality, and business requirements, and reviews them regularly as the environment changes.",uc:2,depth:5,children:[]}]},{id:"uc2-soc-centraliz",title:"Centralizzazione",explanation:"Monitoring centralization aggregates data from all systems into a single platform for unified visibility. Centralized monitoring enables correlation across the environment and reduces blind spots. A technician implements centralized monitoring solutions, ensures all critical systems report in, and maintains the monitoring infrastructure itself as a high-availability service.",uc:2,depth:4,children:[]},{id:"uc2-soc-dashboard",title:"Dashboard",explanation:"Dashboards visualize monitoring data in real-time, providing situational awareness for both operations and security teams. Effective dashboards highlight anomalies and trends without overwhelming viewers with raw data. A technician creates and maintains dashboards that display key security and performance indicators relevant to their responsibilities.",uc:2,depth:4,children:[]},{id:"uc2-soc-alerting",title:"Alerting",explanation:"Alerting generates notifications when metrics exceed thresholds or when specific events occur. Alert channels include email, SMS, chat notifications, and ticketing system integration. A technician configures alert rules, defines escalation chains, and maintains on-call schedules to ensure that critical alerts receive timely human response.",uc:2,depth:4,children:[]}]}]},{id:"uc2-incident",title:"Incident Management",explanation:"Incident management is the structured process of handling security incidents from detection through recovery and post-incident review. Effective incident management minimizes damage, reduces recovery time, and prevents recurrence. A technician plays an operational role throughout the incident lifecycle.",uc:2,depth:2,children:[{id:"uc2-incident-ciclo",title:"Ciclo di vita",explanation:"The incident lifecycle defines the phases of incident handling, from initial detection to final lessons learned. Each phase has specific objectives, activities, and deliverables.",uc:2,depth:3,children:[{id:"uc2-inc-rilevamento",title:"Rilevamento",explanation:"Detection is the identification of a potential security incident through automated alerts, user reports, threat intelligence, or manual observation. The speed of detection directly impacts the severity of an incident — the sooner a breach is detected, the less damage it causes. A technician optimizes detection capabilities and responds promptly to all alerts.",uc:2,depth:4,children:[]},{id:"uc2-inc-classificazione",title:"Classificazione",explanation:"Classification categorizes the incident by type (malware, data breach, DDoS, insider threat), severity (critical, high, medium, low), and impact scope. Classification determines the response team composition, communication requirements, and resource allocation. A technician contributes technical assessment to incident classification.",uc:2,depth:4,children:[]},{id:"uc2-inc-contenimento",title:"Contenimento",explanation:"Containment limits the scope and impact of an incident by isolating affected systems, blocking malicious traffic, and preventing further damage. Containment strategies can be short-term (immediate isolation) or long-term (segmenting the compromised network). A technician executes containment actions, prioritizing preservation of evidence while stopping the attack.",uc:2,depth:4,children:[]},{id:"uc2-inc-eradicazione",title:"Eradicazione",explanation:"Eradication removes the root cause of the incident — deleting malware, closing vulnerabilities, revoking compromised credentials, and removing attacker access. Eradication must be thorough because any remaining foothold allows the attacker to return. A technician performs technical eradication, verifies completeness through scanning, and documents all actions taken.",uc:2,depth:4,children:[]},{id:"uc2-inc-recupero",title:"Recupero",explanation:"Recovery restores affected systems to normal operation, verifies their integrity, and monitors for signs of reinfection. Recovery follows a prioritized plan that restores critical systems first. A technician executes recovery procedures, validates system integrity before reconnection, and maintains heightened monitoring during the recovery period.",uc:2,depth:4,children:[]},{id:"uc2-inc-review",title:"Post-incident review",explanation:"Post-incident review (lessons learned) analyzes what happened, how the response performed, and what improvements are needed. It produces actionable recommendations for preventing similar incidents and improving response capabilities. A technician contributes technical findings to the review and implements agreed-upon improvements to security controls.",uc:2,depth:4,children:[]}]},{id:"uc2-incident-ioc",title:"Indicatori compromissione (IoC)",explanation:"Indicators of Compromise are forensic artifacts that suggest a system has been breached. IoCs are used for detection, investigation, and threat intelligence sharing.",uc:2,depth:3,children:[{id:"uc2-ioc-rete",title:"IoC di rete",explanation:"Network IoCs include malicious IP addresses, domain names, URLs, user agents, and network traffic patterns. These indicators are used to block or detect malicious communications. A technician implements network IoCs in firewalls, DNS filters, and IDS/IPS systems, and validates IoC feeds to ensure they do not block legitimate traffic.",uc:2,depth:4,children:[]},{id:"uc2-ioc-sistema",title:"IoC di sistema",explanation:"System IoCs include file hashes, registry keys, file paths, process names, mutexes, and scheduled tasks associated with malware. These indicators are used to scan endpoints for known threats. A technician deploys system IoCs to endpoint protection platforms, EDR tools, and forensic scanning utilities for compromise assessment.",uc:2,depth:4,children:[]}]},{id:"uc2-incident-correlazione",title:"Correlazione eventi",explanation:"Event correlation links related security events across multiple sources to identify patterns that indicate coordinated attacks or complex threats.",uc:2,depth:3,children:[{id:"uc2-corr-aggregazione",title:"Aggregazione log",explanation:"Log aggregation collects security events from all systems into a central repository where they can be correlated and analyzed. Without aggregation, related events on different systems appear as isolated incidents. A technician ensures comprehensive log coverage, normalizes timestamps, and uses SIEM correlation rules to connect related events.",uc:2,depth:4,children:[]},{id:"uc2-corr-analisi",title:"Analisi eventi",explanation:"Event analysis examines aggregated logs to identify attack patterns: a scan followed by exploitation, credential use after hours, data access by an unusual account, and exfiltration to an unknown destination. A technician performs event analysis during investigations, using timeline reconstruction to understand the sequence of attacker actions.",uc:2,depth:4,children:[]}]},{id:"uc2-incident-comunicazione",title:"Comunicazione incidente",explanation:"Incident communication ensures that the right people are informed at the right time during a security incident. Communication includes internal escalation and external notification.",uc:2,depth:3,children:[{id:"uc2-inc-escalation",title:"Escalation interna",explanation:"Internal escalation notifies management, legal, HR, and other stakeholders based on incident severity and type. The escalation matrix defines who to notify at each severity level. A technician follows the escalation matrix, provides technical briefings to management, and ensures that communication is accurate and timely.",uc:2,depth:4,children:[]},{id:"uc2-inc-notifica",title:"Notifica esterna",explanation:"External notification communicates incidents to affected parties, regulators, law enforcement, and the public as required by law and policy. GDPR, NIS2, and breach notification laws mandate timely disclosure. A technician provides the technical details needed for accurate external notifications and coordinates with legal counsel on disclosure requirements.",uc:2,depth:4,children:[]}]}]},{id:"uc2-continuita",title:"Continuità operativa e disaster recovery",explanation:"Business continuity and disaster recovery ensure that critical business functions can continue during and after a disruptive event. While information security focuses on preventing incidents, business continuity prepares for when prevention fails. A technician implements the technical components of continuity plans.",uc:2,depth:2,children:[{id:"uc2-continuita-obiettivi",title:"Obiettivi ripristino",explanation:"Recovery objectives define the maximum acceptable downtime and data loss for each critical system. They guide the design of backup, replication, and failover strategies.",uc:2,depth:3,children:[{id:"uc2-continuita-rto",title:"RTO",explanation:"Recovery Time Objective (RTO) is the maximum acceptable time to restore a system or service after an outage. A low RTO (minutes to hours) requires high-availability architectures with automatic failover; a high RTO (days) may be acceptable for less critical systems with manual recovery from backups. A technician designs recovery solutions that meet the defined RTOs.",uc:2,depth:4,children:[]},{id:"uc2-continuita-rpo",title:"RPO",explanation:"Recovery Point Objective (RPO) is the maximum acceptable amount of data loss measured in time. A low RPO (seconds to minutes) requires continuous replication; a high RPO (hours to days) may be acceptable with periodic backups. A technician implements data protection strategies — backup frequency, replication modes — that ensure the actual data loss never exceeds the RPO.",uc:2,depth:4,children:[]}]},{id:"uc2-continuita-backup",title:"Strategie backup",explanation:"Backup strategies determine how data is copied, stored, and retained for recovery purposes. Different strategies offer trade-offs between storage efficiency, recovery speed, and complexity.",uc:2,depth:3,children:[{id:"uc2-backup-completo",title:"Completo",explanation:"A full backup copies all selected data to the backup storage. Full backups provide the simplest and fastest recovery because everything is in a single backup set. However, they require the most storage space and time. A technician performs full backups as the baseline for other strategies and as the foundation for complete system recovery.",uc:2,depth:4,children:[]},{id:"uc2-backup-incrementale",title:"Incrementale",explanation:"An incremental backup copies only data that has changed since the last backup (full or incremental). Incremental backups are fast and use minimal storage but require the full backup plus all subsequent incrementals for recovery. A technician uses incremental backups for frequent, efficient protection between full backups.",uc:2,depth:4,children:[]},{id:"uc2-backup-differenziale",title:"Differenziale",explanation:"A differential backup copies all data changed since the last full backup. Differential backups grow larger over time but require only the full backup and the latest differential for recovery — simpler than restoring a chain of incrementals. A technician uses differential backups when recovery simplicity is preferred over storage efficiency.",uc:2,depth:4,children:[]}]},{id:"uc2-continuita-ridondanza",title:"Ridondanza",explanation:"Redundancy eliminates single points of failure by providing duplicate components that can take over when the primary fails. Redundancy is essential for meeting low RTOs.",uc:2,depth:3,children:[{id:"uc2-ridondanza-hw",title:"Hardware",explanation:"Hardware redundancy duplicates physical components: power supplies, network interfaces, storage controllers, and entire servers. RAID arrays protect against disk failure; load balancers distribute across multiple servers; UPS systems protect against power loss. A technician implements hardware redundancy for critical systems and monitors redundant components for failures.",uc:2,depth:4,children:[]},{id:"uc2-ridondanza-geo",title:"Geografica",explanation:"Geographic redundancy maintains duplicate systems in physically separate locations to protect against regional disasters: earthquakes, floods, power grid failures. Geographic redundancy requires data replication between sites and automated or manual failover procedures. A technician implements geo-redundancy for the most critical systems, balancing the cost of maintaining duplicate infrastructure against the risk of regional loss.",uc:2,depth:4,children:[]}]},{id:"uc2-continuita-piano",title:"Piano continuità",explanation:"A business continuity plan documents the procedures, resources, and responsibilities for maintaining operations during a disruption and recovering afterward.",uc:2,depth:3,children:[{id:"uc2-bia",title:"Business Impact Analysis",explanation:"Business Impact Analysis (BIA) identifies critical business functions, determines their dependencies, and quantifies the impact of disruption over time. The BIA output prioritizes recovery efforts and informs RTO/RPO decisions. A technician contributes to BIA by identifying IT system dependencies, estimating technical recovery times, and mapping systems to business functions.",uc:2,depth:4,children:[]},{id:"uc2-continuita-test",title:"Test e validazione",explanation:"Testing validates that continuity plans work as intended by simulating failures and executing recovery procedures. Testing reveals gaps, trains staff, and builds confidence. A technician participates in tabletop exercises, technical recovery drills, and full-scale simulations. Test results drive plan updates and identify infrastructure improvements needed to meet recovery objectives.",uc:2,depth:4,children:[]}]}]},{id:"uc2-devsecops",title:"Sviluppo sicuro e DevSecOps",explanation:"DevSecOps integrates security practices into the software development and deployment pipeline. Rather than treating security as a final gate before production, DevSecOps embeds it throughout the development lifecycle — shifting security left to catch vulnerabilities earlier when they are cheaper to fix.",uc:2,depth:2,children:[{id:"uc2-dev-versione",title:"Controllo versione",explanation:"Version control tracks changes to source code and configuration files, enabling collaboration, rollback, and audit. Secure version control practices prevent unauthorized code changes and protect intellectual property.",uc:2,depth:3,children:[{id:"uc2-vcs-modello",title:"Modello distribuito vs centralizzato",explanation:"Distributed version control (Git) gives every developer a full copy of the repository, enabling offline work and multiple remote repositories. Centralized version control (SVN) maintains a single central server. Git dominates modern development but introduces risks: developers can push directly, history can be rewritten, and secrets can be distributed widely. A technician implements Git security: branch protection, signed commits, and secret scanning.",uc:2,depth:4,children:[]},{id:"uc2-vcs-branching",title:"Branching e merging",explanation:"Branching creates isolated lines of development for features, fixes, or releases. Merging integrates changes back to the main codebase. A technician implements branching strategies (GitFlow, trunk-based) that include security gates: code review requirements, automated testing, and approval workflows before merging to production branches.",uc:2,depth:4,children:[]},{id:"uc2-vcs-ssh",title:"Autenticazione remota SSH",explanation:"SSH authentication secures the connection between developers and version control repositories. SSH key pairs provide stronger authentication than passwords for Git operations.",uc:2,depth:4,children:[{id:"uc2-vcs-coppia",title:"Coppia chiavi",explanation:"An SSH key pair consists of a private key (kept secret on the developer’s machine) and a public key (registered with the Git server). This asymmetric authentication ensures that only holders of the private key can push code. A technician educates developers on SSH key generation, secure storage, and regular key rotation practices.",uc:2,depth:5,children:[]},{id:"uc2-vcs-id-rsa",title:"Chiave privata (id_rsa)",explanation:"The private SSH key (traditionally stored as id_rsa) is the credential that authenticates the developer to the Git server. If stolen, it grants the attacker the developer’s repository access. The private key represents the concept of asymmetric key-based authentication. A technician enforces passphrase protection on private keys, prohibits key sharing, and implements key rotation policies.",uc:2,depth:5,children:[]},{id:"uc2-vcs-id-rsa-pub",title:"Chiave pubblica (id_rsa.pub)",explanation:"The public SSH key (id_rsa.pub) can be freely shared and registered with any number of Git servers. It is used to verify signatures created with the corresponding private key. A technician ensures public keys are registered only for authorized users, implements key verification procedures, and maintains an inventory of registered keys.",uc:2,depth:5,children:[]}]},{id:"uc2-vcs-integrita",title:"Integrità repository",explanation:"Repository integrity ensures that code history is authentic and has not been tampered with. Signed commits (GPG or SSH signing) cryptographically verify the author’s identity and ensure the commit has not been modified. A technician enforces commit signing for production branches, implements verification in CI/CD pipelines, and protects the main branch from force pushes and deletions.",uc:2,depth:4,children:[]}]},{id:"uc2-dev-sdlc",title:"SDLC security",explanation:"Secure Software Development Lifecycle (SDLC) integrates security activities into each phase of software development: requirements, design, coding, testing, and deployment.",uc:2,depth:3,children:[{id:"uc2-sdlc-design",title:"Security by design",explanation:"Security by design embeds security considerations from the earliest stages of development rather than adding them as an afterthought. Requirements include security constraints; architecture includes security boundaries; design includes threat models. A technician participates in design reviews, identifies security requirements, and ensures that security is a first-class consideration in technical decisions.",uc:2,depth:4,children:[]},{id:"uc2-sdlc-threat-model",title:"Threat modeling",explanation:"Threat modeling is a structured process for identifying potential security threats to an application and designing countermeasures. Techniques like STRIDE categorize threats by type (Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege). A technician participates in threat modeling sessions, contributes technical expertise on attack vectors, and implements the countermeasures identified.",uc:2,depth:4,children:[]},{id:"uc2-sdlc-review",title:"Code review sicuro",explanation:"Secure code review examines source code for security vulnerabilities before deployment. Reviews can be manual (peer review) or automated (static analysis). A technician participates in secure code reviews, looking for common vulnerability patterns: injection flaws, authentication weaknesses, insecure deserialization, and cryptographic misconfigurations. Code review is one of the most effective ways to catch vulnerabilities before they reach production.",uc:2,depth:4,children:[]}]},{id:"uc2-dev-pipeline",title:"Pipeline Security",explanation:"Pipeline security secures the CI/CD pipeline itself and embeds s
